          '<div class="cu-posters">' + postersHtml + '</div>' +
          '<div class="cu-bar"><i style="width:' + st.pct + '%"></i></div>' +
          '<div class="cu-pills"><span class="cu-pill">' + st.watched + (st.total ? '/' + st.total : '') + ' Entries</span><span class="cu-pill">' + dirCount + (dirCount === 1 ? ' Director' : ' Directors') + '</span></div>' +
          '<div class="cu-card-acts">' +
            '<button type="button" class="btn" style="padding:8px 16px;font-size:13px" onclick="openUniverseDashboard(\'' + esc(u.id) + '\')">Universe Index</button>' +
            '<button type="button" class="ghost" style="padding:8px 14px;font-size:13px" onclick="ppState.open=true;ppState.page=1;render(true);var el=document.querySelector(\'.pp-stage\');if(el)el.scrollIntoView({behavior:\'smooth\'})">View Stamp</button>' +
          '</div>' +
        '</div>';
      }).join("") + '</div>';
    }
  } else {
    h += '<div class="glass cu-stage"><canvas id="cu-canvas" class="cu-canvas" aria-label="Interactive Cinematic Universes constellation map"></canvas>';
    h += '<div class="cu-hud-tl"><span class="cu-badge">' + films.length + (films.length === 1 ? ' star' : ' stars') + ' · ' + model.universes.length + (model.universes.length === 1 ? ' universe' : ' universes') + ' · ' + model.edges.length + ' verified links</span></div>';
    h += '<div class="cu-hud-tr"><button class="cu-zbtn" type="button" onclick="cuState.zoom=Math.min(4,cuState.zoom*1.25);drawConstellation()">+</button><button class="cu-zbtn" type="button" onclick="cuState.zoom=Math.max(0.3,cuState.zoom*0.8);drawConstellation()">−</button></div>';
    h += inspectorHTML();
    h += '<div class="cu-hud-bl"><div class="cu-legend"><span><i style="background:#fff;box-shadow:0 0 8px #fff"></i>Universe hub</span><span><i style="background:hsl(var(--h) 92% 68%)"></i>Watched film</span><span>— Universe link</span><span>┄ Cast / Crew link</span></div><span class="cu-badge">Click any star, line, or universe hub</span></div>';
    if (!films.length) h += '<div class="cu-empty"><div class="cu-seed"></div><p class="dim" style="margin:0">Log your first film to ignite the first star in your observatory.</p></div>';
    h += '</div>';
  }
  h += passportHTML(model);
  h += liveEntertainmentHTML();
  h += '</div>';
  return h;
}

/* ---- 3. Universes Page: Live Entertainment & Upcoming Releases Flash Cards ---- */
var liveFeed = {
  items: [],
  lastFetched: 0,
  loading: false,
  timerId: null,
  tickId: null
};
var LIVE_REFRESH_MS = 30 * 60 * 1000;

function formatLiveCountdown() {
  if (!liveFeed.lastFetched) return "Syncing feed…";
  var rem = Math.max(0, LIVE_REFRESH_MS - (Date.now() - liveFeed.lastFetched));
  var mins = Math.ceil(rem / 60000);
  var ts = new Date(liveFeed.lastFetched).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return "Updated " + ts + " · Next refresh in " + mins + "m";
}

function liveEntertainmentHTML() {
  var cards = liveFeed.items.length
    ? liveFeed.items.map(function(item) {
        var yr = item.release_date ? item.release_date : "TBA";
        var isUp = item._kind === "Upcoming Release";
        return '<button type="button" class="flash-card" data-id="' + item.id + '">' +
          (item.poster_path ? '<img loading="lazy" alt="" src="' + img(item.poster_path, "w185") + '">' : '<div class="f-ph"></div>') +
          '<div style="min-width:0;flex:1"><span class="flash-pill' + (isUp ? ' up' : '') + '">' + esc(item._kind) + '</span>' +
          '<span class="flash-title">' + esc(item.title) + '</span>' +
          '<div class="flash-meta">Release: ' + esc(yr) + (item.vote_average ? ' · ★ ' + item.vote_average.toFixed(1) : '') + '</div>' +
          '<div class="flash-meta" style="margin-top:4px">' + esc((item.overview || "Tap to inspect release details & credits.").slice(0, 74)) + '…</div></div></button>';
      }).join("")
    : '<p class="dim" style="margin:6px 0;font-size:13px">' + (liveFeed.loading ? "Fetching upcoming theatrical releases & trending entertainment…" : "Tap Refresh to load live releases.") + '</p>';

  return '<section class="glass live-feed" aria-label="Live Entertainment and Upcoming Releases">' +
    '<div class="live-head"><div><div class="cu-eyebrow"><i class="live-dot"></i>Live Entertainment & Upcoming Releases</div>' +
    '<div class="dim" id="live-ts" style="font-size:12px;margin-top:3px">' + esc(formatLiveCountdown()) + '</div></div>' +
    '<button type="button" class="ghost" onclick="refreshLiveFeed(true)" style="padding:6px 14px;font-size:13px">↻ Refresh now</button></div>' +
    '<div class="live-strip" id="live-strip">' + cards + '</div></section>';
}

function refreshLiveFeed(force) {
  if (liveFeed.loading) return;
  if (!force && liveFeed.lastFetched && (Date.now() - liveFeed.lastFetched) < (liveFeed.items.length ? LIVE_REFRESH_MS : 60000)) return;
  liveFeed.loading = true;
  var tsEl = $("live-ts");
  if (tsEl) tsEl.textContent = "Refreshing live entertainment feed…";

  Promise.all([
    api("movie/upcoming", { page: 1 }).catch(function() { return { results: [] }; }),
    api("trending/movie/day", { page: 1 }).catch(function() { return { results: [] }; })
  ]).then(function(res) {
    var seen = {}, merged = [], t = today();
    (res[0].results || []).forEach(function(m) {
      if (m && m.id && !seen[m.id] && (!m.release_date || m.release_date >= t)) {
        seen[m.id] = 1; m._kind = "Upcoming Release"; merged.push(m);
      }
    });
    (res[1].results || []).forEach(function(m) {
      if (m && m.id && !seen[m.id]) {
        seen[m.id] = 1; m._kind = "Trending Headline"; merged.push(m);
      }
    });
    if (!merged.length) {
      (res[0].results || []).forEach(function(m) {
        if (m && m.id && !seen[m.id]) { seen[m.id] = 1; m._kind = "Upcoming Release"; merged.push(m); }
      });
    }
    var changed = merged.slice(0, 14).length !== liveFeed.items.length;
    liveFeed.items = merged.slice(0, 14);
    liveFeed.lastFetched = Date.now();
    liveFeed.loading = false;
    if (view === "universes" && $("live-strip") && (changed || force)) render(true);
  }).catch(function() {
    liveFeed.loading = false;
    if (tsEl) tsEl.textContent = formatLiveCountdown();
  });
}

function ensureLiveFeedLoop() {
  refreshLiveFeed(false);
  if (!liveFeed.timerId) {
    liveFeed.timerId = setInterval(function() { refreshLiveFeed(true); }, LIVE_REFRESH_MS);
  }
  if (!liveFeed.tickId) {
    liveFeed.tickId = setInterval(function() {
      var tsEl = $("live-ts");
      if (tsEl && view === "universes") tsEl.textContent = formatLiveCountdown();
    }, 30000);
  }
}

function bindUniverseEvents() {
  var canvas = document.getElementById("cu-canvas");
  if (!canvas) return;
  var dragging = false, sx = 0, sy = 0, moved = false, pinchDist = 0;

  function distToSegment(px, py, x1, y1, x2, y2) {
    var l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
    if (!l2) return Math.hypot(px - x1, py - y1);
    var t = Math.max(0, Math.min(1, ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2));
    return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
  }

  canvas.onpointerdown = function(e) {
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY;
    canvas.classList.add("dragging");
  };
  canvas.onpointermove = function(e) {
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    cuState.panX += dx; cuState.panY += dy; sx = e.clientX; sy = e.clientY;
    drawConstellation();
  };
  canvas.onpointerup = function(e) {
    if (!dragging) return;
    dragging = false; canvas.classList.remove("dragging");
    if (moved) return;
    var rect = canvas.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var px = (e.clientX - rect.left) * dpr, py = (e.clientY - rect.top) * dpr;

    for (var i = 0; i < cuCache.hits.length; i++) {
      var h = cuCache.hits[i];
      if (Math.hypot(h.x - px, h.y - py) <= h.r) {
        if (h.type === "universe") { openUniverseDashboard(h.universe.id); return; }
        if (h.type === "film") { cuState.selected = { type: "film", id: h.node.film.tid, node: h.node }; render(true); return; }
      }
    }
    for (var j = 0; j < cuCache.edges.length; j++) {
      var eh = cuCache.edges[j];
      if (distToSegment(px, py, eh.x1, eh.y1, eh.x2, eh.y2) <= 10 * dpr) {
        cuState.selected = { type: "edge", id: eh.edge.id, edge: eh.edge };
        render(true);
        return;
      }
    }
  };
  canvas.onwheel = function(e) {
    e.preventDefault();
    cuState.zoom = Math.max(0.3, Math.min(4, cuState.zoom * (e.deltaY < 0 ? 1.14 : 0.88)));
    drawConstellation();
  };
  canvas.ontouchstart = function(e) {
    if (e.touches && e.touches.length === 2) {
      pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  };
  canvas.ontouchmove = function(e) {
    if (e.touches && e.touches.length === 2 && pinchDist > 0) {
      e.preventDefault();
      var nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      cuState.zoom = Math.max(0.3, Math.min(4, cuState.zoom * (nd / pinchDist)));
      pinchDist = nd;
      drawConstellation();
    }
  };
  drawConstellation();
}

/* ---- Cinemography: Personal Cinematic Identity & 9:16 Story Image Export ---- */
function analyzeCinemography() {
  var subRules = [
    ["Psychological horror", /psychological|paranoia|delusion|hallucination|mental/],
    ["Supernatural horror", /supernatural|ghost|haunting|demon|possession|exorcism/],
    ["Folk horror", /folk|cult|ritual|witchcraft|pagan|folklore/],
    ["Body horror", /body horror|mutation|infection|parasite/],
    ["Cosmic horror", /cosmic|eldritch|lovecraft|unknown force/],
    ["Found-footage horror", /found footage|mockumentary/],
    ["Occult horror", /occult|satanic|curse|demonology/],
    ["Neo-noir", /neo.noir|noir|detective/],
    ["Cyberpunk & Dystopia", /cyberpunk|dystopia|simulation|parallel universe|time travel/],
    ["Dark comedy", /dark comedy|black comedy|satire/],
    ["Social realism", /social realism|working class|family drama|coming of age/]
  ];
  var gMap = {}, sMap = {}, dMap = {}, cMap = {};
  films.forEach(function(f) {
    (f.genres || []).forEach(function(g) { gMap[g] = (gMap[g] || 0) + 1; });
    if (f.director) dMap[f.director] = (dMap[f.director] || 0) + 1;
    if (f.country) cMap[cname(f.country)] = (cMap[cname(f.country)] || 0) + 1;
    var text = ((f.title || "") + " " + (f.keywords || []).map(function(k) { return k.name || ""; }).join(" ")).toLowerCase();
    subRules.forEach(function(r) { if (r[1].test(text)) sMap[r[0]] = (sMap[r[0]] || 0) + 1; });
  });
  function rank(m) { return Object.keys(m).map(function(k) { return { name: k, count: m[k] }; }).sort(function(a, b) { return b.count - a.count; }); }
  var gs = rank(gMap), ss = rank(sMap), ds = rank(dMap), cs = rank(cMap);
  var model = buildConstellationModel();
  var topG = gs[0] ? gs[0].name : "Cinema";
  var topS = ss[0] ? ss[0].name : null;
  var outlier = gs.length > 2 ? gs[gs.length - 1].name : null;

  var quote = films.length
    ? "“Every frame you return to leaves a trace of the worlds you trust.”"
    : "“An empty reel holds every possible story.”";

  var portrait = !films.length
    ? "Your Cinemography is ready to take shape. Once you log films, this catalogue will reflect the recurring genres, verified subgenres, filmmakers, and universes present in your actual viewing log."
    : "Across " + films.length + (films.length === 1 ? " logged film" : " logged films") + ", your viewing history gravitates toward " +
      (topS ? topS.toLowerCase() + " within " + topG.toLowerCase() : topG.toLowerCase()) +
      (gs[1] ? ", balanced by " + gs[1].name.toLowerCase() : "") + ". " +
      (ds[0] && ds[0].count > 1 ? "You return noticeably to filmmaker " + ds[0].name + " (" + ds[0].count + " films), " : "Your log spans " + ds.length + (ds.length === 1 ? " director, " : " directors, ")) +
      (cs.length ? "drawing from " + cs.slice(0, 3).map(function(x) { return x.name; }).join(", ") + " cinema. " : "") +
      (model.universes.length ? "You have also charted " + model.universes.length + (model.universes.length === 1 ? " cinematic universe" : " cinematic universes") + " (" + model.universes.map(function(u) { return u.name; }).slice(0, 2).join(", ") + ")" : "Your selections lean toward standalone stories rather than single-franchise marathons") +
      (outlier ? ", while occasional turns into " + outlier.toLowerCase() + " keep your range unpredictable." : ".");

  return {
    total: films.length,
    genres: gs,
    subgenres: ss,
    directors: ds,
    countries: cs,
    universes: model.universes,
    quote: quote,
    portrait: portrait
  };
}

function cinematographyHTML() {
  var c = analyzeCinemography();
  return '<div class="cg-wrap">' +

    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportCinemographyStory()">Export Instagram Story (9:16 PNG)</button></div></div>' +

    (c.subgenres.concat(c.genres).slice(0, 12).map(function(x) { return '<span class="cg-tag">' + esc(x.name) + ' · ' + x.count + '</span>'; }).join("") || '<span class="dim">Log films to reveal verified genre and subgenre tags.</span>') +
    '</div><p class="dim" style="font-size:12px;margin:14px 0 0">Note: Your profile is stored locally in this browser (localStorage), so exporting a 9:16 PNG image is the cleanest way to share your Cinemography across platforms.</p></div></div>';
}

function exportCinemographyStory() {
  var c = analyzeCinemography();
  var canvas = document.createElement("canvas");
  canvas.width = 1080; canvas.height = 1920;
  var ctx = canvas.getContext("2d");

  var bg = ctx.createLinearGradient(0, 0, 1080, 1920);
  bg.addColorStop(0, "#14081c"); bg.addColorStop(0.5, "#06060e"); bg.addColorStop(1, "#180a16");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 1080, 1920);

  for (var i = 0; i < 140; i++) {
    ctx.fillStyle = "rgba(255,255,255," + (0.08 + (i % 5) * 0.03) + ")";
    ctx.beginPath(); ctx.arc((i * 193) % 1080, (i * 311) % 1920, (i % 3) + 0.8, 0, Math.PI * 2); ctx.fill();
  }

  ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 2;
  ctx.strokeRect(56, 56, 968, 1808);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff"; ctx.font = "700 34px Georgia, serif";
  ctx.fillText("F O U R T H   W A L L", 540, 145);
  ctx.fillStyle = "#d5b8ff"; ctx.font = "700 22px Arial, sans-serif";
  ctx.fillText("PERSONAL CINEMOGRAPHY · " + avatar.name.toUpperCase(), 540, 205);

  ctx.fillStyle = "#f2dfff"; ctx.font = "italic 34px Georgia, serif";
  var qWords = c.quote.split(" "), qLine = "", qY = 360;
  qWords.forEach(function(w) {
    var test = qLine ? qLine + " " + w : w;
    if (ctx.measureText(test).width > 860 && qLine) { ctx.fillText(qLine, 540, qY); qY += 48; qLine = w; }
    else qLine = test;
  });
  if (qLine) ctx.fillText(qLine, 540, qY);

  ctx.fillStyle = "rgba(246,242,251,0.92)"; ctx.font = "400 30px Arial, sans-serif";
  var pWords = c.portrait.split(" "), pLine = "", pY = 580;
  pWords.forEach(function(w) {
    var test = pLine ? pLine + " " + w : w;
    if (ctx.measureText(test).width > 860 && pLine) { ctx.fillText(pLine, 540, pY); pY += 46; pLine = w; }
    else pLine = test;
  });
  if (pLine && pY < 1260) ctx.fillText(pLine, 540, pY);

  var boxes = [
    [String(c.total), "FILMS LOGGED"],
    [c.genres[0] ? c.genres[0].name.toUpperCase() : "—", "TOP GENRE"],
    [String(c.universes.length), "UNIVERSES"],
    [c.directors[0] ? c.directors[0].name.toUpperCase() : "—", "TOP DIRECTOR"]
  ];
  boxes.forEach(function(b, idx) {
    var bx = 110 + (idx % 2) * 440, by = 1320 + Math.floor(idx / 2) * 190;
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    ctx.fillRect(bx, by, 420, 160);
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.strokeRect(bx, by, 420, 160);
    ctx.fillStyle = "#ffffff"; ctx.font = "800 34px Arial, sans-serif";
    ctx.fillText(b[0].slice(0, 18), bx + 210, by + 76);
    ctx.fillStyle = "rgba(243,241,250,0.68)"; ctx.font = "600 18px Arial, sans-serif";
    ctx.fillText(b[1], bx + 210, by + 122);
  });

  ctx.fillStyle = "rgba(243,241,250,0.65)"; ctx.font = "600 20px Arial, sans-serif";
  ctx.fillText("FOURTH WALL · PERSONAL CINEMATIC OBSERVATORY", 540, 1805);

  canvas.toBlob(function(blob) {
    if (!blob) return;
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "fourth-wall-cinemography.png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
  }, "image/png");
}
