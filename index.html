<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fourth wall</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Cinzel:wght@600;700;800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
@property --h{syntax:"<number>";inherits:true;initial-value:230}
@property --h2{syntax:"<number>";inherits:true;initial-value:270}
@property --s1{syntax:"<percentage>";inherits:true;initial-value:62%}
@property --s2{syntax:"<percentage>";inherits:true;initial-value:52%}
@property --a1{syntax:"<number>";inherits:true;initial-value:0.65}
@property --a2{syntax:"<number>";inherits:true;initial-value:0.52}

:root{--h:230;--h2:270;--s1:62%;--s2:52%;--a1:0.65;--a2:0.52;--bg:#05050b;--ink:#f3f1fa;--dim:rgba(243,241,250,.64);--glass:rgba(255,255,255,.075);--edge:rgba(255,255,255,.17);color-scheme:dark;transition:--h 1.2s cubic-bezier(.22,1,.36,1),--h2 1.2s cubic-bezier(.22,1,.36,1),--s1 1.2s ease,--s2 1.2s ease,--a1 1.2s ease,--a2 1.2s ease}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(var(--s1,62%) 52% at 12% 10%,hsl(var(--h) 96% 48%/var(--a1,.65)),transparent 70%),
  radial-gradient(var(--s2,52%) 48% at 90% 86%,hsl(var(--h2) 94% 46%/var(--a2,.52)),transparent 70%),
  radial-gradient(40% 35% at 62% 28%,hsl(var(--h2) 85% 36%/.22),transparent 72%)}

/* Distant Blurry Deep-Space Stars */
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#stars i{position:absolute;border-radius:50%;background:#fff;animation:tw var(--td,4.5s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes tw{0%,100%{opacity:var(--lo,.14)}50%{opacity:var(--hi,.65)}}
@media (prefers-reduced-motion:reduce){
  #stars i,.band::after,.bub{animation:none!important}
  .row-track,.pc,.gb,.mood-card,#panel,#ov,.fab,.view-stage{transition:none!important;animation:none!important}
}

main{max-width:1100px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 140px}
@media (min-width:1001px){main{max-width:none;margin:0 0 0 218px;padding-right:44px}}
.view-stage{animation:viewIn .36s cubic-bezier(.22,1,.36,1) backwards}
.view-stage.still{animation:none}
.view-stage.leave{animation:none;opacity:0;transform:translateY(-8px);transition:opacity .15s ease-out,transform .15s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h1,h2,h3,.num{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);border:1px solid var(--edge);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 40px rgba(0,0,0,.38)}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .26s cubic-bezier(.22,1,.36,1),background .28s ease,border-color .28s ease,color .28s ease,box-shadow .28s ease}
button:active{transform:scale(.965)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Grand Cinema Masthead */
.brand{font-family:"Cinzel",Georgia,serif;font-size:clamp(30px,5.2vw,50px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.05;margin:4px 0 26px;background:linear-gradient(180deg,#ffffff 15%,rgba(243,241,250,.68) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 10px 34px rgba(0,0,0,.45)}
.pg{font-size:34px;font-weight:800;margin-bottom:16px}

/* Hero + Right Square Mood Avatar Slot */
.hero-row{display:flex;align-items:stretch;gap:16px;margin-bottom:30px;max-width:1040px}
.hero{flex:1;padding:34px 28px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.hero h2{font-size:clamp(32px,6vw,60px);font-weight:800;line-height:1.02;letter-spacing:-.02em;max-width:14ch}
.hero p,.dim{color:var(--dim)}.hero p{margin:14px 0 0;max-width:48ch}

.mood-card{flex:0 0 196px;width:196px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;position:relative;overflow:hidden;border-radius:24px}
.mood-card:hover{border-color:rgba(255,255,255,.38);transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 22px 44px rgba(0,0,0,.45)}
.mood-card::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 35%,hsl(var(--h) 85% 58%/.28),transparent 68%);pointer-events:none}
.mood-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);position:relative;z-index:1}
.mood-orb{width:92px;height:92px;border-radius:50%;overflow:hidden;border:1.5px solid rgba(255,255,255,.28);box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 28px hsl(var(--h) 85% 55%/.35);display:grid;place-items:center;background:rgba(255,255,255,.09);position:relative;z-index:1;transition:transform .34s cubic-bezier(.22,1,.36,1)}
.mood-card:hover .mood-orb{transform:scale(1.05)}
.mood-orb img{width:100%;height:100%;object-fit:cover;display:block}
.mood-orb svg{width:56px;height:56px;display:block}
.mood-name{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:15px;line-height:1.15;position:relative;z-index:1}
.mood-sub{font-size:11px;color:var(--dim);position:relative;z-index:1}
@media (max-width:680px){.hero-row{flex-direction:column}.mood-card{flex:none;width:100%;flex-direction:row;text-align:left;padding:16px 20px;gap:14px}.mood-orb{width:64px;height:64px;flex:none}.mood-meta{flex:1;min-width:0}}

.sec{font-size:20px;font-weight:800;margin:8px 0 12px}

/* Scrollbar-Free Horizontal Rows + Curved Cylindrical Right-Arrow Carousel */
.row-shell{position:relative;margin-bottom:16px;perspective:1100px}
.row-track{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:6px 48px 14px 2px;scrollbar-width:none;-ms-overflow-style:none;transform-style:preserve-3d;transition:transform .46s cubic-bezier(.22,1,.36,1)}
.row-track::-webkit-scrollbar{display:none;width:0;height:0}
.row-track.curving{transform:rotateY(-5deg);will-change:transform}

.row-next{position:absolute;right:6px;top:44%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(14,14,24,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.26);color:#fff;display:grid;place-items:center;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.55);opacity:.9}
.row-next:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.55);transform:translateY(-50%) scale(1.08);opacity:1}
.row-next:active{transform:translateY(-50%) scale(.95)}
.row-next svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.3;fill:none}

.rs{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 18px;margin-bottom:12px;scrollbar-width:none;-ms-overflow-style:none}
.rs::-webkit-scrollbar{display:none}
.rs.wrap{flex-wrap:wrap;overflow:visible}

.pc{flex:0 0 150px;width:150px;padding:0;overflow:hidden;text-align:left;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.pc:hover{transform:translateY(-4px)}
.pc img,.pc .ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.pc:hover img{transform:scale(1.035)}
.pc .ph{display:flex;align-items:flex-end;padding:12px;font:800 18px/1.1 "Bricolage Grotesque",system-ui,sans-serif;background:linear-gradient(160deg,#3b3b66,#12121f)}
.pc span{display:block;padding:9px 10px 11px;font-size:13px;line-height:1.3}

/* Navigation Dock & Animated FAB */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:999px;z-index:4}
.dock button{background:none;border:0;border-radius:999px;padding:10px 24px;color:var(--dim)}
.dock button[aria-pressed=true]{background:rgba(255,255,255,.16);color:var(--ink)}
.fab{position:fixed;right:26px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.94);color:#0a0a12;border:0;font-size:34px;line-height:1;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 40px hsl(var(--h) 90% 55%/.5);transition:transform .42s cubic-bezier(.34,1.56,.64,1),box-shadow .35s ease,background .25s ease}
.fab:hover{transform:scale(1.07)}
.fab.open{transform:rotate(135deg) scale(1.04);background:#fff}

.seg{display:inline-flex;flex-wrap:wrap;padding:4px;gap:2px;border-radius:24px;margin-bottom:20px}
.seg button{background:none;border:0;padding:7px 16px;border-radius:999px;color:var(--dim)}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.16);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:30px;max-width:1000px}
.stat{padding:20px 22px}.stat small{color:var(--dim)}
.num{font-size:32px;font-weight:800;margin-top:4px;line-height:1.1}
.dir{display:flex;gap:16px;align-items:center}
.face{width:68px;height:68px;border-radius:50%;flex:none;display:grid;place-items:center;object-fit:cover;overflow:hidden;font:800 24px "Bricolage Grotesque",system-ui,sans-serif;background:rgba(255,255,255,.14);border:1px solid var(--edge)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face svg{width:42px;height:42px;display:block}
.sil{background:radial-gradient(circle at 50% 36%,rgba(255,255,255,.4) 0 20%,transparent 21%),radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.35) 0 44%,transparent 45%),rgba(255,255,255,.06);filter:blur(2.5px)}
.dir .num{font-size:22px}.msg{font-size:15px;margin:4px 0}
.me{display:flex;align-items:center;gap:16px;margin-bottom:22px}.me .face{width:76px;height:76px;font-size:30px}.me h2{font-size:30px}
.avatar-trigger{padding:0;cursor:pointer;position:relative}
.avatar-trigger:hover{border-color:rgba(255,255,255,.45);transform:scale(1.04)}

/* Sidebar & Sealed Glass Gas-Chamber Pipe */
.side{position:fixed;left:20px;top:20px;bottom:100px;width:182px;padding:18px 16px;display:none;flex-direction:column;gap:14px;overflow:auto;z-index:2;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
@media (min-width:1001px){.side{display:flex}}
.side .who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;width:100%}.side .who .face{width:44px;height:44px;font-size:18px}.side .who .face svg{width:28px;height:28px}.side b{display:block;font-size:15px;line-height:1.2}.side small{color:var(--dim)}
.side h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-family:"Instrument Sans",sans-serif;font-weight:500}

.meter{display:flex;gap:14px;flex:1;min-height:240px;align-items:stretch}
.tube{position:relative;width:50px;flex:none;display:flex;flex-direction:column;align-items:center}
.rim{width:50px;height:9px;flex:none;border-radius:5px;border:2px solid rgba(255,255,255,.7);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.08));position:relative;z-index:6;margin-bottom:-2px}
.pipe{position:relative;width:40px;flex:1;border:2px solid rgba(255,255,255,.55);border-top:0;border-radius:0 0 20px 20px;background:rgba(255,255,255,.05);overflow:hidden;isolation:isolate;box-shadow:0 12px 26px rgba(0,0,0,.45),inset 0 -8px 14px rgba(255,255,255,.12)}
.pipe::before{content:"";position:absolute;z-index:5;left:5px;top:10px;bottom:24px;width:5px;border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.15) 70%,rgba(255,255,255,.4));pointer-events:none}
.pipe::after{content:"";position:absolute;z-index:5;right:5px;top:16px;bottom:32px;width:2px;border-radius:2px;background:rgba(255,255,255,.3);pointer-events:none}
.fill{position:absolute;left:0;right:0;bottom:0;top:12%;display:flex;flex-direction:column;z-index:1}
.fill.empty{opacity:.45}
.band{position:relative;flex:var(--f,1) 1 0;min-height:16px;overflow:hidden;background:linear-gradient(90deg,hsl(var(--c) 100% 46%),hsl(var(--c) 100% 62%) 45%,hsl(var(--c) 100% 50%))}
.band+.band{margin-top:-12px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%);mask-image:linear-gradient(180deg,transparent 0,#000 30%)}
.band::after{content:"";position:absolute;inset:-20% -40%;background:radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.4),transparent 55%);animation:wisp var(--dur,7s) ease-in-out infinite alternate}
@keyframes wisp{from{transform:translateX(-18%)}to{transform:translateX(18%)}}
.bub{position:absolute;bottom:8px;left:var(--x,10px);width:var(--sz,5px);height:var(--sz,5px);border-radius:50%;background:rgba(255,255,255,.8);z-index:3;opacity:0;animation:rise var(--bd,5s) linear infinite;animation-delay:var(--bl,0s)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-190px);opacity:0}}

.legend{display:flex;flex-direction:column;justify-content:center;gap:12px;font-size:13px;min-width:0;flex:1}
.legend div{display:flex;align-items:center;gap:7px}.legend em{width:9px;height:9px;border-radius:50%;flex:none;font-style:normal;box-shadow:0 0 8px currentColor}
.legend span{color:var(--dim);margin-left:auto}

/* Explore Page: Collectible Poster/Square-Card Genre Grid */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px;max-width:1040px}
.gb{aspect-ratio:4/5;padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background:linear-gradient(155deg,hsl(var(--gh) 88% 46%/.46),rgba(14,14,24,.65) 78%);transition:transform .36s cubic-bezier(.22,1,.36,1),border-color .3s ease,box-shadow .36s ease}
.gb::before{content:"";position:absolute;width:130px;height:130px;right:-26px;top:-26px;border-radius:50%;background:radial-gradient(circle,hsl(var(--gh) 95% 65%/.55),transparent 70%);filter:blur(8px);pointer-events:none;transition:transform .45s ease}
.gb:hover{transform:translateY(-5px) scale(1.015);border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 22px 42px rgba(0,0,0,.48)}
.gb:hover::before{transform:scale(1.22)}
.gb-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.gb-dot{width:12px;height:12px;border-radius:50%;background:hsl(var(--gh) 92% 64%);box-shadow:0 0 14px hsl(var(--gh) 92% 60%)}
.gb-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.gb-bot{position:relative;z-index:1}
.gb-name{display:block;font:800 22px/1.12 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.gb-sub{display:block;font-size:12px;color:var(--dim);margin-top:5px}

.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.bar h2{font-size:26px}
.chipsrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed=true]{background:rgba(255,255,255,.9);color:#0a0a12}

/* Modal Overlay & Panel Animation */
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,3,8,.68);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:6;opacity:0;pointer-events:none;transition:opacity .3s ease}
#ov.on{opacity:1;pointer-events:auto}
#panel{width:100%;max-width:780px;max-height:100%;overflow:auto;padding:24px;background:rgba(22,20,36,.92);transform:translateY(18px) scale(.965);transition:transform .38s cubic-bezier(.22,1,.36,1)}
#ov.on #panel{transform:translateY(0) scale(1)}
#panel h2{font-size:26px;margin-bottom:14px}
.inp{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;color:var(--ink);font:inherit;padding:12px 14px;margin-bottom:16px}

/* Avatar Picker Grid */
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-top:8px}
.av-item{background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.av-item:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.av-item[aria-pressed=true]{background:rgba(255,255,255,.22);border-color:#fff}
.av-item .av-pic{width:56px;height:56px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2)}
.av-item .av-pic img{width:100%;height:100%;object-fit:cover;display:block}
.av-item .av-pic svg{width:38px;height:38px}
.av-item span{font-size:12px;line-height:1.2;font-weight:500}
.av-item small{font-size:10px;color:var(--dim);line-height:1.1}

.detail{display:grid;grid-template-columns:210px 1fr;gap:24px}
.detail img,.detail .ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:18px;display:block}
.detail .ph{display:flex;align-items:flex-end;padding:14px;font:800 22px "Bricolage Grotesque",system-ui,sans-serif;background:linear-gradient(160deg,#3b3b66,#12121f)}
@media (max-width:620px){.detail{grid-template-columns:1fr}.detail img,.detail .ph{max-width:220px}}
.meta{color:var(--dim);margin:6px 0}.over{margin:12px 0;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.links div,.links a{background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;padding:8px 14px;color:var(--ink);text-decoration:none;font-size:14px}
.links small{display:block;color:var(--dim);font-size:12px}
.acts{display:flex;gap:10px;margin-top:16px}
.btn{background:rgba(255,255,255,.92);color:#0a0a12;border:0;border-radius:999px;padding:10px 22px;font-weight:500}
.ghost{background:none;border:1px solid var(--edge);border-radius:999px;padding:9px 18px}

.pc.glass,.stat.glass,.gb.glass{backdrop-filter:none;-webkit-backdrop-filter:none}
.pc.glass,.stat.glass{background:rgba(30,28,50,.66)}
body.locked main,body.locked .dock,body.locked .fab,body.locked .side{visibility:hidden}
.logo{display:block;height:clamp(56px,9vw,84px);width:auto;max-width:100%;flex:none}
.brandrow{display:flex;align-items:center;gap:16px;margin:4px 0 26px}.brandrow .brand{margin:0}
#authbox .logo{height:120px;margin:0 auto 10px}
#auth{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
#auth.on{display:flex}
#authbox{width:100%;max-width:380px;padding:28px;text-align:center}

#authbox h2{font-size:24px}
.err{color:#ff9a9a;font-size:13px;min-height:18px;margin:-6px 0 10px;text-align:left}
.full{width:100%!important;height:100%!important}
.cv-prev{width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto 14px;border:1.5px solid rgba(255,255,255,.3)}
.cv-prev svg{width:100%;height:100%;display:block}
.cv-lbl{font-size:13px;color:var(--dim);margin:12px 0 6px}
.cv-row{display:flex;flex-wrap:wrap;gap:8px}
.cv-row .chip{text-transform:capitalize}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.sw[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
#av-cats{margin-top:6px}

/* Cinema DNA View */
.dna-wrap{display:flex;flex-direction:column;gap:14px;max-width:1040px}
.dna-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.dna-prog{height:3px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:4px}
.dna-prog i{display:block;height:100%;background:linear-gradient(90deg,hsl(var(--h) 92% 62%),hsl(var(--h2) 92% 62%));transition:width .25s ease}
.dna-stage{position:relative;height:62vh;min-height:420px;max-height:680px;overflow:hidden;padding:0}
.dna-canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.dna-canvas.dragging{cursor:grabbing}
.dna-hud-tl{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:2;pointer-events:none}
.dna-badge{background:rgba(12,12,22,.72);border:1px solid var(--edge);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--dim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dna-hud-tr{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:2}
.dna-zbtn{width:36px;height:36px;border-radius:12px;background:rgba(14,14,26,.78);border:1px solid var(--edge);display:grid;place-items:center;font-size:18px;line-height:1}
.dna-zbtn:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
.dna-hud-bl{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:2}
.dna-pill{background:rgba(14,14,26,.78);border:1px solid var(--edge);border-radius:999px;padding:6px 13px;font-size:12px}
.dna-pill:hover{background:rgba(255,255,255,.16)}
.dna-pill[aria-pressed=true]{background:rgba(255,255,255,.9);color:#0a0a12;border-color:transparent}
.dna-hud-br{position:absolute;right:14px;bottom:14px;width:128px;height:92px;border-radius:14px;overflow:hidden;border:1px solid var(--edge);background:rgba(8,8,16,.82);z-index:2;pointer-events:none}
.dna-hud-br canvas{display:block;width:100%;height:100%}
.dna-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;pointer-events:none}
.dna-seed{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff 0%,hsl(var(--h) 95% 65%) 55%,transparent 100%);box-shadow:0 0 28px hsl(var(--h) 95% 60%/.85)}
.dna-list{padding:20px;display:flex;flex-direction:column;gap:18px}
.dna-grp h3{font-size:17px;margin-bottom:8px}
.dna-grp-items{display:flex;flex-wrap:wrap;gap:8px}
.dna-chip{background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:999px;padding:6px 12px;font-size:13px}
.dna-chip:hover{background:rgba(255,255,255,.16)}
@media (max-width:620px){
  .dna-stage{height:56vh;min-height:360px}
  .dna-hud-br{width:96px;height:72px}
  .dock button{padding:10px 15px;font-size:14px}
}

/* Distant Blurry Starfield + Deep Contrast Genre Aura */
function ensureStars(){
 var stars=$("stars");
 if(stars.children.length)return;
 for(var i=0;i<40;i++){
  var s=document.createElement("i"),far=i%3!==0;
  s.className=far?"far":"mid";
  s.style.left=(Math.random()*98+1).toFixed(2)+"%";
  s.style.top=(Math.random()*98+1).toFixed(2)+"%";
  var sz=far?(Math.random()*1.8+1.6):(Math.random()*1.6+2.2);
  s.style.width=s.style.height=sz.toFixed(1)+"px";
  s.style.setProperty("--td",(4.2+Math.random()*5).toFixed(1)+"s");
  s.style.setProperty("--dl",(-Math.random()*6).toFixed(1)+"s");
  s.style.setProperty("--lo",far?".10":".18");
  s.style.setProperty("--hi",far?".42":".68");
  stars.appendChild(s)}}

function paint(){
 ensureStars();
 var st=document.documentElement.style;
 if(!films.length){
  st.setProperty("--h",230);st.setProperty("--h2",270);
  st.setProperty("--s1","62%");st.setProperty("--s2","52%");
  st.setProperty("--a1","0.62");st.setProperty("--a2","0.50");
  return null}
 var recent=sorted().slice(0,12),bins={};
 recent.forEach(function(f){var h=filmHue(f),b=Math.round(h/30)%12;(bins[b]=bins[b]||[]).push(h)});
 var bk=Object.keys(bins).sort(function(a,b){return bins[b].length-bins[a].length});
 var c1=mix(bins[bk[0]]);
 /* Ensure strong contrasting second hue even if only one genre cluster exists */
 var c2=bk[1]!==undefined?mix(bins[bk[1]]):(c1+135)%360;
 if(Math.abs(((c2-c1+540)%360)-180)>135)c2=(c1+130)%360;
 var n1=bins[bk[0]].length,n2=bk[1]!==undefined?bins[bk[1]].length:0;
 var dominance=Math.min(1,n1/Math.max(1,recent.length));
 var sh=n2?n1/(n1+n2):.78;
 st.setProperty("--h",c1.toFixed(1));
 st.setProperty("--h2",c2.toFixed(1));
 st.setProperty("--s1",(36+54*sh).toFixed(1)+"%");
 st.setProperty("--s2",(34+52*(1-sh)).toFixed(1)+"%");
 st.setProperty("--a1",(0.54+0.26*dominance).toFixed(2));
 st.setProperty("--a2",(0.44+0.20*(1-dominance*0.4)).toFixed(2));
 return mostCommon(recent.map(function(f){return f.genres[0]}))}

/* ---- Cinema DNA (Helix, Branches, Links, Shared Roots, Mutation, LOD) ---- */
var dnaState = {
  zoom: 1,
  panX: 0,
  panY: 0,
  highlightRoot: null,
  listMode: false,
  lowDetail: false,
  growUntil: 0,
  backfillRunning: false,
  backfillDone: 0,
  backfillTotal: 0,
  backfillMsg: "",
  frameCount: 0,
  fpsSampleStart: 0
};
var dnaCache = { key: "", model: null, sprite: null, hits: [] };
var dnaAnimId = 0;

function seededRand(seed) {
  var s = (Math.abs(seed | 0) % 2147483647) || 1;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function getGlowSprite() {
  if (dnaCache.sprite) return dnaCache.sprite;
  var c = document.createElement("canvas");
  c.width = 64; c.height = 64;
  var g = c.getContext("2d");
  var grad = g.createRadialGradient(32, 32, 1, 32, 32, 30);
  grad.addColorStop(0, "rgba(255,255,255,0.95)");
  grad.addColorStop(0.35, "rgba(255,255,255,0.45)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  dnaCache.sprite = c;
  return c;
}

function extractFilmExtras(m) {
  var credits = m.credits || {};
  var crew = credits.crew || [];
  var castRaw = credits.cast || [];
  var cast = castRaw.slice(0, 5).map(function(p) {
    return { id: p.id, name: p.name };
  });
  var compObj = null;
  for (var i = 0; i < crew.length; i++) {
    var job = (crew[i].job || "").toLowerCase();
    if (job === "original music composer" || job === "composer" || job === "music") {
      compObj = { id: crew[i].id, name: crew[i].name };
      break;
    }
  }
  var writers = [];
  var seenW = {};
  for (var j = 0; j < crew.length; j++) {
    var wj = crew[j].job || "";
    if (wj === "Screenplay" || wj === "Writer" || wj === "Story") {
      if (!seenW[crew[j].name]) {
        seenW[crew[j].name] = 1;
        writers.push(crew[j].name);
      }
    }
  }
  var kwList = (m.keywords && (m.keywords.keywords || m.keywords.results)) || [];
  var keywords = kwList.slice(0, 5).map(function(k) {
    return { id: k.id, name: k.name };
  });
  return {
    cast: cast,
    composer: compObj,
    writers: writers,
    keywords: keywords,
    v: 2
  };
}

function backfillFilmDetails() {
  if (dnaState.backfillRunning || !films.length) return;
  var pending = [];
  for (var i = 0; i < films.length; i++) {
    if (!films[i].v || films[i].v < 2) pending.push(films[i]);
  }
  if (!pending.length) {
    dnaState.backfillMsg = "";
    return;
  }
  dnaState.backfillRunning = true;
  dnaState.backfillTotal = pending.length;
  dnaState.backfillDone = 0;
  dnaState.backfillMsg = "Filling in details (0/" + pending.length + ")…";
  updateDnaProgressUI();

  var idx = 0;
  var changed = false;

  function worker() {
    if (idx >= pending.length) return Promise.resolve();
    var item = pending[idx++];
    return api("movie/" + item.tid).then(function(m) {
      var exData = extractFilmExtras(m);
      item.cast = exData.cast;
      item.composer = exData.composer;
      item.writers = exData.writers;
      item.keywords = exData.keywords;
      if (!item.writer && exData.writers && exData.writers.length) {
        item.writer = exData.writers[0];
      }
      item.v = 2;
      changed = true;
      dnaState.backfillDone++;
      dnaState.backfillMsg = "Filling in details (" + dnaState.backfillDone + "/" + dnaState.backfillTotal + ")…";
      updateDnaProgressUI();
    }).catch(function() {
      dnaState.backfillDone++;
      updateDnaProgressUI();
    }).then(worker);
  }

  var workers = [];
  for (var w = 0; w < 3; w++) workers.push(worker());
  Promise.all(workers).then(function() {
    dnaState.backfillRunning = false;
    if (changed) {
      save();
      dnaCache.key = "";
      if (view === "dna") {
        buildDnaModel();
        requestDnaDraw();
      }
    }
    dnaState.backfillMsg = "";
    updateDnaProgressUI();
  });
}

function updateDnaProgressUI() {
  var bar = document.getElementById("dna-prog-bar");
  var lbl = document.getElementById("dna-prog-lbl");
  if (!bar || !lbl) return;
  if (dnaState.backfillRunning && dnaState.backfillTotal > 0) {
    var pct = Math.min(100, Math.round((dnaState.backfillDone / dnaState.backfillTotal) * 100));
    bar.style.width = pct + "%";
    lbl.textContent = dnaState.backfillMsg;
  } else {
    bar.style.width = "0%";
    lbl.textContent = "";
  }
}

function buildDnaModel() {
  var key = films.map(function(f) {
    return f.tid + ":" + (f.date || "") + ":" + (f.at || 0) + ":" + (f.v || 1);
  }).join("|");
  if (key === dnaCache.key && dnaCache.model) return dnaCache.model;

  var asc = films.slice().sort(function(a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.at || 0) - (b.at || 0);
  });

  var genreFreq = {}, countryFreq = {};
  asc.forEach(function(f) {
    var g0 = (f.genres && f.genres[0]) || "Drama";
    genreFreq[g0] = (genreFreq[g0] || 0) + 1;
    if (f.country) countryFreq[f.country] = (countryFreq[f.country] || 0) + 1;
  });

  var stepY = 58;
  var twistStep = 0.62;
  var radius = 64;
  var nodes = [];
  var strandA = [];
  var strandB = [];
  var totalSpanY = Math.max(240, asc.length * stepY + 180);

  for (var i = 0; i < asc.length; i++) {
    var f = asc[i];
    var y = (asc.length - 1 - i) * stepY - totalSpanY * 0.35;
    var ang = i * twistStep;
    var ax = Math.cos(ang) * radius;
    var bx = Math.cos(ang + Math.PI) * radius;
    var g0 = (f.genres && f.genres[0]) || "Drama";
    var h = hue(g0);
    var isMut = asc.length >= 4 && (genreFreq[g0] || 0) === 1 && (!f.country || (countryFreq[f.country] || 0) === 1);
    var mutHue = isMut ? ((h + 150) % 360) : h;

    strandA.push({ x: ax, y: y });
    strandB.push({ x: bx, y: y });
    nodes.push({
      film: f,
      index: i,
      x: 0,
      y: y,
      ax: ax,
      bx: bx,
      hue: mutHue,
      baseHue: h,
      isMutation: isMut,
      roots: []
    });
  }

  function groupBy(getter) {
    var map = {};
    nodes.forEach(function(n) {
      var k = getter(n.film);
      if (!k) return;
      if (!map[k]) map[k] = [];
      map[k].push(n);
    });
    return map;
  }

  var branches = [];
  var dirGroups = groupBy(function(f) { return f.director; });
  Object.keys(dirGroups).forEach(function(dir) {
    var arr = dirGroups[dir];
    if (arr.length < 2) return;
    var anchor = arr[Math.floor(arr.length / 2)];
    var side = branches.length % 2 === 0 ? 1 : -1;
    var thick = arr.length >= 3 ? Math.min(8, 3.2 + arr.length * 0.75) : 2.1;
    var len = Math.min(230, 85 + arr.length * 24);
    var endX = side * (radius + len);
    var endY = anchor.y - 26;
    branches.push({
      type: "director",
      label: arr.length >= 3 ? (dir.split(" ").pop() + " x" + arr.length) : dir,
      fullLabel: dir,
      count: arr.length,
      thick: thick,
      hue: anchor.hue,
      startX: side * radius * 0.8,
      startY: anchor.y,
      ctrlX: side * (radius + len * 0.55),
      ctrlY: anchor.y + 12,
      endX: endX,
      endY: endY,
      nodes: arr
    });
  });

  var coGroups = groupBy(function(f) { return f.country; });
  Object.keys(coGroups).forEach(function(co) {
    var arr = coGroups[co];
    if (arr.length < 2) return;
    var anchor = arr[0];
    var side = branches.length % 2 === 0 ? 1 : -1;
    var len = Math.min(180, 72 + arr.length * 16);
    branches.push({
      type: "country",
      label: cname(co) + " cinema",
      fullLabel: cname(co),
      count: arr.length,
      thick: Math.min(4.5, 1.6 + arr.length * 0.4),
      hue: anchor.hue,
      startX: side * radius * 0.75,
      startY: anchor.y + 10,
      ctrlX: side * (radius + len * 0.5),
      ctrlY: anchor.y + 24,
      endX: side * (radius + len),
      endY: anchor.y + 16,
      nodes: arr
    });
  });

  var links = [];
  for (var a = 0; a < nodes.length; a++) {
    for (var b = a + 1; b < Math.min(nodes.length, a + 14); b++) {
      var fa = nodes[a].film, fb = nodes[b].film;
      var sameWriter = fa.writer && fb.writer && fa.writer === fb.writer;
      var sameGenre = fa.genres && fb.genres && fa.genres[0] && fb.genres.indexOf(fa.genres[0]) >= 0;
      if (sameWriter || sameGenre) {
        links.push({
          x1: nodes[a].x, y1: nodes[a].y,
          x2: nodes[b].x, y2: nodes[b].y,
          strong: !!sameWriter
        });
      }
      if (links.length >= 260) break;
    }
    if (links.length >= 260) break;
  }

  var rootRegistry = {};
  function regRoot(id, label, kind, nIdx) {
    if (!rootRegistry[id]) {
      rootRegistry[id] = { id: id, label: label, kind: kind, nodeIndices: [] };
    }
    rootRegistry[id].nodeIndices.push(nIdx);
  }

  nodes.forEach(function(n, idx) {
    var f = n.film;
    var rnd = seededRand(f.tid || (idx + 1));
    var rList = [];
    if (Array.isArray(f.cast)) {
      f.cast.slice(0, 5).forEach(function(c) {
        if (c && c.name) {
          var rid = "actor:" + c.name;
          regRoot(rid, c.name, "actor", idx);
          rList.push({ id: rid, label: c.name, kind: "actor" });
        }
      });
    }
    if (f.writer) {
      var wrid = "writer:" + f.writer;
      regRoot(wrid, f.writer, "writer", idx);
      rList.push({ id: wrid, label: f.writer, kind: "writer" });
    }
    if (f.composer && f.composer.name) {
      var cmid = "composer:" + f.composer.name;
      regRoot(cmid, f.composer.name, "composer", idx);
      rList.push({ id: cmid, label: f.composer.name, kind: "composer" });
    }
    if (Array.isArray(f.keywords)) {
      f.keywords.slice(0, 5).forEach(function(k) {
        if (k && k.name) {
          var kwid = "theme:" + k.name;
          regRoot(kwid, k.name, "theme", idx);
          rList.push({ id: kwid, label: k.name, kind: "theme" });
        }
      });
    }

    rList.forEach(function(item, rIdx) {
      var spread = ((rIdx + 0.5) / Math.max(1, rList.length) - 0.5) * 96;
      var rx = n.x + spread + (rnd() - 0.5) * 14;
      var ry = n.y + 22 + rIdx * 5 + rnd() * 8;
      n.roots.push({
        id: item.id,
        label: item.label,
        kind: item.kind,
        x: rx,
        y: ry,
        nx: n.x,
        ny: n.y,
        hue: n.hue,
        sharedCount: 1
      });
    });
  });

  var sharedRoots = [];
  Object.keys(rootRegistry).forEach(function(rid) {
    var reg = rootRegistry[rid];
    if (reg.nodeIndices.length >= 2) {
      var sumX = 0, sumY = 0;
      reg.nodeIndices.forEach(function(ni) {
        sumX += nodes[ni].x;
        sumY += nodes[ni].y + 34;
        nodes[ni].roots.forEach(function(nr) {
          if (nr.id === rid) nr.sharedCount = reg.nodeIndices.length;
        });
      });
      sharedRoots.push({
        id: rid,
        label: reg.label,
        kind: reg.kind,
        count: reg.nodeIndices.length,
        mx: sumX / reg.nodeIndices.length,
        my: sumY / reg.nodeIndices.length,
        points: reg.nodeIndices.map(function(ni) {
          return { x: nodes[ni].x, y: nodes[ni].y + 10, hue: nodes[ni].hue };
        })
      });
    }
  });

  var model = {
    nodes: nodes,
    strandA: strandA,
    strandB: strandB,
    branches: branches,
    links: links,
    sharedRoots: sharedRoots,
    topY: asc.length ? nodes[nodes.length - 1].y - 50 : -120,
    botY: asc.length ? nodes[0].y + 80 : 120
  };
  dnaCache.key = key;
  dnaCache.model = model;
  return model;
}

function drawDnaCanvas() {
  var canvas = document.getElementById("dna-canvas");
  if (!canvas) return;
  var model = buildDnaModel();
  var rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;

  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var cw = Math.round(rect.width * dpr);
  var ch = Math.round(rect.height * dpr);
  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
  }

  var ctx = canvas.getContext("2d");
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cw, ch);

  if (!model.nodes.length) {
    ctx.restore();
    return;
  }

  var z = dnaState.zoom;
  var cx = cw * 0.5 + dnaState.panX * dpr;
  var cy = ch * 0.5 + dnaState.panY * dpr;
  var sprite = getGlowSprite();
  var hl = dnaState.highlightRoot;
  var now = Date.now();
  var reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
  var growing = !reduced && now < dnaState.growUntil;

  function nodeActive(n) {
    if (!hl) return true;
    for (var i = 0; i < n.roots.length; i++) {
      if (n.roots[i].id === hl) return true;
    }
    return false;
  }

  function inView(wx, wy, pad) {
    var sx = cx + wx * z * dpr;
    var sy = cy + wy * z * dpr;
    var p = (pad || 60) * z * dpr;
    return sx >= -p && sx <= cw + p && sy >= -p && sy <= ch + p;
  }

  if (!dnaState.lowDetail && z >= 0.45) {
    ctx.lineWidth = Math.max(0.6, 1 * dpr);
    for (var l = 0; l < model.links.length; l++) {
      var lk = model.links[l];
      if (!inView((lk.x1 + lk.x2) * 0.5, (lk.y1 + lk.y2) * 0.5, 140)) continue;
      ctx.strokeStyle = lk.strong ? "rgba(255,244,214,0.14)" : "rgba(255,255,255,0.055)";
      ctx.beginPath();
      ctx.moveTo(cx + lk.x1 * z * dpr, cy + lk.y1 * z * dpr);
      ctx.lineTo(cx + lk.x2 * z * dpr, cy + lk.y2 * z * dpr);
      ctx.stroke();
    }
  }

  function drawStrand(pts, alpha) {
    if (pts.length < 2) return;
    ctx.save();
    ctx.strokeStyle = "rgba(244, 224, 184, " + alpha + ")";
    ctx.lineWidth = Math.max(1.5, 2.4 * z * dpr);
    ctx.beginPath();
    var started = false;
    for (var i = 0; i < pts.length; i++) {
      var sx = cx + pts[i].x * z * dpr;
      var sy = cy + pts[i].y * z * dpr;
      if (sy < -120 * dpr || sy > ch + 120 * dpr) {
        started = false;
        continue;
      }
      if (!started) { ctx.moveTo(sx, sy); started = true; }
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.restore();
  }
  drawStrand(model.strandA, hl ? 0.25 : 0.68);
  drawStrand(model.strandB, hl ? 0.25 : 0.52);

  for (var b = 0; b < model.branches.length; b++) {
    var br = model.branches[b];
    if (!inView((br.startX + br.endX) * 0.5, (br.startY + br.endY) * 0.5, 180)) continue;
    var brAlpha = hl ? 0.22 : 0.72;
    ctx.save();
    ctx.strokeStyle = "hsla(" + br.hue + ", 88%, 62%, " + brAlpha + ")";
    ctx.lineWidth = Math.max(1.2, br.thick * Math.min(1.6, z) * dpr);
    ctx.beginPath();
    ctx.moveTo(cx + br.startX * z * dpr, cy + br.startY * z * dpr);
    ctx.quadraticCurveTo(
      cx + br.ctrlX * z * dpr, cy + br.ctrlY * z * dpr,
      cx + br.endX * z * dpr, cy + br.endY * z * dpr
    );
    ctx.stroke();

    for (var k = 0; k < Math.min(br.count, 5); k++) {
      var tx = br.endX + (k - 2) * 7;
      var ty = br.endY + (k % 2 === 0 ? -5 : 5);
      ctx.fillStyle = "hsla(" + br.hue + ", 95%, 70%, " + brAlpha + ")";
      ctx.beginPath();
      ctx.arc(cx + tx * z * dpr, cy + ty * z * dpr, Math.max(2, 3.2 * z * dpr), 0, Math.PI * 2);
      ctx.fill();
    }

    if (z >= 0.75 && br.label) {
      ctx.font = Math.round(11 * dpr) + 'px "Instrument Sans", sans-serif';
      ctx.fillStyle = "rgba(243,241,250," + (hl ? 0.3 : 0.85) + ")";
      ctx.fillText(br.label, cx + (br.endX + (br.endX >= 0 ? 8 : -54)) * z * dpr, cy + br.endY * z * dpr + 4 * dpr);
    }
    ctx.restore();
  }

  var hits = [];
  if (!dnaState.lowDetail && z >= 0.85) {
    for (var s = 0; s < model.sharedRoots.length; s++) {
      var sr = model.sharedRoots[s];
      var isSel = hl === sr.id;
      var sAlpha = hl ? (isSel ? 0.95 : 0.12) : 0.52;
      ctx.strokeStyle = "hsla(42, 90%, 72%, " + sAlpha + ")";
      ctx.lineWidth = Math.max(1, (isSel ? 2.2 : 1.2) * dpr);
      for (var p = 0; p < sr.points.length; p++) {
        var pt = sr.points[p];
        if (!inView(pt.x, pt.y, 120)) continue;
        ctx.beginPath();
        ctx.moveTo(cx + pt.x * z * dpr, cy + pt.y * z * dpr);
        ctx.quadraticCurveTo(
          cx + pt.x * z * dpr, cy + (sr.my - 12) * z * dpr,
          cx + sr.mx * z * dpr, cy + sr.my * z * dpr
        );
        ctx.stroke();
      }
      if (inView(sr.mx, sr.my, 80)) {
        var ringX = cx + sr.mx * z * dpr;
        var ringY = cy + sr.my * z * dpr;
        var ringR = Math.max(4, 5.5 * z * dpr);
        ctx.strokeStyle = isSel ? "#ffffff" : "rgba(255, 224, 150, 0.85)";
        ctx.lineWidth = 1.6 * dpr;
        ctx.beginPath();
        ctx.arc(ringX, ringY, ringR, 0, Math.PI * 2);
        ctx.stroke();

        hits.push({ type: "root", id: sr.id, label: sr.label, x: ringX, y: ringY, r: Math.max(12 * dpr, ringR * 2) });

        if (z >= 1.55) {
          ctx.font = Math.round(10.5 * dpr) + 'px "Instrument Sans", sans-serif';
          ctx.fillStyle = isSel ? "#ffffff" : "rgba(243,241,250,0.82)";
          ctx.fillText(sr.label, ringX + ringR + 4 * dpr, ringY + 3.5 * dpr);
        }
      }
    }
  }

  for (var i = 0; i < model.nodes.length; i++) {
    var n = model.nodes[i];
    if (!inView(n.x, n.y, 120)) continue;
    var active = nodeActive(n);
    var nAlpha = hl ? (active ? 1 : 0.16) : 1;
    var isNewest = growing && i === model.nodes.length - 1;
    var pulse = isNewest ? (0.7 + 0.3 * Math.sin(now / 110)) : 1;

    var sxA = cx + n.ax * z * dpr;
    var sxB = cx + n.bx * z * dpr;
    var sx = cx + n.x * z * dpr;
    var sy = cy + n.y * z * dpr;

    ctx.strokeStyle = "hsla(" + n.hue + ", 90%, 62%, " + (0.65 * nAlpha) + ")";
    ctx.lineWidth = Math.max(1.2, (n.isMutation ? 3 : 2) * z * dpr);
    ctx.beginPath();
    ctx.moveTo(sxA, sy);
    ctx.lineTo(sxB, sy);
    ctx.stroke();

    if (!dnaState.lowDetail && nAlpha > 0.25) {
      var gSize = (n.isMutation ? 36 : 20) * Math.max(0.7, Math.min(1.6, z)) * dpr * pulse;
      ctx.globalAlpha = (n.isMutation ? 0.65 : 0.34) * nAlpha;
      ctx.drawImage(sprite, sx - gSize * 0.5, sy - gSize * 0.5, gSize, gSize);
      ctx.globalAlpha = 1;
    }

    if (n.isMutation) {
      ctx.strokeStyle = "hsla(" + n.hue + ", 100%, 75%, " + (0.85 * nAlpha) + ")";
      ctx.lineWidth = 1.8 * dpr;
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(7, 9 * z * dpr), 0, Math.PI * 2);
      ctx.stroke();
    }

    var dotR = Math.max(3.2, (n.isMutation ? 6 : 4.6) * Math.min(1.5, z) * dpr);
    ctx.fillStyle = n.isMutation ? "#ffffff" : ("hsla(" + n.hue + ", 95%, 66%, " + nAlpha + ")");
    ctx.beginPath();
    ctx.arc(sx, sy, dotR, 0, Math.PI * 2);
    ctx.fill();

    hits.push({ type: "film", film: n.film, x: sx, y: sy, r: Math.max(14 * dpr, dotR * 2.4) });

    if (z >= 1.15 && nAlpha > 0.25) {
      ctx.font = Math.round(11.5 * dpr) + 'px "Instrument Sans", sans-serif';
      ctx.fillStyle = "rgba(243,241,250," + (0.9 * nAlpha) + ")";
      var tLbl = n.film.title + (n.film.year ? " (" + n.film.year + ")" : "");
      ctx.fillText(tLbl, sx + dotR + 6 * dpr, sy + 4 * dpr);

      if (!dnaState.lowDetail && z >= 1.35) {
        for (var r = 0; r < n.roots.length; r++) {
          var rt = n.roots[r];
          if (rt.sharedCount < 2 && z < 1.8) continue;
          var rHit = hl === rt.id;
          var rAlpha = hl ? (rHit ? 0.95 : 0.14) : 0.45;
          var rx = cx + rt.x * z * dpr;
          var ry = cy + rt.y * z * dpr;
          ctx.strokeStyle = "hsla(" + n.hue + ", 80%, 68%, " + rAlpha + ")";
          ctx.lineWidth = 1 * dpr;
          ctx.beginPath();
          ctx.moveTo(sx, sy + dotR);
          ctx.quadraticCurveTo(sx, ry - 4 * dpr, rx, ry);
          ctx.stroke();

          hits.push({ type: "root", id: rt.id, label: rt.label, x: rx, y: ry, r: 10 * dpr });

          if (z >= 1.8) {
            ctx.font = Math.round(9.5 * dpr) + 'px "Instrument Sans", sans-serif';
            ctx.fillStyle = rHit ? "#ffe699" : "rgba(243,241,250," + (0.72 * rAlpha) + ")";
            ctx.fillText(rt.label, rx + 4 * dpr, ry + 3 * dpr);
          }
        }
      }
    }
  }

  if (!dnaState.lowDetail && model.nodes.length) {
    var topN = model.nodes[model.nodes.length - 1];
    var tpx = cx + topN.x * z * dpr;
    var tpy = cy + (topN.y - 24) * z * dpr;
    for (var p = 0; p < 12; p++) {
      var px = tpx + Math.cos(p * 2.1) * (10 + (p % 4) * 7) * z * dpr;
      var py = tpy - (p % 5) * 7 * z * dpr;
      ctx.fillStyle = "hsla(" + topN.hue + ", 95%, 75%, " + (0.55 - (p % 5) * 0.09) + ")";
      ctx.beginPath();
      ctx.arc(px, py, Math.max(1.2, 2.2 * z * dpr), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
  dnaCache.hits = hits;

  drawDnaMinimap(model, cw, ch, cx, cy, z, dpr);

  if (!dnaState.fpsSampleStart) {
    dnaState.fpsSampleStart = now;
    dnaState.frameCount = 0;
  }
  dnaState.frameCount++;
  if (now - dnaState.fpsSampleStart > 2500) {
    var fps = (dnaState.frameCount * 1000) / (now - dnaState.fpsSampleStart);
    if (fps < 22 && !dnaState.lowDetail) dnaState.lowDetail = true;
    dnaState.fpsSampleStart = now;
    dnaState.frameCount = 0;
  }

  if (growing) {
    dnaAnimId = requestAnimationFrame(drawDnaCanvas);
  } else {
    dnaAnimId = 0;
  }
}

function drawDnaMinimap(model, cw, ch, cx, cy, z, dpr) {
  var mm = document.getElementById("dna-minimap");
  if (!mm || !model.nodes.length) return;
  var r = mm.getBoundingClientRect();
  if (!r.width || !r.height) return;
  var mw = Math.round(r.width * dpr);
  var mh = Math.round(r.height * dpr);
  if (mm.width !== mw || mm.height !== mh) { mm.width = mw; mm.height = mh; }
  var mctx = mm.getContext("2d");
  mctx.clearRect(0, 0, mw, mh);

  var spanY = Math.max(120, model.botY - model.topY);
  var scale = Math.min((mw - 16 * dpr) / 280, (mh - 12 * dpr) / spanY);
  var ox = mw * 0.5;
  var oy = mh * 0.5 - ((model.topY + model.botY) * 0.5) * scale;

  mctx.strokeStyle = "rgba(244,224,184,0.45)";
  mctx.lineWidth = 1.2 * dpr;
  mctx.beginPath();
  for (var i = 0; i < model.nodes.length; i++) {
    var nx = ox + model.nodes[i].x * scale;
    var ny = oy + model.nodes[i].y * scale;
    if (i === 0) mctx.moveTo(nx, ny);
    else mctx.lineTo(nx, ny);
  }
  mctx.stroke();

  var vx = ox + ((-cx) / (z * dpr)) * scale;
  var vy = oy + ((-cy) / (z * dpr)) * scale;
  var vw = (cw / (z * dpr)) * scale;
  var vh = (ch / (z * dpr)) * scale;
  mctx.strokeStyle = "rgba(255,255,255,0.85)";
  mctx.lineWidth = 1.2 * dpr;
  mctx.strokeRect(vx, vy, Math.max(8, vw), Math.max(8, vh));
}

function requestDnaDraw() {
  if (dnaAnimId) cancelAnimationFrame(dnaAnimId);
  dnaAnimId = requestAnimationFrame(drawDnaCanvas);
}

function dnaHTML() {
  var h = '<div class="dna-wrap">';
  h += '<div class="dna-head"><h1 class="pg" style="margin:0">Cinema DNA</h1>';
  h += '<div style="display:flex;gap:8px;align-items:center">';
  h += '<button class="ghost" data-dnalist="1" aria-pressed="' + (dnaState.listMode ? "true" : "false") + '">' + (dnaState.listMode ? "Helix view" : "List view") + '</button>';
  h += '<button class="ghost" data-dnareset="1">Reset view</button>';
  h += '</div></div>';
  h += '<div class="dna-prog"><i id="dna-prog-bar" style="width:0%"></i></div>';
  h += '<div class="dim" id="dna-prog-lbl" style="font-size:12px;min-height:16px">' + esc(dnaState.backfillMsg || "") + '</div>';

  if (dnaState.listMode) {
    var byDir = {};
    films.forEach(function(f) {
      var k = f.director || "Unknown director";
      (byDir[k] = byDir[k] || []).push(f);
    });
    h += '<div class="glass dna-list">';
    if (!films.length) {
      h += '<p class="dim">Log a film to plant the first rung.</p>';
    } else {
      Object.keys(byDir).forEach(function(dir) {
        h += '<div class="dna-grp"><h3>' + esc(dir) + ' (' + byDir[dir].length + ')</h3><div class="dna-grp-items">';
        byDir[dir].forEach(function(f) {
          h += '<button class="dna-chip" data-id="' + f.tid + '">' + esc(f.title) + (f.year ? " (" + f.year + ")" : "") + '</button>';
        });
        h += '</div></div>';
      });
    }
    h += '</div></div>';
    return h;
  }

  h += '<div class="glass dna-stage">';
  h += '<canvas id="dna-canvas" class="dna-canvas" aria-label="Interactive Cinema DNA helix"></canvas>';
  h += '<div class="dna-hud-tl">';
  h += '<span class="dna-badge" id="dna-zoom-badge">Zoom ' + dnaState.zoom.toFixed(1) + 'x · ' + films.length + (films.length === 1 ? " film" : " films") + '</span>';
  if (dnaState.highlightRoot) {
    h += '<span class="dna-badge" id="dna-hl-badge">Root: ' + esc(dnaState.highlightRoot.split(":").slice(1).join(":")) + '</span>';
  }
  h += '</div>';
  h += '<div class="dna-hud-tr">';
  h += '<button class="dna-zbtn" type="button" data-dnazoom="in" aria-label="Zoom in">+</button>';
  h += '<button class="dna-zbtn" type="button" data-dnazoom="out" aria-label="Zoom out">−</button>';
  h += '</div>';
  h += '<div class="dna-hud-bl">';
  if (dnaState.highlightRoot) {
    h += '<button class="dna-pill" type="button" data-dnaclearhl="1">Clear highlight</button>';
  }
  h += '<span class="dna-pill" style="pointer-events:none;opacity:.8">Drag to pan · Pinch or scroll to zoom</span>';
  h += '</div>';
  h += '<div class="dna-hud-br"><canvas id="dna-minimap" aria-hidden="true"></canvas></div>';
  if (!films.length) {
    h += '<div class="dna-empty"><div class="dna-seed"></div><p class="dim" style="margin:0">Log a film to plant the first rung.</p></div>';
  }
  h += '</div></div>';
  return h;
}

function bindDnaEvents() {
  var canvas = document.getElementById("dna-canvas");
  if (!canvas) return;
  var dragging = false, startX = 0, startY = 0, moved = false;
  var pinchDist = 0;

  function updateZoomBadge() {
    var b = document.getElementById("dna-zoom-badge");
    if (b) b.textContent = "Zoom " + dnaState.zoom.toFixed(1) + "x · " + films.length + (films.length === 1 ? " film" : " films");
  }

  function handleTap(clientX, clientY, isDouble) {
    var rect = canvas.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var px = (clientX - rect.left) * dpr;
    var py = (clientY - rect.top) * dpr;
    var best = null, bestD = Infinity;
    for (var i = 0; i < dnaCache.hits.length; i++) {
      var it = dnaCache.hits[i];
      var dx = it.x - px, dy = it.y - py;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= it.r && dist < bestD) { best = it; bestD = dist; }
    }
    if (!best) return;
    if (best.type === "film") {
      if (isDouble) {
        dnaState.zoom = Math.min(3.2, Math.max(1.6, dnaState.zoom * 1.45));
        var model = buildDnaModel();
        for (var n = 0; n < model.nodes.length; n++) {
          if (model.nodes[n].film.tid === best.film.tid) {
            dnaState.panX = -model.nodes[n].x * dnaState.zoom;
            dnaState.panY = -model.nodes[n].y * dnaState.zoom;
            break;
          }
        }
        updateZoomBadge();
        requestDnaDraw();
      } else {
        openDetail(best.film.tid);
      }
    } else if (best.type === "root") {
      dnaState.highlightRoot = (dnaState.highlightRoot === best.id) ? null : best.id;
      render(true);
    }
  }

  canvas.onpointerdown = function(e) {
    dragging = true; moved = false;
    startX = e.clientX; startY = e.clientY;
    canvas.classList.add("dragging");
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  };

  canvas.onpointermove = function(e) {
    if (!dragging) return;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    dnaState.panX += dx;
    dnaState.panY += dy;
    startX = e.clientX;
    startY = e.clientY;
    requestDnaDraw();
  };

  canvas.onpointerup = function(e) {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove("dragging");
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    if (!moved) handleTap(e.clientX, e.clientY, false);
  };

  canvas.ondblclick = function(e) {
    handleTap(e.clientX, e.clientY, true);
  };

  canvas.onwheel = function(e) {
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.14 : 0.88;
    dnaState.zoom = Math.max(0.35, Math.min(3.5, dnaState.zoom * factor));
    updateZoomBadge();
    requestDnaDraw();
  };

  canvas.ontouchstart = function(e) {
    if (e.touches && e.touches.length === 2) {
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.sqrt(dx * dx + dy * dy);
    }
  };

  canvas.ontouchmove = function(e) {
    if (e.touches && e.touches.length === 2 && pinchDist > 0) {
      e.preventDefault();
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var nd = Math.sqrt(dx * dx + dy * dy);
      dnaState.zoom = Math.max(0.35, Math.min(3.5, dnaState.zoom * (nd / pinchDist)));
      pinchDist = nd;
      updateZoomBadge();
      requestDnaDraw();
    }
  };

  requestDnaDraw();
}

</script>
</body>
</html>
