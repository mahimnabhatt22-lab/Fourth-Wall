<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fourth wall</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Cinzel:wght@600;700;800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
@property --h{syntax:"<number>";inherits:true;initial-value:230}
@property --h2{syntax:"<number>";inherits:true;initial-value:270}
@property --s1{syntax:"<percentage>";inherits:true;initial-value:62%}
@property --s2{syntax:"<percentage>";inherits:true;initial-value:52%}
@property --a1{syntax:"<number>";inherits:true;initial-value:0.65}
@property --a2{syntax:"<number>";inherits:true;initial-value:0.52}

:root{--h:230;--h2:270;--s1:62%;--s2:52%;--a1:0.65;--a2:0.52;--bg:#05050b;--ink:#f3f1fa;--dim:rgba(243,241,250,.64);--glass:rgba(255,255,255,.075);--edge:rgba(255,255,255,.17);color-scheme:dark;transition:--h 1.2s cubic-bezier(.22,1,.36,1),--h2 1.2s cubic-bezier(.22,1,.36,1),--s1 1.2s ease,--s2 1.2s ease,--a1 1.2s ease,--a2 1.2s ease}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(var(--s1,62%) 52% at 12% 10%,hsl(var(--h) 96% 48%/var(--a1,.65)),transparent 70%),
  radial-gradient(var(--s2,52%) 48% at 90% 86%,hsl(var(--h2) 94% 46%/var(--a2,.52)),transparent 70%),
  radial-gradient(40% 35% at 62% 28%,hsl(var(--h2) 85% 36%/.22),transparent 72%)}

/* Distant Blurry Deep-Space Stars */
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#stars i{position:absolute;border-radius:50%;background:#fff;animation:tw var(--td,4.5s) ease-in-out infinite;animation-delay:var(--dl,0s)}
#stars i.far{filter:blur(1.4px);opacity:.38}
#stars i.mid{filter:blur(.7px);opacity:.55}
@keyframes tw{0%,100%{opacity:var(--lo,.14);transform:scale(.92)}50%{opacity:var(--hi,.65);transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){
  #stars i,.gas-cloud{animation:none!important}
  .row-track,.pc,.gb,.mood-card,#panel,#ov,.fab,.view-stage{transition:none!important;animation:none!important}
}

main{max-width:1100px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 140px}
@media (min-width:1001px){main{max-width:none;margin:0 0 0 218px;padding-right:44px}}
.view-stage{animation:viewIn .42s cubic-bezier(.22,1,.36,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}

h1,h2,h3,.num{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);border:1px solid var(--edge);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 40px rgba(0,0,0,.38)}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .26s cubic-bezier(.22,1,.36,1),background .28s ease,border-color .28s ease,color .28s ease,box-shadow .28s ease}
button:active{transform:scale(.965)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Grand Cinema Masthead */
.brand{font-family:"Cinzel",Georgia,serif;font-size:clamp(30px,5.2vw,50px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.05;margin:4px 0 26px;background:linear-gradient(180deg,#ffffff 15%,rgba(243,241,250,.68) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 10px 34px rgba(0,0,0,.45)}
.pg{font-size:34px;font-weight:800;margin-bottom:16px}

/* Hero + Right Square Mood Avatar Slot */
.hero-row{display:flex;align-items:stretch;gap:16px;margin-bottom:30px;max-width:1040px}
.hero{flex:1;padding:34px 28px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.hero h2{font-size:clamp(32px,6vw,60px);font-weight:800;line-height:1.02;letter-spacing:-.02em;max-width:14ch}
.hero p,.dim{color:var(--dim)}.hero p{margin:14px 0 0;max-width:48ch}

.mood-card{flex:0 0 196px;width:196px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;position:relative;overflow:hidden;border-radius:24px}
.mood-card:hover{border-color:rgba(255,255,255,.38);transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 22px 44px rgba(0,0,0,.45)}
.mood-card::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 35%,hsl(var(--h) 85% 58%/.28),transparent 68%);pointer-events:none}
.mood-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);position:relative;z-index:1}
.mood-orb{width:92px;height:92px;border-radius:50%;overflow:hidden;border:1.5px solid rgba(255,255,255,.28);box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 28px hsl(var(--h) 85% 55%/.35);display:grid;place-items:center;background:rgba(255,255,255,.09);position:relative;z-index:1;transition:transform .34s cubic-bezier(.22,1,.36,1)}
.mood-card:hover .mood-orb{transform:scale(1.05)}
.mood-orb img{width:100%;height:100%;object-fit:cover;display:block}
.mood-orb svg{width:56px;height:56px;display:block}
.mood-name{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:15px;line-height:1.15;position:relative;z-index:1}
.mood-sub{font-size:11px;color:var(--dim);position:relative;z-index:1}
@media (max-width:680px){.hero-row{flex-direction:column}.mood-card{flex:none;width:100%;flex-direction:row;text-align:left;padding:16px 20px;gap:14px}.mood-orb{width:64px;height:64px;flex:none}.mood-meta{flex:1;min-width:0}}

.sec{font-size:20px;font-weight:800;margin:8px 0 12px}

/* Scrollbar-Free Horizontal Rows + Curved Cylindrical Right-Arrow Carousel */
.row-shell{position:relative;margin-bottom:16px;perspective:1100px}
.row-track{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:6px 48px 14px 2px;scrollbar-width:none;-ms-overflow-style:none;transform-style:preserve-3d;transition:transform .46s cubic-bezier(.22,1,.36,1)}
.row-track::-webkit-scrollbar{display:none;width:0;height:0}
.row-track.curving{transform:rotateY(-7deg) scale(.988)}
.row-track.curving .pc{transform:translateZ(10px) rotateY(4deg)}
.row-track.curving .pc:nth-child(even){transform:translateZ(18px) rotateY(6deg)}

.row-next{position:absolute;right:6px;top:44%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(14,14,24,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.26);color:#fff;display:grid;place-items:center;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.55);opacity:.9}
.row-next:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.55);transform:translateY(-50%) scale(1.08);opacity:1}
.row-next:active{transform:translateY(-50%) scale(.95)}
.row-next svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.3;fill:none}

.rs{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 18px;margin-bottom:12px;scrollbar-width:none;-ms-overflow-style:none}
.rs::-webkit-scrollbar{display:none}
.rs.wrap{flex-wrap:wrap;overflow:visible}

.pc{flex:0 0 150px;width:150px;padding:0;overflow:hidden;text-align:left;transition:transform .34s cubic-bezier(.22,1,.36,1),border-color .3s ease,box-shadow .34s ease}
.pc:hover{transform:translateY(-4px) scale(1.018);border-color:rgba(255,255,255,.36);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 20px 38px rgba(0,0,0,.48)}
.pc img,.pc .ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.pc:hover img{transform:scale(1.035)}
.pc .ph{display:flex;align-items:flex-end;padding:12px;font:800 18px/1.1 "Bricolage Grotesque",system-ui,sans-serif;background:linear-gradient(160deg,#3b3b66,#12121f)}
.pc span{display:block;padding:9px 10px 11px;font-size:13px;line-height:1.3}

/* Navigation Dock & Animated FAB */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:999px;z-index:4}
.dock button{background:none;border:0;border-radius:999px;padding:10px 24px;color:var(--dim)}
.dock button[aria-pressed=true]{background:rgba(255,255,255,.16);color:var(--ink)}
.fab{position:fixed;right:26px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.94);color:#0a0a12;border:0;font-size:34px;line-height:1;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 40px hsl(var(--h) 90% 55%/.5);transition:transform .42s cubic-bezier(.34,1.56,.64,1),box-shadow .35s ease,background .25s ease}
.fab:hover{transform:scale(1.07)}
.fab.open{transform:rotate(135deg) scale(1.04);background:#fff}

.seg{display:inline-flex;flex-wrap:wrap;padding:4px;gap:2px;border-radius:24px;margin-bottom:20px}
.seg button{background:none;border:0;padding:7px 16px;border-radius:999px;color:var(--dim)}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.16);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:30px;max-width:1000px}
.stat{padding:20px 22px}.stat small{color:var(--dim)}
.num{font-size:32px;font-weight:800;margin-top:4px;line-height:1.1}
.dir{display:flex;gap:16px;align-items:center}
.face{width:68px;height:68px;border-radius:50%;flex:none;display:grid;place-items:center;object-fit:cover;overflow:hidden;font:800 24px "Bricolage Grotesque",system-ui,sans-serif;background:rgba(255,255,255,.14);border:1px solid var(--edge)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face svg{width:42px;height:42px;display:block}
.sil{background:radial-gradient(circle at 50% 36%,rgba(255,255,255,.4) 0 20%,transparent 21%),radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.35) 0 44%,transparent 45%),rgba(255,255,255,.06);filter:blur(2.5px)}
.dir .num{font-size:22px}.msg{font-size:15px;margin:4px 0}
.me{display:flex;align-items:center;gap:16px;margin-bottom:22px}.me .face{width:76px;height:76px;font-size:30px}.me h2{font-size:30px}
.avatar-trigger{padding:0;cursor:pointer;position:relative}
.avatar-trigger:hover{border-color:rgba(255,255,255,.45);transform:scale(1.04)}

/* Sidebar & Sealed Glass Gas-Chamber Pipe */
.side{position:fixed;left:20px;top:20px;bottom:100px;width:182px;padding:18px 16px;display:none;flex-direction:column;gap:14px;overflow:auto;z-index:2;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
@media (min-width:1001px){.side{display:flex}}
.side .who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;width:100%}.side .who .face{width:44px;height:44px;font-size:18px}.side .who .face svg{width:28px;height:28px}.side b{display:block;font-size:15px;line-height:1.2}.side small{color:var(--dim)}
.side h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-family:"Instrument Sans",sans-serif;font-weight:500}

.meter{display:flex;gap:14px;flex:1;min-height:220px;align-items:stretch}
.pipe-wrap{position:relative;width:44px;flex:none;display:flex;align-items:center;justify-content:center}
.pipe{position:relative;width:40px;height:100%;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.03) 32%,rgba(255,255,255,.02) 68%,rgba(255,255,255,.13) 100%);border:1.5px solid rgba(255,255,255,.34);box-shadow:inset 0 6px 12px rgba(255,255,255,.22),inset 0 -6px 12px rgba(255,255,255,.18),inset 3px 0 8px rgba(255,255,255,.2),inset -3px 0 10px rgba(0,0,0,.55),0 10px 26px rgba(0,0,0,.45);overflow:hidden;isolation:isolate}
.pipe::before{content:"";position:absolute;inset:3px;border-radius:999px;border:1px solid rgba(255,255,255,.16);pointer-events:none;z-index:4}
.pipe::after{content:"";position:absolute;top:12px;bottom:12px;left:6px;width:5px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.12) 45%,rgba(255,255,255,.35));filter:blur(.4px);pointer-events:none;z-index:5}
.gas-chamber{position:absolute;inset:4px;border-radius:999px;overflow:hidden;z-index:1}
.gas-cloud{position:absolute;left:-35%;right:-35%;border-radius:50%;filter:blur(11px);mix-blend-mode:screen;opacity:.88;animation:gasDrift var(--dur,7s) ease-in-out infinite alternate;animation-delay:var(--del,0s)}
@keyframes gasDrift{0%{transform:translateY(-8%) translateX(-6%) scale(1)}50%{transform:translateY(6%) translateX(8%) scale(1.12)}100%{transform:translateY(-4%) translateX(-4%) scale(.96)}}

.legend{display:flex;flex-direction:column;justify-content:center;gap:12px;font-size:13px;min-width:0;flex:1}
.legend div{display:flex;align-items:center;gap:7px}.legend em{width:9px;height:9px;border-radius:50%;flex:none;font-style:normal;box-shadow:0 0 8px currentColor}
.legend span{color:var(--dim);margin-left:auto}

/* Explore Page: Collectible Poster/Square-Card Genre Grid */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px;max-width:1040px}
.gb{aspect-ratio:4/5;padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background:linear-gradient(155deg,hsl(var(--gh) 88% 46%/.46),rgba(14,14,24,.65) 78%);transition:transform .36s cubic-bezier(.22,1,.36,1),border-color .3s ease,box-shadow .36s ease}
.gb::before{content:"";position:absolute;width:130px;height:130px;right:-26px;top:-26px;border-radius:50%;background:radial-gradient(circle,hsl(var(--gh) 95% 65%/.55),transparent 70%);filter:blur(8px);pointer-events:none;transition:transform .45s ease}
.gb:hover{transform:translateY(-5px) scale(1.015);border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 22px 42px rgba(0,0,0,.48)}
.gb:hover::before{transform:scale(1.22)}
.gb-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.gb-dot{width:12px;height:12px;border-radius:50%;background:hsl(var(--gh) 92% 64%);box-shadow:0 0 14px hsl(var(--gh) 92% 60%)}
.gb-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.gb-bot{position:relative;z-index:1}
.gb-name{display:block;font:800 22px/1.12 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.gb-sub{display:block;font-size:12px;color:var(--dim);margin-top:5px}

.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.bar h2{font-size:26px}
.chipsrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed=true]{background:rgba(255,255,255,.9);color:#0a0a12}

/* Modal Overlay & Panel Animation */
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,3,8,.68);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:6;opacity:0;pointer-events:none;transition:opacity .3s ease}
#ov.on{opacity:1;pointer-events:auto}
#panel{width:100%;max-width:780px;max-height:100%;overflow:auto;padding:24px;background:rgba(22,20,36,.92);transform:translateY(18px) scale(.965);transition:transform .38s cubic-bezier(.22,1,.36,1)}
#ov.on #panel{transform:translateY(0) scale(1)}
#panel h2{font-size:26px;margin-bottom:14px}
.inp{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;color:var(--ink);font:inherit;padding:12px 14px;margin-bottom:16px}

/* Avatar Picker Grid */
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-top:8px}
.av-item{background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.av-item:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.av-item[aria-pressed=true]{background:rgba(255,255,255,.22);border-color:#fff}
.av-item .av-pic{width:56px;height:56px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2)}
.av-item .av-pic img{width:100%;height:100%;object-fit:cover;display:block}
.av-item .av-pic svg{width:38px;height:38px}
.av-item span{font-size:12px;line-height:1.2;font-weight:500}
.av-item small{font-size:10px;color:var(--dim);line-height:1.1}

.detail{display:grid;grid-template-columns:210px 1fr;gap:24px}
.detail img,.detail .ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:18px;display:block}
.detail .ph{display:flex;align-items:flex-end;padding:14px;font:800 22px "Bricolage Grotesque",system-ui,sans-serif;background:linear-gradient(160deg,#3b3b66,#12121f)}
@media (max-width:620px){.detail{grid-template-columns:1fr}.detail img,.detail .ph{max-width:220px}}
.meta{color:var(--dim);margin:6px 0}.over{margin:12px 0;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.links div,.links a{background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;padding:8px 14px;color:var(--ink);text-decoration:none;font-size:14px}
.links small{display:block;color:var(--dim);font-size:12px}
.acts{display:flex;gap:10px;margin-top:16px}
.btn{background:rgba(255,255,255,.92);color:#0a0a12;border:0;border-radius:999px;padding:10px 22px;font-weight:500}
.ghost{background:none;border:1px solid var(--edge);border-radius:999px;padding:9px 18px}
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<aside class="side glass" id="side" aria-label="Taste meter"></aside>
<main id="app"></main>
<nav class="dock glass" aria-label="Main">
<button data-v="home" aria-pressed="true">Home</button><button data-v="explore" aria-pressed="false">Explore</button><button data-v="me" aria-pressed="false">Me</button>
</nav>
<button class="fab" id="logbtn" aria-label="Log a film">+</button>
<div id="ov" role="dialog" aria-modal="true"><div id="panel" class="glass"></div></div>
<script>
var GID={Action:28,Adventure:12,Animation:16,Comedy:35,Crime:80,Documentary:99,Drama:18,Family:10751,Fantasy:14,History:36,Horror:27,Music:10402,Mystery:9648,Romance:10749,"Science Fiction":878,Thriller:53,War:10752,Western:37};
var G={Horror:355,War:8,Action:18,Western:28,Adventure:32,History:38,Comedy:48,Documentary:95,Family:125,Animation:150,Music:165,"Science Fiction":182,Drama:222,Mystery:250,Thriller:268,Fantasy:300,Crime:285,Romance:328};
var GTAG={Action:"Adrenaline",Adventure:"Odyssey",Animation:"Crafted Worlds",Comedy:"Levity",Crime:"Underworld",Documentary:"Real Stories",Drama:"Human Depth",Family:"Shared Wonder",Fantasy:"Myth & Magic",History:"Past Echoes",Horror:"Midnight Dread",Music:"Rhythm & Soul",Mystery:"Enigma",Romance:"Heartstrings","Science Fiction":"Future Visions",Thriller:"Pulse & Tension",War:"Frontlines",Western:"Frontier"};
var SUB={Horror:["Psychological horror","Folk horror","Body horror","Slasher","Supernatural horror","Found footage","Gothic horror","Zombie","Haunted house"],
Thriller:["Psychological thriller","Neo-noir","Crime thriller","Political thriller","Conspiracy","Revenge","Heist"],
Comedy:["Dark comedy","Romantic comedy","Satire","Parody","Slapstick","Mockumentary","Coming-of-age"],
Drama:["Coming-of-age","Courtroom drama","Family drama","Biopic","Social realism","Sports drama"],
Action:["Martial arts","Spy","Superhero","Disaster","Revenge","Heist"],
Romance:["Romantic drama","Tragic romance","Teen romance","Period romance"],
"Science Fiction":["Cyberpunk","Space opera","Dystopia","Time travel","Post-apocalyptic","Alien invasion"],
Fantasy:["Dark fantasy","Fairy tale","Sword and sorcery","Magical realism","Mythology"],
Mystery:["Whodunit","Detective","Neo-noir","Conspiracy"],
Crime:["Gangster","Heist","True crime","Prison"],
Animation:["Anime","Stop motion","Adult animation"],
Documentary:["Nature","Music documentary","True crime","Political documentary"]};
var CO=[["","Worldwide"],["IN","India"],["US","USA"],["GB","UK"],["KR","Korea"],["JP","Japan"],["FR","France"],["ES","Spain"]];
var CL={IN:"Indian",US:"Hollywood",GB:"British",KR:"Korean",JP:"Japanese",FR:"French",ES:"Spanish",DE:"German",IT:"Italian"};

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function mostCommon(l){var m={},b=null;l.forEach(function(k){if(!k)return;m[k]=(m[k]||0)+1;if(!b||m[k]>m[b])b=k});return b}
function hue(g){return G[g]!==undefined?G[g]:230}
function mix(hs,ws){var x=0,y=0;hs.forEach(function(h,i){var a=h*Math.PI/180,w=ws?ws[i]:1;x+=w*Math.cos(a);y+=w*Math.sin(a)});return(Math.atan2(y,x)*180/Math.PI+360)%360}
function filmHue(f){return mix(f.genres.slice(0,3).map(hue),[1,.8,.5])}
function img(p,s){return p?"https://image.tmdb.org/t/p/"+s+p:""}
function api(p,o){var q="p="+encodeURIComponent(p);for(var k in o||{})if(o[k]!==undefined&&o[k]!=="")q+="&"+k+"="+encodeURIComponent(o[k]);return fetch("/api/tmdb?"+q).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}

/* Distant Blurry Starfield + Deep Contrast Genre Aura */
function ensureStars(){
 var stars=$("stars");
 if(stars.children.length)return;
 for(var i=0;i<54;i++){
  var s=document.createElement("i"),far=i%3!==0;
  s.className=far?"far":"mid";
  s.style.left=(Math.random()*98+1).toFixed(2)+"%";
  s.style.top=(Math.random()*98+1).toFixed(2)+"%";
  var sz=far?(Math.random()*1.8+1.6):(Math.random()*1.6+2.2);
  s.style.width=s.style.height=sz.toFixed(1)+"px";
  s.style.setProperty("--td",(4.2+Math.random()*5).toFixed(1)+"s");
  s.style.setProperty("--dl",(-Math.random()*6).toFixed(1)+"s");
  s.style.setProperty("--lo",far?".10":".18");
  s.style.setProperty("--hi",far?".42":".68");
  stars.appendChild(s)}}

function paint(){
 ensureStars();
 var st=document.documentElement.style;
 if(!films.length){
  st.setProperty("--h",230);st.setProperty("--h2",270);
  st.setProperty("--s1","62%");st.setProperty("--s2","52%");
  st.setProperty("--a1","0.62");st.setProperty("--a2","0.50");
  return null}
 var recent=sorted().slice(0,12),bins={};
 recent.forEach(function(f){var h=filmHue(f),b=Math.round(h/30)%12;(bins[b]=bins[b]||[]).push(h)});
 var bk=Object.keys(bins).sort(function(a,b){return bins[b].length-bins[a].length});
 var c1=mix(bins[bk[0]]);
 /* Ensure strong contrasting second hue even if only one genre cluster exists */
 var c2=bk[1]!==undefined?mix(bins[bk[1]]):(c1+135)%360;
 if(Math.abs(((c2-c1+540)%360)-180)>135)c2=(c1+130)%360;
 var n1=bins[bk[0]].length,n2=bk[1]!==undefined?bins[bk[1]].length:0;
 var dominance=Math.min(1,n1/Math.max(1,recent.length));
 var sh=n2?n1/(n1+n2):.78;
 st.setProperty("--h",c1.toFixed(1));
 st.setProperty("--h2",c2.toFixed(1));
 st.setProperty("--s1",(36+54*sh).toFixed(1)+"%");
 st.setProperty("--s2",(34+52*(1-sh)).toFixed(1)+"%");
 st.setProperty("--a1",(0.54+0.26*dominance).toFixed(2));
 st.setProperty("--a2",(0.44+0.20*(1-dominance*0.4)).toFixed(2));
 return mostCommon(recent.map(function(f){return f.genres[0]}))}

/* Sealed Borosilicate Glass Pipe with Volumetric Gas Clouds */
function side(){
 var el=$("side"),n=films.length;
 var h='<button class="who" data-avopen="1" title="Change cinema avatar"><div class="face">'+avatarGraphic()+'</div><div><b>'+esc(avatar.name)+'</b><small>'+n+(n===1?" film":" films")+'</small></div></button><h3>Taste meter</h3>';
 if(!n){
  h+='<div class="meter"><div class="pipe-wrap"><div class="pipe"><div class="gas-chamber"><div class="gas-cloud" style="top:15%;height:55%;background:radial-gradient(circle,hsla(230,85%,60%,.28),transparent 72%);--dur:8s;--del:0s"></div><div class="gas-cloud" style="top:45%;height:50%;background:radial-gradient(circle,hsla(270,85%,60%,.24),transparent 72%);--dur:9s;--del:-3s"></div></div></div></div><p class="dim" style="font-size:13px;align-self:center">Log films and gases of your taste swirl inside.</p></div>';
  el.innerHTML=h;return}
 var cnt={},tot=0;sorted().slice(0,12).forEach(function(f){var g=f.genres[0]||"Drama";cnt[g]=(cnt[g]||0)+1;tot++});
 var ks=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]});
 var cursor=0,clouds=[];
 ks.forEach(function(g,idx){
  var share=cnt[g]/tot,gh=hue(g);
  var topPct=Math.max(-8,cursor*88-6);
  var heightPct=Math.max(34,share*82+24);
  cursor+=share;
  clouds.push('<div class="gas-cloud" style="top:'+topPct.toFixed(1)+'%;height:'+heightPct.toFixed(1)+'%;background:radial-gradient(ellipse at 50% 50%,hsla('+gh+',95%,62%,.9) 0%,hsla('+gh+',90%,48%,.45) 52%,transparent 76%);--dur:'+(6.5+idx*1.3)+'s;--del:'+(-idx*1.7)+'s"></div>')});
 h+='<div class="meter"><div class="pipe-wrap"><div class="pipe"><div class="gas-chamber">'+clouds.join("")+'</div></div></div><div class="legend">'+
  ks.slice(0,6).map(function(g){var c="hsl("+hue(g)+" 85% 58%)";return'<div><em style="background:'+c+';color:'+c+'"></em>'+esc(g)+'<span>'+Math.round(cnt[g]/tot*100)+'%</span></div>'}).join("")+'</div></div>';
 el.innerHTML=h}

function loadExplore(reset){
 if(reset){ex.page=1;ex.items=[]}
 ex.loading=true;render(true);
 function run(kw){return api("discover/movie",{genre:GID[ex.genre],country:ex.country,kw:kw,page:ex.page}).then(function(d){ex.items=ex.items.concat((d.results||[]).filter(function(m){return m.poster_path}));ex.more=(d.page||1)<(d.total_pages||1)&&ex.page<5;ex.loading=false;render(true)})}
 (ex.sub?api("search/keyword",{q:ex.sub}).then(function(d){var ids=(d.results||[]).slice(0,3).map(function(k){return k.id}).join("|");if(!ids){ex.items=[];ex.more=false;ex.loading=false;render(true);return}return run(ids)}):run("")).catch(function(){ex.items=[];ex.more=false;ex.loading=false;render(true)})}

function loadRows(){
 var key=films.map(function(f){return f.tid}).join(",");if(key===rowsKey)return;rowsKey=key;rows=null;
 var s=sorted(),have={};films.forEach(function(f){have[f.tid]=1});
 var defs=[];
 if(!films.length){defs=[{t:"Popular right now",p:"discover/movie",o:{}},{t:"Popular in India",p:"discover/movie",o:{country:"IN"}}]}
 else{
  var tg=mostCommon(s.slice(0,12).map(function(f){return f.genres[0]})),cs=s.slice(0,12).map(function(f){return f.country}).filter(Boolean),c1=mostCommon(cs),c2=mostCommon(cs.filter(function(c){return c!==c1}));
  if(s[0])defs.push({t:"Because you liked "+s[0].title,p:"movie/"+s[0].tid+"/recommendations",o:{}});
  if(tg&&c1&&GID[tg])defs.push({t:"More "+tg.toLowerCase()+" from "+cname(c1)+" cinema",p:"discover/movie",o:{genre:GID[tg],country:c1}});
  if(s[1])defs.push({t:"Because you liked "+s[1].title,p:"movie/"+s[1].tid+"/recommendations",o:{}});
  if(tg&&c2&&GID[tg])defs.push({t:cname(c2)+" "+tg.toLowerCase()+" you might like",p:"discover/movie",o:{genre:GID[tg],country:c2}});
  if(tg&&GID[tg])defs.push({t:tg+" from around the world",p:"discover/movie",o:{genre:GID[tg]}})}
 Promise.all(defs.map(function(d){return api(d.p,d.o).then(function(r){var t=today();return{t:d.t,items:(r.results||[]).filter(function(m){return m.poster_path&&!have[m.id]&&(!m.release_date||m.release_date<=t)}).slice(0,16)}}).catch(function(){return{t:d.t,items:[]}})})).then(function(r){if(key!==rowsKey)return;rows=r.filter(function(x){return x.items.length});if(view==="home")render(true)})}

function render(noAnim){
 var tg=paint(),app=$("app"),h="";side();
 [].forEach.call(document.querySelectorAll("[data-v]"),function(b){b.setAttribute("aria-pressed",b.dataset.v===view)});
 if(view==="home"){
  h='<h1 class="brand">Fourth wall</h1>';
  h+='<div class="hero-row">';
  h+=films.length?'<section class="glass hero"><h2>Mostly '+esc((tg||"film").toLowerCase())+' lately.</h2><p>'+films.length+(films.length===1?" film":" films")+' logged so far.</p></section>'
   :'<section class="glass hero"><h2>Your sky is empty.</h2><p>Tap the + to log the first film you’ve watched. The page takes on the colour of your taste.</p></section>';
  h+='<button class="glass mood-card" data-avopen="1" aria-label="Change today\'s cinema mood"><span class="mood-lbl">Today\'s Mood</span><div class="mood-orb">'+avatarGraphic()+'</div><div class="mood-meta"><div class="mood-name">'+esc(avatar.name)+'</div><div class="mood-sub">'+esc(avatar.tag||"Tap to switch")+'</div></div></button>';
  h+='</div>';
  if(films.length)h+='<h2 class="sec">Recently logged</h2>'+carouselRow(sorted().slice(0,16).map(function(f){return pc(f.tid,f.title,f.poster)}).join(""));
  if(rows===null)h+='<p class="dim">Finding films for you…</p>';
  else h+=rows.map(function(r){return'<h2 class="sec">'+esc(r.t)+'</h2>'+carouselRow(r.items.map(function(m){return pc(m.id,m.title,m.poster_path)}).join(""))}).join("");
 }else if(view==="explore"){h=exploreHTML()}
 else{
  var pf=films.filter(inPeriod),pg=mostCommon([].concat.apply([],pf.map(function(f){return f.genres})));
  h='<div class="me"><button class="face avatar-trigger" data-avopen="1" title="Change avatar">'+avatarGraphic()+'</button><div><h2>'+esc(avatar.name)+'</h2><span class="dim">'+esc(avatar.tag||"Everything you’ve logged")+' · Tap avatar to change</span></div></div>';
  h+='<div class="seg glass" role="group" aria-label="Time period">'+[["month","This month"],["quarter","This quarter"],["year","This year"]].map(function(p){return'<button data-p="'+p[0]+'" aria-pressed="'+(period===p[0])+'">'+p[1]+'</button>'}).join("")+'</div>';
  h+='<div class="stats"><div class="stat glass"><small>Films logged</small><div class="num">'+pf.length+'</div></div><div class="stat glass"><small>Most-watched genre</small><div class="num">'+esc(pg||"—")+'</div></div>'+dirBox()+'</div>';
  h+='<div class="rs wrap">'+(films.length?sorted().map(function(f){return pc(f.tid,f.title,f.poster)}).join(""):'<p class="dim">Nothing logged yet.</p>')+'</div>'}
 app.innerHTML='<div class="'+(noAnim?"":"view-stage")+'">'+h+'</div>'}

function show(isLog){$("ov").classList.add("on");if(isLog)$("logbtn").classList.add("open")}
function hide(){$("ov").classList.remove("on");$("logbtn").classList.remove("open")}

function openAvatarPicker(){
 var presetsHTML=PRESET_AVATARS.map(function(p){
  var active=avatar.type==="preset"&&avatar.id===p.id;
  return'<button class="av-item" data-avpreset="'+p.id+'" aria-pressed="'+active+'"><div class="av-pic">'+p.svg+'</div><span>'+esc(p.name)+'</span><small>'+esc(p.tag)+'</small></button>'}).join("");
 $("panel").innerHTML='<h2>Choose your cinema mood</h2><p class="dim" style="margin:-6px 0 14px;font-size:14px">Pick an iconic character mask or search any actor, director, or cinema icon from TMDB.</p>'+
  '<input id="avq" class="inp" placeholder="Search any actor, director, or cinema icon…" autocomplete="off" aria-label="Search cinema icons">'+
  '<div id="av-results"></div>'+
  '<div class="sec" style="font-size:15px;margin-top:8px">Iconic Masks & Personas</div>'+
  '<div class="av-grid">'+presetsHTML+'</div>'+
  '<div class="acts"><button class="ghost" data-act="close">Done</button></div>';
 show(false);
 $("avq").oninput=function(){
  clearTimeout(avTimer);var v=this.value.trim();
  if(v.length<2){$("av-results").innerHTML="";return}
  avTimer=setTimeout(function(){
   api("search/person",{q:v}).then(function(d){
    var ppl=(d.results||[]).filter(function(p){return p.profile_path}).slice(0,12);
    $("av-results").innerHTML=ppl.length?'<div class="sec" style="font-size:15px">TMDB Icons</div><div class="av-grid" style="margin-bottom:18px">'+ppl.map(function(p){
     var role=p.known_for_department||"Cinema Icon";
     return'<button class="av-item" data-avtmdb="'+esc(p.profile_path)+'" data-avname="'+esc(p.name)+'" data-avtag="'+esc(role)+'"><div class="av-pic"><img loading="lazy" alt="" src="'+img(p.profile_path,"w185")+'"></div><span>'+esc(p.name)+'</span><small>'+esc(role)+'</small></button>'}).join("")+'</div>':'<p class="dim" style="font-size:14px">No portraits found for "'+esc(v)+'".</p>'
   }).catch(function(){$("av-results").innerHTML=''})},350)}}

function openSearch(){
 $("panel").innerHTML='<h2>Log a film</h2><input id="q" class="inp" placeholder="Search for a film…" autocomplete="off" aria-label="Search for a film"><div id="res" class="rs wrap"></div>';show(true);$("q").focus();
 $("q").oninput=function(){clearTimeout(timer);var v=this.value.trim();if(v.length<2){$("res").innerHTML="";return}
  timer=setTimeout(function(){api("search/movie",{q:v}).then(function(d){$("res").innerHTML=(d.results||[]).slice(0,12).map(function(m){return pc(m.id,m.title+(m.release_date?" ("+m.release_date.slice(0,4)+")":""),m.poster_path)}).join("")||'<p class="dim">No films found.</p>'}).catch(function(){$("res").innerHTML='<p class="dim">Search isn’t working right now.</p>'})},350)}}

function openDetail(id){
 $("panel").innerHTML='<p class="dim">Loading…</p>';show(false);
 api("movie/"+id).then(function(m){
  var crew=(m.credits&&m.credits.crew)||[],d=crew.filter(function(c){return c.job==="Director"})[0],w=crew.filter(function(c){return c.job==="Screenplay"||c.job==="Writer"})[0],pcn=(m.production_countries||[])[0];
  cur={tid:m.id,title:m.title,year:(m.release_date||"").slice(0,4),genres:(m.genres||[]).map(function(g){return g.name}),director:d?d.name:"",dphoto:d?d.profile_path||"":"",writer:w?w.name:"",poster:m.poster_path||"",score:m.vote_average?m.vote_average.toFixed(1):"",country:pcn?pcn.iso_3166_1:"",lang:m.original_language||""};
  var logged=films.some(function(f){return f.tid===cur.tid}),qs=encodeURIComponent(cur.title+" "+cur.year);
  $("panel").innerHTML='<div class="detail">'+(cur.poster?'<img alt="" src="'+img(cur.poster,"w500")+'">':'<div class="ph">'+esc(cur.title)+'</div>')+'<div><h2>'+esc(cur.title)+(cur.year?" ("+esc(cur.year)+")":"")+'</h2>'+
   '<div class="meta">'+esc(cur.genres.join(" · "))+(m.runtime?" · "+m.runtime+" min":"")+'</div>'+
   '<div class="meta">'+(cur.director?"Directed by "+esc(cur.director):"")+(cur.writer?"<br>Written by "+esc(cur.writer):"")+'</div>'+
   '<p class="over">'+esc((m.overview||"").slice(0,320))+'</p>'+
   '<div class="links"><div><small>TMDB</small>'+(cur.score||"—")+'</div><a href="https://www.imdb.com/find/?q='+qs+'" target="_blank" rel="noopener"><small>IMDb</small>Open</a><a href="https://letterboxd.com/search/'+qs+'/" target="_blank" rel="noopener"><small>Letterboxd</small>Open</a><a href="https://www.google.com/search?q='+qs+'+moctale" target="_blank" rel="noopener"><small>Moctale</small>Search</a></div>'+
   '<div class="acts">'+(logged?'<button class="ghost" data-act="remove">Remove from my log</button>':'<button class="btn" data-act="log">Log it</button>')+'<button class="ghost" data-act="close">Close</button></div></div></div>'
 }).catch(function(){$("panel").innerHTML='<p>Couldn’t load that film.</p><div class="acts"><button class="ghost" data-act="close">Close</button></div>'})}

document.addEventListener("click",function(e){
 var t=e.target;
 if(t.id==="ov"||t.closest("[data-act=close]")){hide();return}
 if(t.closest("#logbtn")){if($("ov").classList.contains("on")&&$("logbtn").classList.contains("open"))hide();else openSearch();return}
 if(t.closest("[data-avopen]")){openAvatarPicker();return}
 var rn=t.closest("[data-rownext]");
 if(rn){
  var shell=rn.closest(".row-shell"),track=shell&&shell.querySelector(".row-track");
  if(track){
   track.classList.add("curving");
   var step=Math.max(320,Math.round(track.clientWidth*0.72));
   if(track.scrollLeft+track.clientWidth>=track.scrollWidth-12)track.scrollTo({left:0,behavior:"smooth"});
   else track.scrollBy({left:step,behavior:"smooth"});
   clearTimeout(track._ct);
   track._ct=setTimeout(function(){track.classList.remove("curving")},460)}
  return}
 var avp=t.closest("[data-avpreset]");
 if(avp){var f=PRESET_AVATARS.filter(function(x){return x.id===avp.dataset.avpreset})[0];if(f){avatar={type:"preset",id:f.id,name:f.name,tag:f.tag,img:""};saveAv();hide();render(true)}return}
 var avt=t.closest("[data-avtmdb]");
 if(avt){avatar={type:"tmdb",id:"",name:avt.dataset.avname,tag:avt.dataset.avtag,img:avt.dataset.avtmdb};saveAv();hide();render(true);return}
 var v=t.closest("[data-v]");if(v){if(view!==v.dataset.v){view=v.dataset.v;render(false);window.scrollTo({top:0,behavior:"smooth"})}return}
 var p=t.closest("[data-p]");if(p){period=p.dataset.p;render(true);return}
 var c=t.closest("[data-c]");if(c){ex.country=c.dataset.c;if(ex.genre)loadExplore(true);else render(true);return}
 var g=t.closest("[data-g]");if(g){ex.genre=g.dataset.g;ex.sub=null;ex.showSubs=false;loadExplore(true);return}
 if(t.closest("[data-back]")){ex.genre=null;ex.sub=null;render(true);return}
 if(t.closest("[data-subs]")){ex.showSubs=!ex.showSubs;render(true);return}
 var s=t.closest("[data-s]");if(s){ex.sub=ex.sub===s.dataset.s?null:s.dataset.s;loadExplore(true);return}
 if(t.closest("[data-more]")){ex.page++;loadExplore(false);return}
 var a=t.closest("[data-act]");
 if(a&&cur){if(a.dataset.act==="log"){cur.date=today();cur.at=Date.now();films.push(cur);save();hide();loadRows();render(true)}
  else if(a.dataset.act==="remove"){films=films.filter(function(f){return f.tid!==cur.tid});save();hide();loadRows();render(true)}return}
 var d=t.closest("[data-id]");if(d)openDetail(+d.dataset.id)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")hide()});
render(false);loadRows();
</script>
</body>
</html>
