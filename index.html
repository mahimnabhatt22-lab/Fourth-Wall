<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fourth wall</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Cinzel:wght@600;700;800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
@property --h{syntax:"<number>";inherits:true;initial-value:230}
@property --h2{syntax:"<number>";inherits:true;initial-value:270}
@property --s1{syntax:"<percentage>";inherits:true;initial-value:62%}
@property --s2{syntax:"<percentage>";inherits:true;initial-value:52%}
@property --a1{syntax:"<number>";inherits:true;initial-value:0.65}
@property --a2{syntax:"<number>";inherits:true;initial-value:0.52}

:root{--h:230;--h2:270;--s1:62%;--s2:52%;--a1:0.65;--a2:0.52;--bg:#05050b;--ink:#f3f1fa;--dim:rgba(243,241,250,.64);--glass:rgba(255,255,255,.075);--edge:rgba(255,255,255,.17);color-scheme:dark;transition:--h 1.2s cubic-bezier(.22,1,.36,1),--h2 1.2s cubic-bezier(.22,1,.36,1),--s1 1.2s ease,--s2 1.2s ease,--a1 1.2s ease,--a2 1.2s ease}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(var(--s1,62%) 52% at 12% 10%,hsl(var(--h) 96% 48%/var(--a1,.65)),transparent 70%),
  radial-gradient(var(--s2,52%) 48% at 90% 86%,hsl(var(--h2) 94% 46%/var(--a2,.52)),transparent 70%),
  radial-gradient(40% 35% at 62% 28%,hsl(var(--h2) 85% 36%/.22),transparent 72%)}

/* Distant Blurry Deep-Space Stars */
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#stars i{position:absolute;border-radius:50%;background:#fff;animation:tw var(--td,4.5s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes tw{0%,100%{opacity:var(--lo,.14)}50%{opacity:var(--hi,.65)}}
@media (prefers-reduced-motion:reduce){
  #stars i,.band::after,.bub{animation:none!important}
  .row-track,.pc,.gb,.mood-card,#panel,#ov,.fab,.view-stage{transition:none!important;animation:none!important}
}

main{max-width:1100px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 140px}
@media (min-width:1001px){main{max-width:none;margin:0 0 0 292px;padding-right:44px}}
.view-stage{animation:viewIn .36s cubic-bezier(.22,1,.36,1) backwards}
.view-stage.still{animation:none}
.view-stage.leave{animation:none;opacity:0;transform:translateY(-8px);transition:opacity .15s ease-out,transform .15s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h1,h2,h3,.num{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);border:1px solid var(--edge);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 40px rgba(0,0,0,.38)}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .26s cubic-bezier(.22,1,.36,1),background .28s ease,border-color .28s ease,color .28s ease,box-shadow .28s ease}
button:active{transform:scale(.965)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Grand Cinema Masthead */
.brand{font-family:"Cinzel",Georgia,serif;font-size:clamp(30px,5.2vw,50px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.05;margin:4px 0 26px;background:linear-gradient(180deg,#ffffff 15%,rgba(243,241,250,.68) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 10px 34px rgba(0,0,0,.45)}
.pg{font-size:34px;font-weight:800;margin-bottom:16px}

/* Hero + Right Square Mood Avatar Slot */
.hero-row{display:flex;align-items:stretch;gap:16px;margin-bottom:30px;max-width:1040px}
.hero{flex:1;padding:34px 28px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.hero h2{font-size:clamp(32px,6vw,60px);font-weight:800;line-height:1.02;letter-spacing:-.02em;max-width:14ch}
.hero p,.dim{color:var(--dim)}.hero p{margin:14px 0 0;max-width:48ch}

.mood-card{flex:0 0 196px;width:196px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;position:relative;overflow:hidden;border-radius:24px}
.mood-card:hover{border-color:rgba(255,255,255,.38);transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 22px 44px rgba(0,0,0,.45)}
.mood-card::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 35%,hsl(var(--h) 85% 58%/.28),transparent 68%);pointer-events:none}
.mood-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);position:relative;z-index:1}
.mood-orb{width:92px;height:92px;border-radius:50%;overflow:hidden;border:1.5px solid rgba(255,255,255,.28);box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 28px hsl(var(--h) 85% 55%/.35);display:grid;place-items:center;background:rgba(255,255,255,.09);position:relative;z-index:1;transition:transform .34s cubic-bezier(.22,1,.36,1)}
.mood-card:hover .mood-orb{transform:scale(1.05)}
.mood-orb img{width:100%;height:100%;object-fit:cover;display:block}
.mood-orb svg{width:56px;height:56px;display:block}
.mood-name{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:15px;line-height:1.15;position:relative;z-index:1}
.mood-sub{font-size:11px;color:var(--dim);position:relative;z-index:1}
@media (max-width:680px){.hero-row{flex-direction:column}.mood-card{flex:none;width:100%;flex-direction:row;text-align:left;padding:16px 20px;gap:14px}.mood-orb{width:64px;height:64px;flex:none}.mood-meta{flex:1;min-width:0}}

.sec{font-size:20px;font-weight:800;margin:8px 0 12px}

/* Scrollbar-Free Horizontal Rows + Curved Cylindrical Right-Arrow Carousel */
.row-shell{position:relative;margin-bottom:16px;perspective:1100px}
.row-track{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:6px 48px 14px 2px;scrollbar-width:none;-ms-overflow-style:none;transform-style:preserve-3d;transition:transform .46s cubic-bezier(.22,1,.36,1)}
.row-track::-webkit-scrollbar{display:none;width:0;height:0}
.row-track.curving{transform:rotateY(-5deg);will-change:transform}

.row-next{position:absolute;right:6px;top:44%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(14,14,24,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.26);color:#fff;display:grid;place-items:center;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.55);opacity:.9}
.row-next:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.55);transform:translateY(-50%) scale(1.08);opacity:1}
.row-next:active{transform:translateY(-50%) scale(.95)}
.row-next svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.3;fill:none}

.rs{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 18px;margin-bottom:12px;scrollbar-width:none;-ms-overflow-style:none}
.rs::-webkit-scrollbar{display:none}
.rs.wrap{flex-wrap:wrap;overflow:visible}

.pc{flex:0 0 150px;width:150px;padding:0;overflow:hidden;text-align:left;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.pc:hover{transform:translateY(-4px)}
.pc img,.pc .ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.pc:hover img{transform:scale(1.035)}
.pc .ph{display:flex;align-items:flex-end;padding:12px;font:800 18px/1.1 "Bricolage Grotesque",system-ui,sans-serif;background:linear-gradient(160deg,#3b3b66,#12121f)}
.pc span{display:block;padding:9px 10px 11px;font-size:13px;line-height:1.3}

/* Navigation Dock & Animated FAB */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:999px;z-index:4}
.dock button{background:none;border:0;border-radius:999px;padding:10px 24px;color:var(--dim)}
.dock button[aria-pressed=true]{background:rgba(255,255,255,.16);color:var(--ink)}
.fab{position:fixed;right:26px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.94);color:#0a0a12;border:0;font-size:34px;line-height:1;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 40px hsl(var(--h) 90% 55%/.5);transition:transform .42s cubic-bezier(.34,1.56,.64,1),box-shadow .35s ease,background .25s ease}
.fab:hover{transform:scale(1.07)}
.fab.open{transform:rotate(135deg) scale(1.04);background:#fff}

.seg{display:inline-flex;flex-wrap:wrap;padding:4px;gap:2px;border-radius:24px;margin-bottom:20px}
.seg button{background:none;border:0;padding:7px 16px;border-radius:999px;color:var(--dim)}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.16);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:30px;max-width:1000px}
.stat{padding:20px 22px}.stat small{color:var(--dim)}
.num{font-size:32px;font-weight:800;margin-top:4px;line-height:1.1}
.dir{display:flex;gap:16px;align-items:center}
.face{width:68px;height:68px;border-radius:50%;flex:none;display:grid;place-items:center;object-fit:cover;overflow:hidden;font:800 24px "Bricolage Grotesque",system-ui,sans-serif;background:rgba(255,255,255,.14);border:1px solid var(--edge)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face svg{width:42px;height:42px;display:block}
.sil{background:radial-gradient(circle at 50% 36%,rgba(255,255,255,.4) 0 20%,transparent 21%),radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.35) 0 44%,transparent 45%),rgba(255,255,255,.06);filter:blur(2.5px)}
.dir .num{font-size:22px}.msg{font-size:15px;margin:4px 0}
.me{display:flex;align-items:center;gap:16px;margin-bottom:22px}.me .face{width:76px;height:76px;font-size:30px}.me h2{font-size:30px}
.avatar-trigger{padding:0;cursor:pointer;position:relative}
.avatar-trigger:hover{border-color:rgba(255,255,255,.45);transform:scale(1.04)}

/* Sidebar & Sealed Glass Gas-Chamber Pipe */
.side .who b{display:block;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side{position:fixed;left:20px;top:20px;bottom:100px;width:256px;padding:18px 16px;display:none;flex-direction:column;gap:14px;overflow:auto;z-index:2;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
@media (min-width:1001px){.side{display:flex}}
.side .who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;width:100%}.side .who .face{width:44px;height:44px;font-size:18px}.side .who .face svg{width:28px;height:28px}.side b{display:block;font-size:15px;line-height:1.2}.side small{color:var(--dim)}
.side h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-family:"Instrument Sans",sans-serif;font-weight:500}

.meter{display:flex;gap:14px;flex:1;min-height:240px;align-items:stretch}
.tube{position:relative;width:50px;flex:none;display:flex;flex-direction:column;align-items:center}
.rim{width:50px;height:9px;flex:none;border-radius:5px;border:2px solid rgba(255,255,255,.7);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.08));position:relative;z-index:6;margin-bottom:-2px}
.pipe{position:relative;width:40px;flex:1;border:2px solid rgba(255,255,255,.55);border-top:0;border-radius:0 0 20px 20px;background:rgba(255,255,255,.05);overflow:hidden;isolation:isolate;box-shadow:0 12px 26px rgba(0,0,0,.45),inset 0 -8px 14px rgba(255,255,255,.12)}
.pipe::before{content:"";position:absolute;z-index:5;left:5px;top:10px;bottom:24px;width:5px;border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.15) 70%,rgba(255,255,255,.4));pointer-events:none}
.pipe::after{content:"";position:absolute;z-index:5;right:5px;top:16px;bottom:32px;width:2px;border-radius:2px;background:rgba(255,255,255,.3);pointer-events:none}
.fill{position:absolute;left:0;right:0;bottom:0;top:12%;display:flex;flex-direction:column;z-index:1}
.fill.empty{opacity:.45}
.band{position:relative;flex:var(--f,1) 1 0;min-height:16px;overflow:hidden;background:linear-gradient(90deg,hsl(var(--c) 100% 46%),hsl(var(--c) 100% 62%) 45%,hsl(var(--c) 100% 50%))}
.band+.band{margin-top:-12px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%);mask-image:linear-gradient(180deg,transparent 0,#000 30%)}
.band::after{content:"";position:absolute;inset:-20% -40%;background:radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.4),transparent 55%);animation:wisp var(--dur,7s) ease-in-out infinite alternate}
@keyframes wisp{from{transform:translateX(-18%)}to{transform:translateX(18%)}}
.bub{position:absolute;bottom:8px;left:var(--x,10px);width:var(--sz,5px);height:var(--sz,5px);border-radius:50%;background:rgba(255,255,255,.8);z-index:3;opacity:0;animation:rise var(--bd,5s) linear infinite;animation-delay:var(--bl,0s)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-190px);opacity:0}}

.legend{display:flex;flex-direction:column;justify-content:center;gap:12px;font-size:13px;min-width:0;flex:1}
.legend div{display:flex;align-items:center;gap:7px}.legend em{width:9px;height:9px;border-radius:50%;flex:none;font-style:normal;box-shadow:0 0 8px currentColor}
.legend span{color:var(--dim);margin-left:auto}

/* Explore Page: Collectible Poster/Square-Card Genre Grid */
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px;max-width:1040px}
.gb{aspect-ratio:4/5;padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background:linear-gradient(155deg,hsl(var(--gh) 88% 46%/.46),rgba(14,14,24,.65) 78%);transition:transform .36s cubic-bezier(.22,1,.36,1),border-color .3s ease,box-shadow .36s ease}
.gb::before{content:"";position:absolute;width:130px;height:130px;right:-26px;top:-26px;border-radius:50%;background:radial-gradient(circle,hsl(var(--gh) 95% 65%/.55),transparent 70%);filter:blur(8px);pointer-events:none;transition:transform .45s ease}
.gb:hover{transform:translateY(-5px) scale(1.015);border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 22px 42px rgba(0,0,0,.48)}
.gb:hover::before{transform:scale(1.22)}
.gb-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.gb-dot{width:12px;height:12px;border-radius:50%;background:hsl(var(--gh) 92% 64%);box-shadow:0 0 14px hsl(var(--gh) 92% 60%)}
.gb-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.gb-bot{position:relative;z-index:1}
.gb-name{display:block;font:800 22px/1.12 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.gb-sub{display:block;font-size:12px;color:var(--dim);margin-top:5px}

.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.bar h2{font-size:26px}
.chipsrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed=true]{background:rgba(255,255,255,.9);color:#0a0a12}

/* Modal Overlay & Panel Animation */
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,3,8,.68);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:6;opacity:0;pointer-events:none;transition:opacity .3s ease}
#ov.on{opacity:1;pointer-events:auto}
#panel{width:100%;max-width:780px;max-height:100%;overflow:auto;padding:24px;background:rgba(22,20,36,.92);transform:translateY(18px) scale(.965);transition:transform .38s cubic-bezier(.22,1,.36,1)}
#ov.on #panel{transform:translateY(0) scale(1)}
#panel h2{font-size:26px;margin-bottom:14px}
.inp{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;color:var(--ink);font:inherit;padding:12px 14px;margin-bottom:16px}

/* Avatar Picker Grid */
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-top:8px}
.av-item{background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.av-item:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.av-item[aria-pressed=true]{background:rgba(255,255,255,.22);border-color:#fff}
.av-item .av-pic{width:56px;height:56px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2)}
.av-item .av-pic img{width:100%;height:100%;object-fit:cover;display:block}
.av-item .av-pic svg{width:38px;height:38px}
.av-item span{font-size:12px;line-height:1.2;font-weight:500}
.av-item small{font-size:10px;color:var(--dim);line-height:1.1}

.detail{display:grid;grid-template-columns:210px 1fr;gap:24px}
.detail img,.detail .ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:18px;display:block}
.detail .ph{display:flex;align-items:flex-end;padding:14px;font:800 22px "Bricolage Grotesque",system-ui,sans-serif;background:linear-gradient(160deg,#3b3b66,#12121f)}
@media (max-width:620px){.detail{grid-template-columns:1fr}.detail img,.detail .ph{max-width:220px}}
.meta{color:var(--dim);margin:6px 0}.over{margin:12px 0;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.links div,.links a{background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;padding:8px 14px;color:var(--ink);text-decoration:none;font-size:14px}
.links small{display:block;color:var(--dim);font-size:12px}
.acts{display:flex;gap:10px;margin-top:16px}
.btn{background:rgba(255,255,255,.92);color:#0a0a12;border:0;border-radius:999px;padding:10px 22px;font-weight:500}
.ghost{background:none;border:1px solid var(--edge);border-radius:999px;padding:9px 18px}

.pc.glass,.stat.glass,.gb.glass{backdrop-filter:none;-webkit-backdrop-filter:none}
.pc.glass,.stat.glass{background:rgba(30,28,50,.66)}
body.locked main,body.locked .dock,body.locked .fab,body.locked .side{visibility:hidden}
.logo{display:block;height:clamp(56px,9vw,84px);width:auto;max-width:100%;flex:none}
.brandrow{display:flex;align-items:center;gap:16px;margin:4px 0 26px}.brandrow .brand{margin:0}
#authbox .logo{height:120px;margin:0 auto 10px}
#auth{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
#auth.on{display:flex}
#authbox{width:100%;max-width:380px;padding:28px;text-align:center}

#authbox h2{font-size:24px}
.err{color:#ff9a9a;font-size:13px;min-height:18px;margin:-6px 0 10px;text-align:left}
.full{width:100%!important;height:100%!important}
.cv-prev{width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto 14px;border:1.5px solid rgba(255,255,255,.3)}
.cv-prev svg{width:100%;height:100%;display:block}
.cv-lbl{font-size:13px;color:var(--dim);margin:12px 0 6px}
.cv-row{display:flex;flex-wrap:wrap;gap:8px}
.cv-row .chip{text-transform:capitalize}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.sw[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
#av-cats{margin-top:6px}

/* Cinematic Universes, Universe Index & Cinemography */
.cu-wrap{display:flex;flex-direction:column;gap:16px;max-width:none;width:100%}
.cu-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.cu-eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(225,197,255,.82);font-weight:700}
.cu-prog{height:3px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.cu-prog i{display:block;height:100%;background:linear-gradient(90deg,hsl(var(--h) 92% 62%),hsl(var(--h2) 92% 62%));transition:width .25s ease}
.cu-stage{position:relative;height:78vh;min-height:560px;max-height:1040px;overflow:hidden;padding:0;background:radial-gradient(ellipse at 50% 48%,hsl(var(--h) 70% 24%/.22),transparent 65%),radial-gradient(ellipse at 14% 16%,hsl(var(--h2) 70% 22%/.18),transparent 55%),rgba(5,5,13,.95)}

.cu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}

/* Cinemography Editorial Page */
.cg-wrap{max-width:960px;display:flex;flex-direction:column;gap:20px}

/* Keyboard Shortcuts Cheat-Sheet Modal & Hint */

.kbd-fab{position:fixed;left:22px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--edge);color:var(--dim);font:800 15px/1 "Bricolage Grotesque",sans-serif;z-index:4;display:grid;place-items:center}

/* 1. First-Time Account Onboarding Walkthrough */
.ob-dots{display:flex;gap:7px;margin-bottom:14px}

.ob-card{padding:22px;border-radius:20px;background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);margin:10px 0 16px}
.ob-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:700 11px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.12);color:#e9d5ff;margin-bottom:10px}
.ob-keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* 2. Quick-Log Arcade Deck */
.arc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.arc-hud{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);font-size:12px;color:var(--dim);margin-bottom:12px}
.arc-hud span{display:inline-flex;align-items:center;gap:5px;margin-right:6px}
.arc-status{font-size:12px;color:#b8f7d4;min-height:18px;margin:-6px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.arc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-height:56vh;overflow-y:auto;padding:4px 2px 10px}

.arc-card{position:relative;padding:0;overflow:hidden;text-align:left;border-radius:16px;background:rgba(30,28,50,.72);border:2px solid rgba(255,255,255,.12);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.arc-card img,.arc-card .ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.arc-card .ph{display:flex;align-items:flex-end;padding:10px;font:800 15px/1.1 "Bricolage Grotesque",sans-serif;background:linear-gradient(160deg,#3b3b66,#12121f)}
.arc-card .arc-t{display:block;padding:8px 9px 10px;font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arc-card.active{border-color:#fff;transform:translateY(-3px) scale(1.02);box-shadow:0 0 0 3px hsl(var(--h) 92% 62%/.45),0 14px 28px rgba(0,0,0,.55);z-index:2}
.arc-card.logged-flash{animation:arcPop .38s ease}
@keyframes arcPop{0%{transform:scale(1.05);box-shadow:0 0 0 6px rgba(82,183,136,.75)}100%{transform:scale(.94);opacity:.2}}
.arc-badge{position:absolute;top:7px;left:7px;padding:3px 7px;border-radius:999px;background:rgba(10,10,18,.82);border:1px solid rgba(255,255,255,.22);font:700 10px/1 "Bricolage Grotesque",sans-serif;color:#e9d5ff}
.arc-mobile-actions{display:none}
@media (max-width:680px){

  #panel:has(#arc-grid) .arc-status{font-size:11px;margin:0 0 8px}
  #panel:has(#arc-grid) .arc-grid{display:flex;flex:1;min-height:0;max-height:none;overflow:hidden;justify-content:center;align-items:center;padding:0;touch-action:pan-y}
  #panel:has(#arc-grid) .arc-card{display:none}
  #panel:has(#arc-grid) .arc-card.active{display:flex;flex-direction:column;width:min(72vw,330px);max-height:100%;flex:none;border-radius:18px;transform:none;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  #panel:has(#arc-grid) .arc-card.active img,#panel:has(#arc-grid) .arc-card.active .ph{width:100%;height:auto;max-height:calc(100% - 44px);aspect-ratio:2/3;object-fit:contain;background:rgba(0,0,0,.22)}

  .arc-mobile-actions [data-arc-skip]{border-color:rgba(255,255,255,.2)}

}

/* 3. Universes Page: Live Entertainment & Upcoming Releases Flash Cards */
.live-feed{padding:18px 20px;margin-top:4px}
.live-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#52b788;box-shadow:0 0 10px #52b788;margin-right:6px}
.live-strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.live-strip::-webkit-scrollbar{display:none}
.flash-card{flex:0 0 280px;width:280px;padding:12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);display:flex;gap:12px;align-items:flex-start;text-align:left;transition:transform .24s ease,border-color .24s ease}
.flash-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.38)}
.flash-card img,.flash-card .f-ph{width:64px;height:96px;border-radius:10px;object-fit:cover;flex:none;background:rgba(255,255,255,.08)}
.flash-pill{display:inline-block;font:700 10px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(225,197,255,.14);border:1px solid rgba(225,197,255,.3);color:#e9d5ff;margin-bottom:5px}
.flash-pill.up{background:rgba(82,183,136,.16);border-color:rgba(82,183,136,.38);color:#a7f3d0}
.flash-title{display:block;font:800 14px/1.2 "Bricolage Grotesque",sans-serif;margin-bottom:4px}
.flash-meta{font-size:11px;color:var(--dim);line-height:1.35}

/* Taste Meter Overflow Fix & Clickable Trigger */
.side h3.tm-trigger{cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:color .2s ease}
.side h3.tm-trigger:hover{color:#fff}
.meter.tm-clickable{cursor:pointer}
.legend div{display:flex;align-items:center;gap:6px;min-width:0}
.legend .lg-lbl{min-width:0;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:normal;word-break:normal;line-height:1.2}
.legend span{color:var(--dim);margin-left:auto;white-space:nowrap;flex-shrink:0;padding-left:4px;font-variant-numeric:tabular-nums}

/* Director Spotlight Switcher */
.dir-head{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.dir-sw{background:rgba(255,255,255,.1);border:1px solid var(--edge);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--ink)}
.dir-sw:hover{background:rgba(255,255,255,.22)}

/* Multi-Page 3D Cinematic Passport */
.pp-stage{padding:22px;margin-top:4px;background:radial-gradient(circle at 50% 0%,hsl(var(--h) 70% 45%/.16),transparent 70%),rgba(255,255,255,.055)}
.pp-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.pp-book-wrap{perspective:2200px;display:flex;justify-content:center;align-items:center;min-height:420px;padding:8px 0}
.pp-cover{width:100%;max-width:348px;min-height:418px;border-radius:8px 22px 22px 8px;padding:30px 24px 30px 32px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;cursor:pointer;position:relative;transform-style:preserve-3d;background:linear-gradient(90deg,rgba(6,6,12,.98) 0%,rgba(28,25,48,.96) 5%,rgba(16,15,28,.98) 8%,rgba(12,11,22,.99) 100%);border:2px solid hsl(var(--h) 88% 62%/.75);border-left:5px solid hsl(var(--h) 88% 54%/.9);box-shadow:-10px 4px 0 #07070d,-13px 6px 0 rgba(255,230,175,.22),8px 10px 0 -4px rgba(235,230,220,.14),12px 14px 0 -6px rgba(235,230,220,.09),0 28px 65px rgba(0,0,0,.75),inset 0 0 36px hsl(var(--h) 88% 58%/.22);transform-origin:left center;transition:transform .65s cubic-bezier(.22,1,.36,1),box-shadow .45s ease}
.pp-cover::before{content:"";position:absolute;left:14px;top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,transparent,rgba(255,230,175,.32),transparent);pointer-events:none}
.pp-cover::after{content:"";position:absolute;inset:10px 10px 10px 20px;border:1px solid rgba(255,230,175,.24);border-radius:4px 14px 14px 4px;pointer-events:none}
.pp-cover-hit{width:100%;max-width:348px;display:flex;justify-content:center}
.pp-cover-hit:hover .pp-cover,.pp-cover:focus-visible{transform:perspective(2200px) rotateY(-16deg) translateX(4px);box-shadow:-12px 6px 0 #07070d,14px 14px 0 -4px rgba(245,240,230,.22),20px 18px 0 -6px rgba(245,240,230,.12),0 32px 72px rgba(0,0,0,.8),inset 0 0 42px hsl(var(--h) 88% 58%/.28)}
.pp-spread.still{animation:none}
.pp-nav .ghost:disabled{opacity:.4;cursor:default}
.pp-emblem{width:92px;height:92px;border-radius:50%;border:1.5px solid rgba(255,230,175,.6);display:grid;place-items:center;box-shadow:0 0 28px hsl(var(--h) 90% 60%/.35);background:radial-gradient(circle,hsl(var(--h) 80% 55%/.22),transparent 72%)}
.pp-emblem img{width:54px;height:54px;object-fit:contain}
.pp-spread{width:100%;max-width:880px;border-radius:18px;padding:24px 24px 20px;position:relative;transform-style:preserve-3d;background:linear-gradient(90deg,rgba(20,18,34,.96) 0%,rgba(26,24,44,.95) 47.5%,rgba(8,8,15,.99) 49.6%,rgba(3,3,8,1) 50%,rgba(8,8,15,.99) 50.4%,rgba(26,24,44,.95) 52.5%,rgba(20,18,34,.96) 100%);border:1.5px solid rgba(255,230,175,.36);box-shadow:0 6px 0 -2px rgba(240,235,225,.14),0 11px 0 -4px rgba(240,235,225,.09),0 28px 68px rgba(0,0,0,.78);animation:ppTurnNext .68s cubic-bezier(.22,1,.36,1)}
.pp-spread.turn-prev{animation:ppTurnPrev .68s cubic-bezier(.22,1,.36,1)}
.pp-spread.turn-open{animation:ppBookOpen .75s cubic-bezier(.22,1,.36,1)}
.pp-spread::before{content:"";position:absolute;top:12px;bottom:58px;left:50%;width:24px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.62) 50%,transparent);pointer-events:none;z-index:2}
.pp-turn-sheet{position:absolute;top:14px;bottom:62px;width:calc(50% - 20px);border-radius:14px;pointer-events:none;z-index:4;background:linear-gradient(135deg,rgba(255,248,232,.16),rgba(255,255,255,.03));border:1px solid rgba(255,230,175,.28);box-shadow:0 16px 36px rgba(0,0,0,.55);opacity:0}
.pp-spread:not(.still) .pp-turn-sheet.next{right:18px;transform-origin:left center;animation:ppLeafFlipLeft .68s cubic-bezier(.22,1,.36,1) forwards}
.pp-spread:not(.still) .pp-turn-sheet.prev{left:18px;transform-origin:right center;animation:ppLeafFlipRight .68s cubic-bezier(.22,1,.36,1) forwards}
@keyframes ppBookOpen{0%{opacity:0;transform:perspective(2000px) rotateY(-38deg) scale(.94)}60%{opacity:1}100%{opacity:1;transform:perspective(2000px) rotateY(0deg) scale(1)}}
@keyframes ppTurnNext{0%{transform:perspective(2000px) rotateY(8deg) scale(.985)}100%{transform:perspective(2000px) rotateY(0deg) scale(1)}}
@keyframes ppTurnPrev{0%{transform:perspective(2000px) rotateY(-8deg) scale(.985)}100%{transform:perspective(2000px) rotateY(0deg) scale(1)}}
@keyframes ppLeafFlipLeft{0%{opacity:.95;transform:perspective(1800px) rotateY(0deg)}45%{opacity:.85;box-shadow:-22px 12px 40px rgba(0,0,0,.75)}100%{opacity:0;transform:perspective(1800px) rotateY(-165deg)}}
@keyframes ppLeafFlipRight{0%{opacity:.95;transform:perspective(1800px) rotateY(0deg)}45%{opacity:.85;box-shadow:22px 12px 40px rgba(0,0,0,.75)}100%{opacity:0;transform:perspective(1800px) rotateY(165deg)}}
.pp-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;position:relative;z-index:1}
@media(max-width:720px){.pp-cols{grid-template-columns:1fr}.pp-spread::before,.pp-turn-sheet{display:none}}

/* Distant Blurry Starfield + Deep Contrast Genre Aura */
function ensureStars(){
 var stars=$("stars");
 if(stars.children.length)return;
 for(var i=0;i<40;i++){
  var s=document.createElement("i"),far=i%3!==0;
  s.className=far?"far":"mid";
  s.style.left=(Math.random()*98+1).toFixed(2)+"%";
  s.style.top=(Math.random()*98+1).toFixed(2)+"%";
  var sz=far?(Math.random()*1.8+1.6):(Math.random()*1.6+2.2);
  s.style.width=s.style.height=sz.toFixed(1)+"px";
  s.style.setProperty("--td",(4.2+Math.random()*5).toFixed(1)+"s");
  s.style.setProperty("--dl",(-Math.random()*6).toFixed(1)+"s");
  s.style.setProperty("--lo",far?".10":".18");
  s.style.setProperty("--hi",far?".42":".68");
  stars.appendChild(s)}}

function paint(){
 ensureStars();
 var st=document.documentElement.style;
 if(!films.length){
  st.setProperty("--h",230);st.setProperty("--h2",270);
  st.setProperty("--s1","62%");st.setProperty("--s2","52%");
  st.setProperty("--a1","0.62");st.setProperty("--a2","0.50");
  return null}
 var recent=sorted().slice(0,12),bins={};
 recent.forEach(function(f){var h=filmHue(f),b=Math.round(h/30)%12;(bins[b]=bins[b]||[]).push(h)});
 var bk=Object.keys(bins).sort(function(a,b){return bins[b].length-bins[a].length});
 var c1=mix(bins[bk[0]]);
 /* Ensure strong contrasting second hue even if only one genre cluster exists */
 var c2=bk[1]!==undefined?mix(bins[bk[1]]):(c1+135)%360;
 if(Math.abs(((c2-c1+540)%360)-180)>135)c2=(c1+130)%360;
 var n1=bins[bk[0]].length,n2=bk[1]!==undefined?bins[bk[1]].length:0;
 var dominance=Math.min(1,n1/Math.max(1,recent.length));
 var sh=n2?n1/(n1+n2):.78;
 st.setProperty("--h",c1.toFixed(1));
 st.setProperty("--h2",c2.toFixed(1));
 st.setProperty("--s1",(36+54*sh).toFixed(1)+"%");
 st.setProperty("--s2",(34+52*(1-sh)).toFixed(1)+"%");
 st.setProperty("--a1",(0.54+0.26*dominance).toFixed(2));
 st.setProperty("--a2",(0.44+0.20*(1-dominance*0.4)).toFixed(2));
 return mostCommon(recent.map(function(f){return f.genres[0]}))}

  var gs=(f.genres&&f.genres.length)?f.genres:["Drama"];
  gs.forEach(function(g){cnt[g]=(cnt[g]||0)+1;tot++;});
 });
 var ks=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]});
 return ks.map(function(g){
  return {genre:g,count:cnt[g],pct:tot?Math.round((cnt[g]/tot)*100):0,rawPct:tot?(cnt[g]/tot)*100:0,hue:hue(g)};
 });
}

var arcade = {
  items: [],
  cursor: 0,
  genreName: "Popular",
  seenIds: {},

  busyLog: false,
  returnToArcade: false,
  suppressCardClick: false

function arcadeCols() {

}

function renderArcadeGrid() {
  var grid = $("arc-grid"), st = $("arc-status");
  var mobile = window.matchMedia && window.matchMedia("(max-width: 680px)").matches;
  if (st) st.innerHTML = '<span>' + esc(arcade.statusMsg || ("Batch: " + arcade.genreName)) + '</span><span class="dim">' + arcade.items.length + ' ready</span>';
  if (!grid) return;
  if (!arcade.items.length) {
    grid.innerHTML = '<p class="dim" style="grid-column:1/-1">Loading unlogged films…</p>';
    return;
  }
  if (arcade.cursor >= arcade.items.length) arcade.cursor = Math.max(0, arcade.items.length - 1);
  var list = mobile
    ? arcade.items.slice(Math.max(0, arcade.cursor - 3), Math.min(arcade.items.length, arcade.cursor + 4))
    : arcade.items;
  var startIndex = mobile ? Math.max(0, arcade.cursor - 3) : 0;
  grid.innerHTML = list.map(function(m, idx) {
    var actualIdx = startIndex + idx;
    var offset = actualIdx - arcade.cursor;
    var act = actualIdx === arcade.cursor ? " active" : "";
    var yr = m.release_date ? " (" + m.release_date.slice(0, 4) + ")" : "";
    var badge = (!mobile && m._tag) ? '<span class="arc-badge">' + esc(m._tag) + '</span>' : "";
    var spatial = mobile ? ' style="--arc-angle:' + (offset * 27) + 'deg;--arc-depth:250px;--arc-distance:' + Math.abs(offset) + ';z-index:' + (20 - Math.abs(offset)) + '"' : '';
    return '<button type="button" class="arc-card' + act + '" data-arcidx="' + actualIdx + '" aria-label="' + esc(m.title) + '"' + spatial + '>' + badge +
      (m.poster_path ? '<img loading="lazy" decoding="async" alt="" src="' + img(m.poster_path, "w500") + '">' : '<div class="ph">' + esc(m.title) + '</div>') +
      '<span class="arc-t">' + esc(m.title + yr) + '</span></button>';
  }).join("");
  if (mobile) {
    var actions = document.getElementById("arc-mobile-actions");
    if (actions) actions.innerHTML = '';
  }
  var activeEl = grid.querySelector(".arc-card.active");
  if (activeEl && !mobile) activeEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function arcadeSkipCurrent() {
  if (!arcade.items.length || arcade.busyLog) return;
  arcade.cursor++;
  if (arcade.cursor >= arcade.items.length) {
    arcade.statusMsg = "You've reached the end of this batch. Refresh for more films.";
    arcade.cursor = Math.max(0, arcade.items.length - 1);
  } else arcade.statusMsg = "Skipped — here's the next film.";
  renderArcadeGrid();
}

function arcadeShowCurrentDetails() {

}

function bindArcadeSwipe() {
  var grid = $("arc-grid");
  if (!grid || grid.dataset.swipeBound) return;
  grid.dataset.swipeBound = "1";
  var sx = 0, sy = 0, tracking = false, card = null;
  grid.addEventListener("pointerdown", function(e) {
    if (e.pointerType === "mouse") return;
    card = e.target.closest(".arc-card.active");
    if (!card) return;
    sx = e.clientX; sy = e.clientY; tracking = true;
    card.classList.remove("arc-exit-left", "arc-exit-right", "arc-dragging");
    card.classList.add("arc-dragging");
  });
  grid.addEventListener("pointermove", function(e) {
    if (!tracking || !card) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > Math.abs(dy) * 0.8) {
      card.style.setProperty("--swipe-x", dx + "px");
      card.style.setProperty("--swipe-tilt", (dx * .035) + "deg");
      card.style.setProperty("--swipe-blur", Math.min(7, Math.abs(dx) / 24) + "px");
      card.classList.add("arc-moving");
    }
  });
  grid.addEventListener("pointerup", function(e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy, outgoing = card;
    if (Math.abs(dx) < 72 || Math.abs(dx) < Math.abs(dy) * 1.25) {
      if (outgoing) { outgoing.classList.remove("arc-dragging", "arc-moving"); outgoing.style.removeProperty("--swipe-x"); outgoing.style.removeProperty("--swipe-tilt"); outgoing.style.removeProperty("--swipe-blur"); }
      card = null; return;
    }
    arcade.suppressCardClick = true;
    if (outgoing) outgoing.classList.add(dx > 0 ? "arc-exit-right" : "arc-exit-left");
    setTimeout(function() {
      if (dx > 0) arcadeInstantLog(arcade.cursor);
      else arcadeSkipCurrent();
      if (outgoing) { outgoing.classList.remove("arc-dragging", "arc-moving", "arc-exit-left", "arc-exit-right"); outgoing.style.removeProperty("--swipe-x"); outgoing.style.removeProperty("--swipe-tilt"); outgoing.style.removeProperty("--swipe-blur"); }
      arcade.suppressCardClick = false;
    }, 190);
    card = null;
  });
  grid.addEventListener("pointercancel", function(){
    tracking = false;
    if (card) { card.classList.remove("arc-dragging", "arc-moving"); card.style.removeProperty("--swipe-x"); card.style.removeProperty("--swipe-tilt"); card.style.removeProperty("--swipe-blur"); }
    card = null;
  });
}

function loadArcadeBatch(forceRandomGenre) {
  var loggedMap = {};
  films.forEach(function(f) { loggedMap[f.tid] = 1; });
  var gNames = Object.keys(GID);
  var pickGenre = forceRandomGenre ? gNames[Math.floor(Math.random() * gNames.length)] : null;
  if (!pickGenre && films.length && Math.random() < 0.65) {
    var topG = mostCommon([].concat.apply([], films.slice(-8).map(function(f) { return f.genres || []; })));
    if (topG && GID[topG]) pickGenre = topG;
  }
  arcade.genreName = pickGenre || "Trending & Popular";
  arcade.statusMsg = "Loading " + arcade.genreName + " batch…";
  arcade.items = [];
  arcade.cursor = 0;
  renderArcadeGrid();

  var page = Math.floor(Math.random() * 3) + 1;
  var req = pickGenre
    ? api("discover/movie", { genre: GID[pickGenre], page: page })
    : api("trending/movie/week", { page: 1 });

  req.then(function(d) {
    var t = today();
    var fresh = (d.results || []).filter(function(m) {
      return m && m.id && !loggedMap[m.id] && (!m.release_date || m.release_date <= t);
    }).slice(0, 16);
    fresh.forEach(function(m) { arcade.seenIds[m.id] = 1; m._tag = pickGenre || "Trending"; });
    arcade.items = fresh;
    arcade.cursor = 0;
    arcade.statusMsg = "Genre: " + arcade.genreName + " · Press R for a new genre";
    renderArcadeGrid();
  }).catch(function() {
    arcade.statusMsg = "Could not load batch — type / to search by title.";
    renderArcadeGrid();
  });
}

function arcadeInstantLog(idx) {
  if (arcade.busyLog || !arcade.items[idx]) return;
  var m = arcade.items[idx];
  if (films.some(function(f) { return f.tid === m.id; })) {
    arcade.items.splice(idx, 1);
    renderArcadeGrid();
    return;
  }
  arcade.busyLog = true;
  arcade.statusMsg = "Logging " + m.title + " & feeding recommendations…";
  renderArcadeGrid();

  api("movie/" + m.id).then(function(full) {
    var crew = (full.credits && full.credits.crew) || [];
    var d = crew.filter(function(c) { return c.job === "Director"; })[0];
    var w = crew.filter(function(c) { return c.job === "Screenplay" || c.job === "Writer"; })[0];
    var pcn = (full.production_countries || [])[0];
    var extras = extractFilmExtras(full);
    var entry = {
      tid: full.id,
      title: full.title,
      year: (full.release_date || "").slice(0, 4),
      genres: (full.genres || []).map(function(g) { return g.name; }),
      director: d ? d.name : "",
      dphoto: d ? d.profile_path || "" : "",
      writer: w ? w.name : (extras.writers[0] || ""),
      poster: full.poster_path || "",
      score: full.vote_average ? full.vote_average.toFixed(1) : "",
      country: pcn ? pcn.iso_3166_1 : "",
      lang: full.original_language || "",
      cast: extras.cast,
      composer: extras.composer,
      writers: extras.writers,
      writerCredits: extras.writerCredits,
      keywords: extras.keywords,
      collection: extras.collection,
      releaseDate: extras.releaseDate,
      date: today(),
      at: Date.now(),
      v: 3
    };
    if (!films.some(function(f) { return f.tid === entry.tid; })) {
      films.push(entry);
      save();
      cuCache.key = "";
      paint();
      side();
      loadRows();
    }

    // Remove logged item from grid & fetch self-feeding recommendations
    arcade.items = arcade.items.filter(function(x) { return x.id !== m.id; });
    if (arcade.cursor >= arcade.items.length) arcade.cursor = Math.max(0, arcade.items.length - 1);
    renderArcadeGrid();

    return Promise.all([
      api("movie/" + m.id + "/recommendations").catch(function() { return { results: [] }; }),
      api("movie/" + m.id + "/similar").catch(function() { return { results: [] }; })
    ]).then(function(res) {
      var loggedMap = {};

document.addEventListener("keydown", function(e) {
  var ovOn = $("ov").classList.contains("on");
  var inArcade = ovOn && !!$("arc-grid");
  var activeEl = document.activeElement;
  var inSearchInput = activeEl && activeEl.id === "q";

  if (inArcade && inSearchInput) {
    if (e.key === "Escape" || e.key === "ArrowDown") {
      e.preventDefault();
      activeEl.blur();
      renderArcadeGrid();
    }
    return;
  }

  if (e.key === "Escape") {
    if (ovOn) { hide(); return; }
    if (view === "universes" && cuState.selected) { cuState.selected = null; render(true); return; }
    if (view === "explore" && ex.genre) { ex.genre = null; ex.sub = null; render(true); return; }
    return;
  }
  if (document.body.classList.contains("locked")) return;
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (e.target && e.target.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (e.key === "Tab") {
    if (ovOn && !inArcade) return;
    e.preventDefault();
    if (inArcade) hide();
    else openSearch();
    return;
  }

  var k = e.key, kl = k.toLowerCase();

  if (inArcade) {
    var cols = arcadeCols(), total = arcade.items.length;
    if (kl === "k" || k === "+" || k === "=") { e.preventDefault(); hide(); return; }
    if (k === "/") { e.preventDefault(); var qi = $("q"); if (qi) qi.focus(); return; }
    if (kl === "r") { e.preventDefault(); loadArcadeBatch(true); return; }
    if (kl === "w" || k === "ArrowUp") {
      e.preventDefault();
      if (total) { arcade.cursor = Math.max(0, arcade.cursor - cols); renderArcadeGrid(); }
      return;
    }
    if (kl === "s" || k === "ArrowDown") {
      e.preventDefault();
      if (total) { arcade.cursor = Math.min(total - 1, arcade.cursor + cols); renderArcadeGrid(); }
      return;
    }
    if (kl === "a" || k === "ArrowLeft") {
      e.preventDefault();
      if (total) { arcade.cursor = Math.max(0, arcade.cursor - 1); renderArcadeGrid(); }
      return;
    }
    if (kl === "d" || k === "ArrowRight") {
      e.preventDefault();
      if (total) { arcade.cursor = Math.min(total - 1, arcade.cursor + 1); renderArcadeGrid(); }
      return;
    }
    if (e.code === "ShiftLeft" || (k === "Shift" && e.location === 1)) {
      e.preventDefault();
      if (arcade.items[arcade.cursor]) {
        arcade.returnToArcade = true;
        openDetail(arcade.items[arcade.cursor].id);
      }
      return;
    }
    if (k === " " || e.code === "Space") {
      e.preventDefault();
      arcadeInstantLog(arcade.cursor);
      return;
    }
    return;
  }

  if (k === "?" || (k === "/" && e.shiftKey)) { e.preventDefault(); openShortcutsModal(); return; }
  if (k === "/" || kl === "k" || (k === "+" && view !== "universes")) { e.preventDefault(); openSearch(); return; }
  if (ovOn) return;

  if (k === "1") { e.preventDefault(); if (view !== "home") goView("home"); return; }
  if (k === "2") { e.preventDefault(); if (view !== "explore") goView("explore"); return; }
  if (k === "3") { e.preventDefault(); if (view !== "universes") goView("universes"); return; }
  if (k === "4") { e.preventDefault(); if (view !== "me") goView("me"); return; }
  if (kl === "c") { e.preventDefault(); if (view !== "cinemography") goView("cinemography"); return; }
  if (kl === "m") { e.preventDefault(); openAvatarPicker(); return; }

  if (view === "universes") {
    if (kl === "l") { e.preventDefault(); cuState.listMode = !cuState.listMode; render(true); return; }
    if (k === "+" || k === "=") { e.preventDefault(); cuState.zoom = Math.min(4, cuState.zoom * 1.25); drawConstellation(); return; }
    if (k === "-" || k === "_") { e.preventDefault(); cuState.zoom = Math.max(0.3, cuState.zoom * 0.8); drawConstellation(); return; }
    if (k === "0") { e.preventDefault(); cuState.zoom = 1; cuState.panX = 0; cuState.panY = 0; cuState.selected = null; render(true); return; }
    if (k === "ArrowRight") {
      e.preventDefault();
      if (!ppState.open) { ppState.open = true; ppState.page = 0; ppState.dir = "open"; render(true); }
      else if (ppState.page < ppTotalPages() - 1) { ppState.page++; ppState.dir = "next"; render(true); }
      else { cuState.panX -= 48; drawConstellation(); }
      return;
    }
    if (k === "ArrowLeft") {
      e.preventDefault();
      if (ppState.open) {
        if (ppState.page > 0) { ppState.page--; ppState.dir = "prev"; render(true); }
        else { ppState.open = false; render(true); }
      } else { cuState.panX += 48; drawConstellation(); }
      return;
    }
    if (k === "ArrowUp") { e.preventDefault(); cuState.panY += 48; drawConstellation(); return; }
    if (k === "ArrowDown") { e.preventDefault(); cuState.panY -= 48; drawConstellation(); return; }
  } else if (view === "home") {
    if (k === "ArrowRight" || k === "ArrowLeft") {
      var tr = document.querySelector(".row-track");
      if (tr) { tr.scrollBy({ left: k === "ArrowRight" ? 340 : -340, behavior: "smooth" }); }
    }
  }
});

function extractFilmExtras(m) {
  var credits = m.credits || {}, crew = credits.crew || [], castRaw = credits.cast || [];
  var cast = castRaw.slice(0, 6).map(function(p) { return { id: p.id, name: p.name, char: p.character || "" }; });
  var compObj = null;
  for (var i = 0; i < crew.length; i++) {
    var job = (crew[i].job || "").toLowerCase();
    if (job === "original music composer" || job === "composer" || job === "music") {
      compObj = { id: crew[i].id, name: crew[i].name }; break;
    }
  }
  var writers = [], writerCredits = [], seenW = {};
  for (var j = 0; j < crew.length; j++) {
    var wj = crew[j].job || "";
    if (wj === "Screenplay" || wj === "Writer" || wj === "Story") {
      if (!seenW[crew[j].name]) {
        seenW[crew[j].name] = 1;
        writers.push(crew[j].name);
        writerCredits.push({ id: crew[j].id, name: crew[j].name });
      }
    }
  }
  var kwList = (m.keywords && (m.keywords.keywords || m.keywords.results)) || [];
  var keywords = kwList.slice(0, 8).map(function(k) { return { id: k.id, name: k.name }; });
  var col = m.belongs_to_collection ? { id: m.belongs_to_collection.id, name: m.belongs_to_collection.name, poster: m.belongs_to_collection.poster_path || "" } : null;
  return { cast: cast, composer: compObj, writers: writers, writerCredits: writerCredits, keywords: keywords, collection: col, releaseDate: m.release_date || "", v: 3 };
}

function backfillFilmDetails() {
  if (cuState.backfillRunning || !films.length) return;
  var pending = films.filter(function(f) { return !f.v || f.v < 3; });
  if (!pending.length) { cuState.backfillMsg = ""; return; }
  cuState.backfillRunning = true;
  cuState.backfillTotal = pending.length;
  cuState.backfillDone = 0;
  cuState.backfillMsg = "Indexing film relationships (0/" + pending.length + ")…";
  updateCuProgressUI();
  var idx = 0, changed = false;
  function worker() {
    if (idx >= pending.length) return Promise.resolve();
    var item = pending[idx++];
    return api("movie/" + item.tid).then(function(m) {
      var exData = extractFilmExtras(m);
      item.cast = exData.cast;
      item.composer = exData.composer;
      item.writers = exData.writers;
      item.writerCredits = exData.writerCredits;
      item.keywords = exData.keywords;
      item.collection = exData.collection;
      if (exData.releaseDate) item.releaseDate = exData.releaseDate;
      if (!item.writer && exData.writers.length) item.writer = exData.writers[0];
      item.v = 3;
      changed = true;
      cuState.backfillDone++;
      cuState.backfillMsg = "Indexing film relationships (" + cuState.backfillDone + "/" + cuState.backfillTotal + ")…";
      updateCuProgressUI();
    }).catch(function() {
      cuState.backfillDone++;
      updateCuProgressUI();
    }).then(worker);
  }
  Promise.all([worker(), worker(), worker()]).then(function() {
    cuState.backfillRunning = false;
    if (changed) { save(); cuCache.key = ""; if (view === "universes") render(true); }
    cuState.backfillMsg = "";
    updateCuProgressUI();
  });
}

function updateCuProgressUI() {
  var bar = document.getElementById("cu-prog-bar"), lbl = document.getElementById("cu-prog-lbl");
  if (!bar || !lbl) return;
  if (cuState.backfillRunning && cuState.backfillTotal > 0) {
    bar.style.width = Math.min(100, Math.round((cuState.backfillDone / cuState.backfillTotal) * 100)) + "%";
    lbl.textContent = cuState.backfillMsg;
  } else { bar.style.width = "0%"; lbl.textContent = ""; }
}

function detectUniverseForFilm(f) {
  var cid = f.collection && f.collection.id;
  var kws = (f.keywords || []).map(function(k) { return (k.name || "").toLowerCase(); });
  for (var i = 0; i < UNIVERSE_CATALOG.length; i++) {
    var u = UNIVERSE_CATALOG[i];
    if (cid && u.collectionIds.indexOf(cid) >= 0) return { id: u.id, name: u.name, kind: u.type, desc: u.desc, collectionIds: u.collectionIds };
    for (var j = 0; j < u.keywords.length; j++) {
      if (kws.indexOf(u.keywords[j]) >= 0) return { id: u.id, name: u.name, kind: u.type, desc: u.desc, collectionIds: u.collectionIds };
    }
  }
  if (f.collection && f.collection.id) {
    return {
      id: "col_" + f.collection.id,
      name: f.collection.name.replace(/\s+Collection$/i, ""),
      kind: "Official Film Collection",
      desc: "Connected entries within " + f.collection.name + ".",
      collectionIds: [f.collection.id]
    };
  }
  return null;
}

function buildConstellationModel() {
  var key = films.map(function(f) { return f.tid + ":" + (f.v || 1) + ":" + (f.collection ? f.collection.id : 0); }).join("|");
  if (key === cuCache.key && cuCache.model) return cuCache.model;

  var nodes = [], universeMap = {}, edges = [];
  films.forEach(function(f, idx) {
    var u = detectUniverseForFilm(f);
    var g0 = (f.genres && f.genres[0]) || "Drama";
    var node = { film: f, idx: idx, x: 0, y: 0, hue: hue(g0), universe: u, connCount: 0 };
    nodes.push(node);
    if (u) {
      if (!universeMap[u.id]) universeMap[u.id] = { id: u.id, name: u.name, kind: u.kind, desc: u.desc, collectionIds: u.collectionIds, watchedNodes: [], x: 0, y: 0, hue: hue(g0) };
      universeMap[u.id].watchedNodes.push(node);
    }
  });

  for (var i = 0; i < nodes.length; i++) {
    for (var j = i + 1; j < nodes.length; j++) {
      var a = nodes[i], b = nodes[j], reasons = [], relType = "";
      if (a.universe && b.universe && a.universe.id === b.universe.id) {
        relType = a.universe.kind;
        reasons.push("Both belong to " + a.universe.name + " (" + a.universe.kind + ").");
      }
      if (a.film.director && b.film.director && a.film.director === b.film.director) {
        if (!relType) relType = "Shared Director";
        reasons.push("Directed by " + a.film.director + ".");
      }
      var wa = a.film.writers || (a.film.writer ? [a.film.writer] : []);
      var wb = b.film.writers || (b.film.writer ? [b.film.writer] : []);
      var sharedW = wa.filter(function(w) { return wb.indexOf(w) >= 0; });
      if (sharedW.length) {
        if (!relType) relType = "Shared Writer";
        reasons.push("Written by " + sharedW.join(", ") + ".");
      }
      var ca = (a.film.cast || []).map(function(c) { return c.name; });
      var cb = (b.film.cast || []).map(function(c) { return c.name; });
      var sharedC = ca.filter(function(c) { return cb.indexOf(c) >= 0; });
      if (sharedC.length) {
        if (!relType) relType = "Shared Cast";
        reasons.push("Features " + sharedC.slice(0, 3).join(", ") + ".");
      }
      if (reasons.length) {
        a.connCount++; b.connCount++;
        edges.push({
          id: a.film.tid + "_" + b.film.tid,
          a: a, b: b,
          isUniverse: !!(a.universe && b.universe && a.universe.id === b.universe.id),
          relType: relType,
          explanation: reasons.join(" ")
        });
      }
    }
  }

  var universes = Object.keys(universeMap).map(function(k) { return universeMap[k]; });
  if (nodes.length === 1) {
    nodes[0].x = 0; nodes[0].y = 0;
    if (universes[0]) { universes[0].x = 0; universes[0].y = -68; }
  } else {
    var uCount = universes.length;
    universes.forEach(function(u, ui) {
      var ang = (ui / Math.max(1, uCount)) * Math.PI * 2 - Math.PI / 2;
      var dist = uCount === 1 ? 0 : 185 + (ui % 2) * 55;
      u.x = Math.cos(ang) * dist;
      u.y = Math.sin(ang) * dist;
      var mCount = u.watchedNodes.length;
      u.watchedNodes.forEach(function(n, mi) {
        var ma = (mi / Math.max(1, mCount)) * Math.PI * 2 + ui * 0.6;
        var mr = mCount === 1 ? 68 : 74 + (mi % 2) * 24;
        n.x = u.x + Math.cos(ma) * mr;
        n.y = u.y + Math.sin(ma) * mr;
      });
    });
    var orphans = nodes.filter(function(n) { return !n.universe; });
    orphans.forEach(function(n, oi) {
      var ring = uCount ? 310 + Math.floor(oi / 8) * 95 : 130 + Math.floor(oi / 6) * 95;
      var ang = (oi * 2.39996) % (Math.PI * 2);
      n.x = Math.cos(ang) * ring;
      n.y = Math.sin(ang) * ring;
    });
  }

  var model = { nodes: nodes, universes: universes, edges: edges };
  cuCache.key = key;
  cuCache.model = model;
  return model;
}

function drawConstellation() {
  var canvas = document.getElementById("cu-canvas");
  if (!canvas) return;
  var model = buildConstellationModel();
  var rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var cw = Math.round(rect.width * dpr), ch = Math.round(rect.height * dpr);
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
  var ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, cw, ch);
  if (!model.nodes.length) return;

  var z = cuState.zoom, cx = cw * 0.5 + cuState.panX * dpr, cy = ch * 0.5 + cuState.panY * dpr;
  var sel = cuState.selected;
  var hits = [], edgeHits = [];

  model.universes.forEach(function(u) {
    var ux = cx + u.x * z * dpr, uy = cy + u.y * z * dpr;
    var rad = 115 * z * dpr;
    var g = ctx.createRadialGradient(ux, uy, 4, ux, uy, rad);
    g.addColorStop(0, "hsla(" + u.hue + ",85%,58%,0.18)");
    g.addColorStop(1, "hsla(" + u.hue + ",85%,45%,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ux, uy, rad, 0, Math.PI * 2); ctx.fill();
  });

  model.edges.forEach(function(e) {
    var x1 = cx + e.a.x * z * dpr, y1 = cy + e.a.y * z * dpr;
    var x2 = cx + e.b.x * z * dpr, y2 = cy + e.b.y * z * dpr;
    var isSel = sel && sel.type === "edge" && sel.id === e.id;
    ctx.save();
    if (!e.isUniverse) ctx.setLineDash([4 * dpr, 4 * dpr]);
    ctx.strokeStyle = isSel ? "rgba(255,244,195,0.95)" : (e.isUniverse ? "rgba(220,195,255,0.44)" : "rgba(255,255,255,0.22)");
    ctx.lineWidth = (isSel ? 2.6 : (e.isUniverse ? 1.6 : 1.1)) * dpr;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
    edgeHits.push({ edge: e, x1: x1, y1: y1, x2: x2, y2: y2 });
  });

  model.universes.forEach(function(u) {
    var ux = cx + u.x * z * dpr, uy = cy + u.y * z * dpr;
    u.watchedNodes.forEach(function(n) {
      ctx.strokeStyle = "hsla(" + u.hue + ",85%,70%,0.28)";
      ctx.lineWidth = 1 * dpr;
      ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(cx + n.x * z * dpr, cy + n.y * z * dpr); ctx.stroke();
    });
  });

  model.universes.forEach(function(u) {
    var ux = cx + u.x * z * dpr, uy = cy + u.y * z * dpr;
    var r = Math.max(8, 10.5 * Math.min(1.4, z)) * dpr;
    var g = ctx.createRadialGradient(ux, uy, 1, ux, uy, r * 2.4);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.4, "hsla(" + u.hue + ",95%,72%,0.75)");
    g.addColorStop(1, "hsla(" + u.hue + ",95%,60%,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ux, uy, r * 2.4, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(ux, uy, r * 0.55, 0, Math.PI * 2); ctx.fill();

    ctx.font = "600 " + Math.round(11.5 * dpr) + 'px "Bricolage Grotesque", sans-serif';
    ctx.fillStyle = "#f4ecff";
    ctx.fillText(u.name + " (" + u.watchedNodes.length + ")", ux + r + 6 * dpr, uy + 4 * dpr);
    hits.push({ type: "universe", universe: u, x: ux, y: uy, r: Math.max(18 * dpr, r * 1.8) });
  });

  model.nodes.forEach(function(n) {
    var sx = cx + n.x * z * dpr, sy = cy + n.y * z * dpr;
    var important = n.connCount >= 2 || (n.film.score && parseFloat(n.film.score) >= 7.8);
    var r = Math.max(3.6, (important ? 6 : 4.4) * Math.min(1.4, z)) * dpr;
    var isSel = sel && sel.type === "film" && sel.id === n.film.tid;

    var g = ctx.createRadialGradient(sx, sy, 0.5, sx, sy, r * 2.8);
    g.addColorStop(0, "rgba(255,255,255,0.95)");
    g.addColorStop(0.45, "hsla(" + n.hue + ",92%,66%,0.55)");
    g.addColorStop(1, "hsla(" + n.hue + ",92%,60%,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, r * 2.8, 0, Math.PI * 2); ctx.fill();

    if (isSel) {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.6 * dpr;
      ctx.beginPath(); ctx.arc(sx, sy, r + 4 * dpr, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.fillStyle = important ? "#ffffff" : "hsla(" + n.hue + ",95%,74%,1)";
    ctx.beginPath(); ctx.arc(sx, sy, r * 0.65, 0, Math.PI * 2); ctx.fill();

    if (z >= 0.85 || model.nodes.length <= 8 || isSel) {
      ctx.font = Math.round(11 * dpr) + 'px "Instrument Sans", sans-serif';
      ctx.fillStyle = "rgba(243,241,250,0.92)";
      ctx.fillText(n.film.title, sx + r + 5 * dpr, sy + 4 * dpr);
    }
    hits.push({ type: "film", node: n, x: sx, y: sy, r: Math.max(15 * dpr, r * 2.4) });
  });

  cuCache.hits = hits;
  cuCache.edges = edgeHits;
}

function openUniverseDashboard(universeId) {
  var model = buildConstellationModel();
  var u = model.universes.filter(function(x) { return x.id === universeId; })[0];
  if (!u) return;
  $("panel").innerHTML = '<p class="dim">Analyzing ' + esc(u.name) + '…</p>';
  show(false);

  Promise.all(u.collectionIds.map(function(cid) {
    if (cuState.colCache[cid]) return Promise.resolve(cuState.colCache[cid]);
    return api("collection/" + cid).then(function(d) { cuState.colCache[cid] = d; return d; }).catch(function() { cuState.colCache[cid] = { id: cid, parts: [], failed: true }; return null; });
  })).then(function(cols) {
    var seen = {}, allParts = [], todayStr = today();
    cols.forEach(function(c) {
      if (!c || !Array.isArray(c.parts)) return;
      c.parts.forEach(function(p) {
        if (!p || !p.id || seen[p.id]) return;
        if (p.release_date && p.release_date > todayStr) return;
        seen[p.id] = 1;
        allParts.push(p);
      });
    });

    u.watchedNodes.forEach(function(wn) {
      if (!seen[wn.film.tid]) {
        seen[wn.film.tid] = 1;
        allParts.push({ id: wn.film.tid, title: wn.film.title, release_date: wn.film.releaseDate || (wn.film.year ? wn.film.year + "-01-01" : ""), poster_path: wn.film.poster, overview: "" });
      }
    });

    allParts.sort(function(a, b) { return (a.release_date || "9999").localeCompare(b.release_date || "9999"); });
    var watchedIds = {};
    films.forEach(function(f) { watchedIds[f.tid] = f; });

    var total = allParts.length;
    var watchedList = allParts.filter(function(p) { return !!watchedIds[p.id]; });
    var remainingList = allParts.filter(function(p) { return !watchedIds[p.id]; });
    var watchedCount = watchedList.length;
    var remCount = remainingList.length;
    var pct = total ? Math.round((watchedCount / total) * 100) : 0;
    var status = watchedCount === 0 ? "Not explored" : (remCount === 0 && total > 0 ? "Universe completed" : (pct >= 75 ? "Nearly completed" : "In progress"));

    var insights = [];
    insights.push("You have explored " + watchedCount + " of the " + total + " identified released films in this collection scope.");
    if (remCount > 0) insights.push(remCount + (remCount === 1 ? " film remains" : " films remain") + " before you complete this collection.");
    else if (total > 0) insights.push("Every identified released entry in this collection scope is logged in your history.");
    if (watchedList.length && allParts.length) {
      var firstLogged = watchedList.slice().sort(function(a, b) { return (watchedIds[a.id].at || 0) - (watchedIds[b.id].at || 0); })[0];
      if (firstLogged && allParts[0] && firstLogged.id === allParts[0].id) {
        insights.push("You began exploring this universe with its earliest theatrical release (" + firstLogged.title + ").");
      } else if (firstLogged) {
        insights.push("Your entry point into this universe was " + firstLogged.title + (firstLogged.release_date ? " (" + firstLogged.release_date.slice(0, 4) + ")" : "") + ".");
      }
    }
    if (u.collectionIds.length > 1) {
      insights.push("Scope spans " + u.collectionIds.length + " official TMDB sub-collections; specials or uncollected spin-offs are excluded unless listed.");
    }

    var circ = 2 * Math.PI * 58;
    var dash = total ? (watchedCount / total) * circ : 0;

    var remHtml = remainingList.slice(0, 3).map(function(m) {
      return '<div class="jd-rem">' + (m.poster_path ? '<img alt="" src="' + img(m.poster_path, "w185") + '">' : '<div class="ph-sm"></div>') +
        '<div style="flex:1;min-width:0"><b>' + esc(m.title) + (m.release_date ? ' (' + m.release_date.slice(0, 4) + ')' : '') + '</b>' +
        '<div class="dim" style="font-size:12px;margin:2px 0 4px">Part of ' + esc(u.name) + ' · Unwatched</div>' +
        '<p class="dim" style="font-size:12px;margin:0;line-height:1.45">' + esc((m.overview || "No synopsis available.").slice(0, 150)) + '</p></div>' +
        '<button class="ghost" data-id="' + m.id + '">Open</button></div>';
    }).join("");

    var extraRemHtml = remainingList.slice(3).map(function(m) {
      return '<div class="jd-rem">' + (m.poster_path ? '<img alt="" src="' + img(m.poster_path, "w185") + '">' : '<div class="ph-sm"></div>') +
        '<div style="flex:1;min-width:0"><b>' + esc(m.title) + (m.release_date ? ' (' + m.release_date.slice(0, 4) + ')' : '') + '</b>' +
        '<div class="dim" style="font-size:12px;margin:2px 0 4px">Part of ' + esc(u.name) + ' · Unwatched</div>' +
        '<p class="dim" style="font-size:12px;margin:0;line-height:1.45">' + esc((m.overview || "No synopsis available.").slice(0, 150)) + '</p></div>' +
        '<button class="ghost" data-id="' + m.id + '">Open</button></div>';
    }).join("");

    var tlHtml = allParts.map(function(m, idx) {
      var isW = !!watchedIds[m.id];
      return '<button class="jd-tl-item' + (isW ? ' watched' : '') + '" data-id="' + m.id + '">' + (idx + 1) + '. ' + esc(m.title) + (m.release_date ? ' (' + m.release_date.slice(0, 4) + ')' : '') + (isW ? ' ✓' : '') + '</button>';
    }).join("");

    $("panel").innerHTML =
      '<div class="jd-head"><div><div class="cu-eyebrow">' + esc(u.kind) + '</div><h2 style="margin:4px 0">' + esc(u.name) + '</h2><p class="dim" style="margin:0;font-size:14px">' + esc(u.desc) + '</p></div><span class="cu-status' + (remCount === 0 && total > 0 ? ' done' : '') + '">' + esc(status) + '</span></div>' +
      '<div class="jd-grid"><div class="jd-donut"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="58" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="14"></circle><circle cx="70" cy="70" r="58" fill="none" stroke="hsl(var(--h) 90% 62%)" stroke-width="14" stroke-dasharray="' + dash.toFixed(1) + ' ' + circ.toFixed(1) + '" stroke-linecap="round"></circle></svg><div class="jd-donut-val"><strong>' + pct + '%</strong><span>Explored</span></div></div>' +
      '<div><div class="jd-metrics"><div class="jd-m"><strong>' + watchedCount + '</strong><span>Watched</span></div><div class="jd-m"><strong>' + remCount + '</strong><span>Remaining</span></div><div class="jd-m"><strong>' + total + '</strong><span>Total Scope</span></div></div>' +
      '<ul class="jd-insights">' + insights.map(function(x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></div></div>' +
      (remCount ? '<h3 style="font-size:16px;margin-bottom:6px">Remaining films to complete</h3><div class="jd-rem-list">' + remHtml + '</div>' + (extraRemHtml ? '<div id="jd-more-rem" class="jd-rem-list" style="display:none">' + extraRemHtml + '</div><button class="ghost" style="margin-top:10px" onclick="var e=document.getElementById(\'jd-more-rem\');var open=e.style.display===\'flex\';e.style.display=open?\'none\':\'flex\';this.textContent=open?\'Explore all remaining films (' + remCount + ')\':\'Show fewer\'">Explore all remaining films (' + remCount + ')</button>' : '') : '') +
      '<h3 style="font-size:16px;margin:18px 0 4px">Theatrical release order</h3><p class="dim" style="font-size:12px;margin:0 0 8px">Ordered strictly by theatrical release date (in-universe story chronology is not mixed in).</p><div class="jd-tl">' + tlHtml + '</div>' +
      '<div class="acts"><button class="ghost" data-act="close">Close</button></div>';
  });
}

function inspectorHTML() {

  if (s.type === "film") {
    var f = s.node.film;

    var connText = relEdges.length ? relEdges.slice(0, 3).map(function(e) {
      var other = e.a.film.tid === f.tid ? e.b.film.title : e.a.film.title;

    }).join(" · ") : "Standalone star in your log so far.";
    return '<div class="cu-inspector"><div class="cu-eyebrow">Film Star</div><h3>' + esc(f.title) + (f.year ? ' (' + esc(f.year) + ')' : '') + '</h3>' +
      '<div class="dim" style="font-size:12px">' + (f.director ? 'Directed by ' + esc(f.director) : 'Director unknown') + '</div>' +
      '<p>' + esc(connText) + '</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-id="' + f.tid + '">Open movie details</button>' +
      (s.node.universe ? '<button class="ghost" onclick="openUniverseDashboard(\'' + esc(s.node.universe.id) + '\')">Universe Index</button>' : '') +
      '<button class="ghost" onclick="cuState.selected=null;render(true)">Dismiss</button></div></div>';
  }
  if (s.type === "edge") {
    var e = s.edge;
    return '<div class="cu-inspector"><div class="cu-eyebrow">' + esc(e.relType) + '</div><h3>' + esc(e.a.film.title) + ' ↔ ' + esc(e.b.film.title) + '</h3>' +

  }
  return "";
}

function tasteMovieQuote(holderName, genreList, filmCount) {
  var g1 = genreList && genreList[0] ? genreList[0].name : "";
  var g2 = genreList && genreList[1] ? genreList[1].name : "";
  var pool = (TASTE_QUOTES[g1] || []).concat(TASTE_QUOTES[g2] || []);
  if (!pool.length) pool = TASTE_QUOTES.Default;
  var seedStr = String(holderName || "") + "|" + g1 + "|" + g2 + "|" + (filmCount || 0);
  var h = 0;
  for (var i = 0; i < seedStr.length; i++) h = ((h << 5) - h + seedStr.charCodeAt(i)) | 0;
  return pool[Math.abs(h) % pool.length];
}

function getUniverseCompletionStats(u) {
  var total = 0;
  var seen = {}, todayStr = today();
  (u.collectionIds || []).forEach(function(cid) {
    var col = cuState.colCache[cid];
    if (col && Array.isArray(col.parts)) {
      col.parts.forEach(function(p) {
        if (p && p.id && !seen[p.id] && (!p.release_date || p.release_date <= todayStr)) {
          seen[p.id] = 1;
          total++;
        }
      });
    }
  });
  var watched = u.watchedNodes ? u.watchedNodes.length : (u.watched || 0);
  if (total < watched) total = watched;
  var pct = total > 0 ? Math.round((watched / total) * 100) : (watched > 0 ? 100 : 0);
  return { watched: watched, total: total, pct: pct, knownTotal: Object.keys(seen).length > 0 };
}

function prefetchUniverseCollections(model) {
  var missing = [];
  model.universes.forEach(function(u) {
    (u.collectionIds || []).forEach(function(cid) {
      if (!cuState.colCache[cid] && missing.indexOf(cid) < 0) missing.push(cid);
    });
  });
  if (!missing.length) return;
  var gotNew = false;
  Promise.all(missing.map(function(cid) {
    return api("collection/" + cid).then(function(d) { cuState.colCache[cid] = d; gotNew = true; }).catch(function() { cuState.colCache[cid] = { id: cid, parts: [], failed: true }; });
  })).then(function() {
    if (gotNew && view === "universes") render(true);
  });
}

function computeSharedOverlap(sharedData) {
  if (!sharedData || !Array.isArray(sharedData.genres) || !films.length) return null;
  var myBreakdown = fullGenreBreakdown();
  var myMap = {};
  myBreakdown.forEach(function(g) { myMap[g.genre] = g.pct; });
  var sTot = sharedData.genres.reduce(function(acc, g) { return acc + (g.count || 0); }, 0) || 1;
  var overlap = 0;
  sharedData.genres.forEach(function(g) {
    var sPct = Math.round(((g.count || 0) / sTot) * 100);
    if (myMap[g.name]) overlap += Math.min(myMap[g.name], sPct);
  });
  return Math.min(100, Math.max(8, overlap));
}

function drawPassportMiniConstellation() {
  var cv = document.getElementById("pp-mini-canvas");
  if (!cv) return;
  var model = buildConstellationModel();
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var rect = cv.getBoundingClientRect();
  var w = (rect.width || 300) * dpr, h = (rect.height || 112) * dpr;
  cv.width = w; cv.height = h;
  var ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, w, h);
  for (var i = 0; i < 26; i++) {
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.beginPath(); ctx.arc((i * 97) % w, (i * 53) % h, 1.1 * dpr, 0, Math.PI * 2); ctx.fill();
  }
  if (!model.nodes.length) return;
  var scale = 0.22 * dpr, cx = w * 0.5, cy = h * 0.5;
  model.edges.forEach(function(e) {
    ctx.strokeStyle = "rgba(225,197,255,0.45)";
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath();
    ctx.moveTo(cx + e.a.x * scale, cy + e.a.y * scale);
    ctx.lineTo(cx + e.b.x * scale, cy + e.b.y * scale);
    ctx.stroke();
  });
  model.nodes.forEach(function(n) {
    ctx.fillStyle = "hsl(" + n.hue + ",95%,74%)";
    ctx.beginPath();
    ctx.arc(cx + n.x * scale, cy + n.y * scale, 2.6 * dpr, 0, Math.PI * 2);
    ctx.fill();
  });
}


function stampLines(name) {
  var n = String(name || "Universe").trim();
  var words = n.split(/\s+/);
  if (words.length > 2 && /^the$/i.test(words[0])) words.shift();
  var lines = [], cur = "";
  words.forEach(function(w) {
    if (w.length > 12) w = w.slice(0, 11) + "…";
    if (!cur) cur = w;
    else if ((cur + " " + w).length <= 12) cur += " " + w;
    else { lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  if (lines.length > 3) { lines = lines.slice(0, 3); if (lines[2].slice(-1) !== "…") lines[2] = lines[2].slice(0, 11) + "…"; }
  return lines;
}
