<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fourth wall — Personal Cinematic Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --h:268;--h2:312;
  --bg:#090811;--ink:#f5f2fc;--dim:rgba(235,230,250,.64);
  --glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.15);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* Dynamic Atmospheric Sky Aura */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(65vw 55vh at 18% 12%,hsla(var(--h),88%,48%,.24),transparent 65%),
    radial-gradient(60vw 50vh at 84% 78%,hsla(var(--h2),85%,46%,.2),transparent 65%),
    linear-gradient(180deg,#0b0a16 0%,#07060d 100%);
  transition:background 1.1s ease}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.035;background-image:radial-gradient(#fff 1px,transparent 0);background-size:24px 24px}

/* Glass Surfaces */
.glass{background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14)}
.btn{padding:10px 18px;border-radius:999px;font-weight:600;font-size:13.5px;background:linear-gradient(135deg,hsl(var(--h) 85% 60%),hsl(var(--h2) 82% 56%));color:#fff;box-shadow:0 8px 24px hsla(var(--h),85%,50%,.34);transition:transform .2s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px hsla(var(--h),85%,55%,.46)}
.ghost{padding:9px 16px;border-radius:999px;font-weight:500;font-size:13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);transition:background .2s ease,border-color .2s ease}
.ghost:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.32)}
.dim{color:var(--dim)}
.num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800}

/* App Shell & Left Taste Meter Sidebar */
.app{position:relative;z-index:2;display:grid;grid-template-columns:192px 1fr;min-height:100vh}
@media(max-width:860px){.app{grid-template-columns:1fr}}
.side{position:sticky;top:0;height:100vh;padding:20px 14px 96px;border-right:1px solid rgba(255,255,255,.1);background:rgba(10,9,20,.65);backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:12px}
@media(max-width:860px){.side{position:static;height:auto;border-right:0;border-bottom:1px solid rgba(255,255,255,.1);padding:14px}}
.side h3{margin:4px 0 0;font:700 11px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.who{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:left}
.who:hover{background:rgba(255,255,255,.12)}
.who b{display:block;font-size:13.5px;line-height:1.2}
.who small{color:var(--dim);font-size:11.5px}
.face{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,hsla(var(--h),85%,62%,.38),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.22);overflow:hidden}
.face svg{width:24px;height:24px}
.face img{width:100%;height:100%;object-fit:cover}
.face.sil{background:radial-gradient(circle at 50% 36%,rgba(255,255,255,.22) 0 22%,transparent 24%),radial-gradient(circle at 50% 92%,rgba(255,255,255,.18) 0 40%,transparent 42%),rgba(255,255,255,.06)}

/* Test Tube Meter (Clickable + No Clipped Percentages) */
.meter{display:flex;gap:10px;flex:1;min-height:240px;align-items:stretch;cursor:pointer;padding:6px;margin:-6px;border-radius:16px;transition:background .25s ease}
.meter:hover{background:rgba(255,255,255,.06)}
.tube{width:34px;flex:none;display:flex;flex-direction:column;align-items:center}
.rim{width:40px;height:7px;border-radius:999px;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.45)}
.pipe{position:relative;width:30px;flex:1;border-radius:0 0 18px 18px;border:1.5px solid rgba(255,255,255,.28);border-top:0;background:rgba(255,255,255,.04);overflow:hidden;box-shadow:inset 0 0 14px rgba(0,0,0,.55)}
.fill{position:absolute;inset:0;display:flex;flex-direction:column-reverse;transition:opacity .5s ease}
.fill.empty{opacity:.38}
.band{flex:var(--f,1);background:hsl(var(--c,268) 85% 56%);box-shadow:0 0 16px hsl(var(--c,268) 85% 52%);animation:pulseBand var(--dur,7s) ease-in-out infinite alternate}
@keyframes pulseBand{from{filter:brightness(.92)}to{filter:brightness(1.18)}}
.bub{position:absolute;bottom:-10px;left:var(--x,10px);width:var(--sz,4px);height:var(--sz,4px);border-radius:50%;background:rgba(255,255,255,.55);animation:rise var(--bd,5s) linear var(--bl,0s) infinite}
@keyframes rise{to{transform:translateY(-360px);opacity:0}}
.legend{display:flex;flex-direction:column;justify-content:center;gap:11px;font-size:12px;min-width:0;flex:1;padding-right:2px}
.legend div{display:flex;align-items:center;gap:6px;min-width:0}
.legend em{width:8px;height:8px;border-radius:50%;flex:none;font-style:normal;box-shadow:0 0 8px currentColor}
.legend b.lg-name{font-weight:400;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend span{color:var(--dim);flex:none;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:11.5px}

/* Main Content Stage & Top Brand */
.main{padding:24px 28px 112px;max-width:1280px;width:100%;margin:0 auto}
@media(max-width:640px){.main{padding:18px 16px 112px}}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:38px;height:38px;object-fit:contain;border-radius:10px}
.brand-name{font:700 18px/1.1 "Cinzel",Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
.brand-tag{font-size:11.5px;color:var(--dim)}
h1.pg{font:800 clamp(26px,3.6vw,38px)/1.12 "Bricolage Grotesque",sans-serif;margin:0 0 18px;letter-spacing:-.02em}
h2{font:800 22px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 12px}
h3{font:700 17px/1.25 "Bricolage Grotesque",sans-serif;margin:0}

/* Poster Grids & Shelves */
.shelf{margin-bottom:28px}
.shelf-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px}
.card{position:relative;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.36);box-shadow:0 18px 36px rgba(0,0,0,.5)}
.card img,.card .ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.03))}
.card .meta{padding:10px 11px}
.card .t{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .y{font-size:11.5px;color:var(--dim);margin-top:3px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);margin:0 6px 6px 0}

/* Bottom Floating Navigation Dock */
.dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;padding:7px;border-radius:999px;background:rgba(14,13,26,.82);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 46px rgba(0,0,0,.62)}
.dock button{padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;color:var(--dim);transition:all .2s ease}
.dock button:hover{color:#fff}
.dock button.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.dock .plus{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 88% 60%),hsl(var(--h2) 85% 56%));box-shadow:0 6px 20px hsla(var(--h),88%,54%,.45)}
.dock .plus:hover{transform:scale(1.07)}

/* Me / Profile Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px}
.stat{padding:20px}
.stat .num{font-size:36px;line-height:1.1;margin:6px 0}
.stat.dir{display:flex;align-items:center;gap:14px}
.stat.dir .face{width:62px;height:62px;font-weight:800;font-size:20px}
.stat.dir .num{font-size:20px;margin:3px 0}
.stat.dir .msg{font-size:13.5px;margin:4px 0;color:var(--ink)}
.dir-wrap{position:relative}
.dir-switch{margin-top:8px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);color:var(--ink)}
.dir-switch:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}

/* Modal Overlay & Quick-Log Arcade */
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,4,12,.76);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.ov.on{display:flex}
.panel{width:100%;max-width:740px;max-height:90vh;overflow-y:auto;padding:24px;position:relative}
.panel.arcade{max-width:980px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.detail{display:grid;grid-template-columns:190px 1fr;gap:20px}
@media(max-width:600px){.detail{grid-template-columns:1fr}}
.detail img,.detail .ph{width:100%;aspect-ratio:2/3;border-radius:16px;object-fit:cover;background:rgba(255,255,255,.07)}

/* Quick-Log Arcade Controls */
.arc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.arc-search{display:flex;gap:10px;margin-bottom:14px}
.arc-search input{flex:1;padding:11px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);outline:none}
.arc-search input:focus{border-color:hsl(var(--h) 85% 65%)}
.arc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:760px){.arc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.arc-card{position:relative;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;cursor:pointer}
.arc-card.sel{transform:translateY(-4px) scale(1.02);border-color:hsl(var(--h) 92% 68%);box-shadow:0 0 0 2px hsla(var(--h),92%,68%,.35),0 18px 34px rgba(0,0,0,.55)}
.arc-card.logged{opacity:.62}
.arc-card img,.arc-card .ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:rgba(255,255,255,.06)}
.arc-card .meta{padding:9px 10px}
.arc-badge{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(12,11,22,.85);border:1px solid rgba(255,255,255,.24)}
.arc-hud{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:var(--dim)}
.kbd{display:inline-block;padding:2px 7px;border-radius:6px;font:700 11px/1.3 monospace;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:#fff;margin-right:4px}

/* Cinematic Universes, Constellation Map & Upgraded List View */
.cu-wrap{display:flex;flex-direction:column;gap:18px}
.cu-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.cu-eyebrow{font:700 11px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:hsl(var(--h) 88% 74%)}
.cu-prog{height:3px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.cu-prog i{display:block;height:100%;background:linear-gradient(90deg,hsl(var(--h) 88% 62%),hsl(var(--h2) 85% 60%));transition:width .3s ease}
.cu-stage{position:relative;height:540px;overflow:hidden;padding:0}
.cu-canvas{width:100%;height:100%;display:block;cursor:grab}
.cu-canvas:active{cursor:grabbing}
.cu-hud-tl{position:absolute;top:14px;left:14px;z-index:3}
.cu-hud-tr{position:absolute;top:14px;right:14px;z-index:3;display:flex;gap:6px}
.cu-hud-bl{position:absolute;bottom:14px;left:14px;right:14px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;pointer-events:none}
.cu-badge{padding:6px 12px;border-radius:999px;font-size:12px;background:rgba(11,10,22,.82);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px)}
.cu-zbtn{width:34px;height:34px;border-radius:50%;background:rgba(11,10,22,.82);border:1px solid rgba(255,255,255,.2);font-weight:700;font-size:16px}
.cu-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;padding:6px 12px;border-radius:999px;background:rgba(11,10,22,.82);border:1px solid rgba(255,255,255,.16)}
.cu-legend span{display:inline-flex;align-items:center;gap:6px}
.cu-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.cu-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;pointer-events:none}
.cu-insp{position:absolute;top:56px;right:14px;z-index:4;width:270px;padding:16px;border-radius:18px;background:rgba(12,11,24,.92);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px)}
.cu-status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;background:hsla(var(--h),85%,55%,.22);border:1px solid hsla(var(--h),85%,65%,.45);color:#f3e8ff}
.cu-status.done{background:rgba(255,214,102,.18);border-color:rgba(255,214,102,.55);color:#ffd666}
.cu-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.cu-bar i{display:block;height:100%;background:linear-gradient(90deg,hsl(var(--h) 88% 62%),hsl(var(--h2) 85% 60%))}

/* Upgraded Universe List Cards */
.cu-grid-v2{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.cu-card-v2{padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;position:relative;overflow:hidden;transition:transform .28s cubic-bezier(.22,1,.36,1),border-color .28s ease,box-shadow .28s ease}
.cu-card-v2:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.38);box-shadow:0 20px 44px rgba(0,0,0,.48)}
.cu-card-v2.complete{border-color:rgba(255,214,102,.48);box-shadow:inset 0 1px 0 rgba(255,214,102,.3),0 18px 40px rgba(0,0,0,.4)}
.cu-posters{display:flex;gap:8px;align-items:center}
.cu-posters img,.cu-posters .cu-pph{width:46px;height:68px;border-radius:9px;object-fit:cover;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);flex:none}
.cu-card-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--dim)}
.cu-pill{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13)}
.cu-card-acts{display:flex;gap:8px;margin-top:auto;padding-top:4px}

/* Full Taste Breakdown Circle Donut Modal */
.tm-modal{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center;margin-top:8px}
@media(max-width:640px){.tm-modal{grid-template-columns:1fr}}
.tm-ring{position:relative;width:200px;height:200px;margin:0 auto;display:grid;place-items:center}
.tm-ring svg{width:200px;height:200px;transform:rotate(-90deg)}
.tm-ring-center{position:absolute;text-align:center;pointer-events:none;padding:0 16px}
.tm-ring-center strong{display:block;font:800 30px/1 "Bricolage Grotesque",sans-serif}
.tm-ring-center span{display:block;font-size:11px;color:var(--dim);margin-top:4px}
.tm-list{display:flex;flex-direction:column;gap:9px;max-height:52vh;overflow-y:auto;padding-right:4px}
.tm-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:13.5px}
.tm-dot{width:10px;height:10px;border-radius:50%;flex:none}
.tm-bar-bg{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.tm-bar-fg{height:100%;border-radius:999px}

/* Multi-Page Cinematic Passport */
.pp-shell{display:flex;flex-direction:column;align-items:center;gap:14px;perspective:1800px}
.pp-topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pp-stage{position:relative;width:100%;display:flex;align-items:center;justify-content:center;gap:12px}
.pp-arrow{width:42px;height:42px;border-radius:50%;flex:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;font-size:18px;color:#fff}
.pp-arrow:hover:not(:disabled){background:rgba(255,255,255,.22);border-color:#fff;transform:scale(1.06)}
.pp-arrow:disabled{opacity:.28;cursor:not-allowed}

/* Closed Passport Cover */
.pp-cover{width:100%;max-width:420px;aspect-ratio:3/4.15;border-radius:12px 26px 26px 12px;padding:34px 28px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;position:relative;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 25% 20%,hsl(var(--h) 70% 24%/.45),transparent 65%),linear-gradient(155deg,#171528 0%,#0b0a14 100%);
  border:1.5px solid hsla(var(--h),88%,68%,.45);
  box-shadow:-8px 0 0 #090810,inset 10px 0 18px rgba(0,0,0,.65),0 24px 60px rgba(0,0,0,.68),0 0 42px hsla(var(--h),90%,55%,.25);
  transform-origin:left center;transition:transform .65s cubic-bezier(.22,1,.36,1),opacity .45s ease}
.pp-cover:hover{transform:rotateY(-8deg) scale(1.01)}
.pp-cover.opening{transform:rotateY(-105deg);opacity:0;pointer-events:none}
.pp-cover::before{content:"";position:absolute;inset:14px;border-radius:8px 20px 20px 8px;border:1px solid rgba(245,215,142,.28);pointer-events:none}
.pp-cover-top{font:700 11px/1.3 "Cinzel",Georgia,serif;letter-spacing:.26em;color:rgba(245,215,142,.82);text-transform:uppercase}
.pp-emblem{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(245,215,142,.16),transparent 70%);border:1.5px solid rgba(245,215,142,.42);box-shadow:0 0 36px rgba(245,215,142,.18);padding:18px}
.pp-emblem img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
.pp-cover-title{font:700 26px/1.15 "Cinzel",Georgia,serif;letter-spacing:.14em;color:#f7e7c4;text-transform:uppercase}
.pp-cover-sub{font-size:12px;color:var(--dim);letter-spacing:.08em}

/* Open Booklet Pages */
.pp-book{width:100%;max-width:680px;min-height:470px;border-radius:22px;padding:24px 26px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 85% 15%,hsla(var(--h),80%,40%,.18),transparent 58%),linear-gradient(160deg,rgba(26,24,44,.96),rgba(13,12,24,.98));
  border:1px solid rgba(255,255,255,.22);box-shadow:0 24px 60px rgba(0,0,0,.6);
  animation:ppPageIn .38s cubic-bezier(.22,1,.36,1)}
@keyframes ppPageIn{from{opacity:0;transform:rotateY(14deg) scale(.98)}to{opacity:1;transform:none}}
.pp-book::after{content:"";position:absolute;inset:10px;border-radius:16px;border:1px dashed rgba(255,255,255,.11);pointer-events:none}
.pp-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:12px;margin-bottom:14px}
.pp-id-grid{display:grid;grid-template-columns:1fr 165px;gap:16px;align-items:start}
@media(max-width:620px){.pp-id-grid{grid-template-columns:1fr}}
.pp-const-box{border-radius:16px;padding:10px;background:rgba(6,6,14,.85);border:1px solid rgba(255,255,255,.16);text-align:center}
.pp-const-box canvas{width:145px;height:145px;display:block;margin:0 auto;border-radius:10px}
.pp-const-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.pp-bio{font-size:13.5px;line-height:1.65;color:rgba(245,242,252,.9);background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;margin:12px 0}
.pp-mrz{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);font:600 11px/1.55 monospace;letter-spacing:.08em;color:rgba(225,197,255,.82);overflow:hidden}
.pp-films-strip{display:flex;gap:8px;margin-top:10px}
.pp-films-strip img,.pp-films-strip .pp-fph{width:48px;height:72px;border-radius:8px;object-fit:cover;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08)}

/* Passport Stamps Grid */
.pp-stamps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:8px}
@media(max-width:560px){.pp-stamps{grid-template-columns:1fr}}
.pp-stamp{padding:14px 16px;border-radius:16px;border:2px dashed hsla(var(--sc,270),88%,68%,.62);background:hsla(var(--sc,270),80%,45%,.09);transform:rotate(var(--rot,-1.5deg));position:relative;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 18px hsla(var(--sc,270),85%,55%,.12)}
.pp-stamp.gold{border-style:solid;border-color:rgba(255,214,102,.78);background:rgba(255,214,102,.1);box-shadow:0 0 22px rgba(255,214,102,.18)}
.pp-stamp.hex{border-radius:24px 8px 24px 8px}
.pp-stamp-top{display:flex;justify-content:space-between;align-items:center;font:800 10px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:hsla(var(--sc,270),95%,78%,1)}
.pp-stamp.gold .pp-stamp-top{color:#ffd666}
.pp-stamp-name{font:800 16px/1.2 "Bricolage Grotesque",sans-serif}
.pp-stamp-meta{font-size:11.5px;color:var(--dim)}
.pp-overlap{padding:16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);margin-top:10px}

/* Universe Index Dashboard Modal */
.jv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:14px}
.jv-item{border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);padding:0;text-align:left}
.jv-item img,.jv-item .ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:rgba(255,255,255,.06)}
.jv-item.unwatched img{filter:grayscale(1) brightness(.55)}
.jv-item .meta{padding:8px 9px}

/* Live Entertainment Flash Cards */
.news-wrap{margin-top:26px;padding:20px}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.news-card{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:flex;gap:12px;text-align:left}
.news-card img{width:54px;height:80px;border-radius:10px;object-fit:cover;flex:none}

/* Cinemography Poster View */
.cg-wrap{max-width:780px;margin:0 auto}
.cg-sheet{padding:32px;background:radial-gradient(circle at 20% 15%,hsla(var(--h),85%,48%,.25),transparent 60%),linear-gradient(160deg,#141226,#0a0914)}
.cg-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.cg-box{padding:14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}

/* Onboarding Walkthrough & Auth Gate */
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(6,5,14,.86);backdrop-filter:blur(22px)}
.gate.off{display:none}
.gate-card{width:100%;max-width:420px;padding:30px}
.gate-card input{width:100%;padding:12px 15px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);margin-bottom:12px;outline:none}
.gate-card input:focus{border-color:hsl(var(--h) 85% 65%)}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:rgba(255,255,255,.06);padding:5px;border-radius:999px}
.tabs button{flex:1;padding:8px;border-radius:999px;font-weight:600;font-size:13px;color:var(--dim)}
.tabs button.on{background:rgba(255,255,255,.16);color:#fff}
.ob-dots{display:flex;gap:6px;margin:16px 0}
.ob-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22)}
.ob-dots i.on{width:22px;border-radius:999px;background:hsl(var(--h) 88% 64%)}
</style>
</head>
<body>
<div class="sky"></div>
<div class="grain"></div>

<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="brandbar">
      <div class="brand">
        <img src="logo.png" alt="" onerror="this.style.display='none'">
        <div>
          <div class="brand-name">Fourth wall</div>
          <div class="brand-tag">Personal Cinematic Observatory</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="ghost" onclick="openShortcuts()" title="Keyboard controls">Controls (?)</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<nav class="dock" aria-label="Primary navigation">
  <button id="n-home" class="on" onclick="goView('home')">Home</button>
  <button id="n-log" onclick="goView('log')">My Log</button>
  <button class="plus" onclick="openSearch()" title="Quick-Log Arcade (Tab or +)">+</button>
  <button id="n-universes" onclick="goView('universes')">Universes</button>
  <button id="n-me" onclick="goView('me')">Me</button>
</nav>

<div class="ov" id="ov" onclick="if(event.target===this)hide()">
  <div class="panel glass" id="panel"></div>
</div>

<div class="gate" id="gate">
  <div class="gate-card glass">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <img src="logo.png" alt="" style="width:42px;height:42px;object-fit:contain" onerror="this.style.display='none'">
      <div>
        <div class="brand-name">Fourth wall</div>
        <div class="dim" style="font-size:12px">Your living film taste & universe observatory</div>
      </div>
    </div>
    <div class="tabs">
      <button id="t-in" class="on" onclick="authTab('in')">Sign in</button>
      <button id="t-up" onclick="authTab('up')">Create account</button>
    </div>
    <form id="auth-form" onsubmit="submitAuth(event)">
      <input id="a-user" placeholder="Username" autocomplete="username" required>
      <input id="a-pass" type="password" placeholder="Password" autocomplete="current-password" required>
      <div id="a-err" style="color:#ff8fa3;font-size:12.5px;min-height:18px;margin-bottom:8px"></div>
      <button class="btn" style="width:100%" id="a-btn" type="submit">Enter Observatory</button>
    </form>
    <div style="margin-top:14px;text-align:center">
      <button class="ghost" style="width:100%" onclick="guestEnter()">Continue as Guest</button>
    </div>
  </div>
</div>

<script>
var $ = function(id) { return document.getElementById(id); };
var esc = function(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var img = function(p, sz) { return p ? "https://image.tmdb.org/t/p/" + (sz || "w342") + p : ""; };
var today = function() { return new Date().toISOString().slice(0, 10); };

/* Genre Hues & Dynamic Sky Aura */
var GENRE_HUES = {
  "Science Fiction": 195, "Sci-Fi": 195, "Action": 16, "Adventure": 34, "Animation": 148,
  "Comedy": 46, "Crime": 348, "Documentary": 172, "Drama": 268, "Family": 92,
  "Fantasy": 286, "History": 28, "Horror": 355, "Music": 318, "Mystery": 244,
  "Romance": 332, "Thriller": 218, "War": 10, "Western": 30
};
function hue(g) {
  if (!g) return 268;
  if (GENRE_HUES[g] != null) return GENRE_HUES[g];
  var h = 0;
  for (var i = 0; i < g.length; i++) h = (h * 31 + g.charCodeAt(i)) % 360;
  return h;
}
function applyAura() {
  if (!films.length) {
    document.documentElement.style.setProperty("--h", 268);
    document.documentElement.style.setProperty("--h2", 312);
    return;
  }
  var cnt = {};
  sorted().slice(0, 12).forEach(function(f) {
    var g = (f.genres && f.genres[0]) || "Drama";
    cnt[g] = (cnt[g] || 0) + 1;
  });
  var ks = Object.keys(cnt).sort(function(a, b) { return cnt[b] - cnt[a]; });
  var h1 = hue(ks[0]);
  var h2 = ks[1] ? hue(ks[1]) : (h1 + 42) % 360;
  document.documentElement.style.setProperty("--h", h1);
  document.documentElement.style.setProperty("--h2", h2);
}

/* State & Persistence */
var user = null;
var films = [];
var view = "home";
var ovOn = false;
var inArcade = false;
var recs = [];
var arcItems = [];
var arcSel = 0;
var arcGenre = 878;
var arcQuery = "";

var MOODS = [
  { id: "noir", name: "Noir Detective", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="6"/><path d="M4 10h16M7 10l2-5h6l2 5"/></svg>' },
  { id: "sci", name: "Starlight Voyager", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><path d="M5 12h14M12 5a10 10 0 0 1 0 14"/></svg>' },
  { id: "indie", name: "Celluloid Dreamer", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="12" r="2"/></svg>' },
  { id: "horror", name: "Midnight Watchman", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>' }
];
var avatar = MOODS[1];
function avatarGraphic() { return avatar.icon; }

function ukey(suf) { return "fw_u_" + (user || "guest") + "_" + suf; }
function loadUserData() {
  try {
    var raw = localStorage.getItem(ukey("films"));
    films = raw ? JSON.parse(raw) : [];
    var avId = localStorage.getItem(ukey("avatar"));
    var found = MOODS.filter(function(m) { return m.id === avId; })[0];
    avatar = found || MOODS[1];
  } catch (e) { films = []; }
}
function saveUserData() {
  try {
    localStorage.setItem(ukey("films"), JSON.stringify(films));
    localStorage.setItem(ukey("avatar"), avatar.id);
  } catch (e) {}
}
function sorted() {
  return films.slice().sort(function(a, b) { return (b.at || 0) - (a.at || 0); });
}
function hasFilm(tid) {
  return films.some(function(f) { return String(f.tid) === String(tid); });
}

/* TMDB Serverless Proxy Helper */
function api(endpoint, params) {
  var u = new URL("/api/tmdb", window.location.origin);
  u.searchParams.set("endpoint", endpoint);
  if (params) {
    Object.keys(params).forEach(function(k) {
      if (params[k] !== undefined && params[k] !== null && params[k] !== "") {
        u.searchParams.set(k, params[k]);
      }
    });
  }
  return fetch(u.toString()).then(function(r) {
    if (!r.ok) throw new Error("TMDB HTTP " + r.status);
    return r.json();
  });
}

/* Auth & Onboarding */
var authMode = "in";
function authTab(m) {
  authMode = m;
  $("t-in").classList.toggle("on", m === "in");
  $("t-up").classList.toggle("on", m === "up");
  $("a-btn").textContent = m === "in" ? "Enter Observatory" : "Create Account & Start";
  $("a-err").textContent = "";
}
function submitAuth(e) {
  e.preventDefault();
  var u = $("a-user").value.trim().toLowerCase();
  var p = $("a-pass").value;
  if (!u || !p) return;
  var accounts = {};
  try { accounts = JSON.parse(localStorage.getItem("fw_accounts") || "{}"); } catch (err) {}
  if (authMode === "up") {
    if (accounts[u]) { $("a-err").textContent = "Username already exists."; return; }
    accounts[u] = p;
    try { localStorage.setItem("fw_accounts", JSON.stringify(accounts)); } catch (err) {}
    enterSession(u, true);
  } else {
    if (!accounts[u] || accounts[u] !== p) { $("a-err").textContent = "Invalid username or password."; return; }
    enterSession(u, false);
  }
}
function guestEnter() { enterSession("guest", false); }
function signOut() {
  user = null;
  try { localStorage.removeItem("fw_session"); } catch (e) {}
  $("gate").classList.remove("off");
  document.body.classList.add("locked");
}
function enterSession(u, isNew) {
  user = u;
  try { localStorage.setItem("fw_session", u); } catch (e) {}
  loadUserData();
  $("gate").classList.add("off");
  document.body.classList.remove("locked");
  render(true);
  refreshRecs();
  backfillConstellation();
  var seenOb = false;
  try { seenOb = localStorage.getItem(ukey("ob_done")) === "1"; } catch (e) {}
  if (ppState.friendData) {
    setTimeout(function() { openPassportModal(0); }, 300);
  } else if (isNew || !seenOb) {
    setTimeout(function() { openOnboarding(0); }, 260);
  }
}

/* 4-Step Interactive Onboarding Walkthrough */
var OB_STEPS = [
  { title: "Welcome to Fourth wall", body: "Every film you log shifts the living atmosphere of your observatory—coloring your sky aura and filling your Taste Meter in real time." },
  { title: "Quick-Log Arcade (+ or Tab)", body: "Press Tab or + anytime to open the Arcade deck. Navigate with W A S D, press Spacebar to log a film immediately, and watch fresh recommendations auto-populate." },
  { title: "Constellation & Cinematic Passport", body: "Head to Universes to explore how your films connect across franchises, directors, and cast—and flip open your personal Cinematic Passport stamped with every universe you discover." },
  { title: "Cinemography & Director Spotlights", body: "Check Me to track your total hours, unlock your 3-film Director Spotlight, and export a 9:16 Cinemography poster card." }
];
function openOnboarding(step) {
  var s = OB_STEPS[step] || OB_STEPS[0];
  var dots = OB_STEPS.map(function(_, i) { return '<i class="' + (i === step ? 'on' : '') + '"></i>'; }).join("");
  $("panel").innerHTML =
    '<div class="cu-eyebrow">Observatory Walkthrough · Step ' + (step + 1) + ' of ' + OB_STEPS.length + '</div>' +
    '<h2 style="margin-top:8px">' + esc(s.title) + '</h2>' +
    '<p class="dim" style="font-size:15px;line-height:1.65">' + esc(s.body) + '</p>' +
    '<div class="ob-dots">' + dots + '</div>' +
    '<div class="acts">' +
      '<button class="ghost" onclick="finishOnboarding()">Skip</button>' +
      (step > 0 ? '<button class="ghost" onclick="openOnboarding(' + (step - 1) + ')">Back</button>' : '') +
      (step < OB_STEPS.length - 1
        ? '<button class="btn" onclick="openOnboarding(' + (step + 1) + ')">Next</button>'
        : '<button class="btn" onclick="finishOnboarding()">Start Exploring</button>') +
    '</div>';
  show(false);
}
function finishOnboarding() {
  try { localStorage.setItem(ukey("ob_done"), "1"); } catch (e) {}
  hide();
}

/* Test Tube Taste Meter + Full Genre Circle Breakdown Modal */
function side() {
  var el = $("side"), n = films.length;
  var h = '<button class="who" onclick="openAvatarModal()" title="Change cinema mood avatar"><div class="face">' + avatarGraphic() + '</div><div><b>' + esc(user || avatar.name) + '</b><small>' + n + (n === 1 ? " film" : " films") + '</small></div></button><h3>Taste meter</h3>';
  var bubs = "";
  for (var i = 0; i < 6; i++) bubs += '<i class="bub" style="--x:' + (7 + i * 5.5) + 'px;--sz:' + (3 + i % 3 * 2) + 'px;--bd:' + (4 + i * .9).toFixed(1) + 's;--bl:' + (-i * 1.3).toFixed(1) + 's"></i>';
  function tube(bands) {
    return '<div class="tube"><div class="rim"></div><div class="pipe"><div class="fill' + (n ? "" : " empty") + '">' + bands + '</div>' + bubs + '</div></div>';
  }
  if (!n) {
    h += '<div class="meter" role="button" tabindex="0" onclick="openTasteMeterModal()" title="View full genre breakdown">' + tube('<div class="band" style="--c:230;--f:1;--dur:8s"></div><div class="band" style="--c:275;--f:1;--dur:9s"></div>') + '<p class="dim" style="font-size:12.5px;align-self:center">Log films and your taste fills the tube.</p></div>';
  } else {
    var cnt = {}, tot = 0;
    sorted().slice(0, 12).forEach(function(f) {
      var g = (f.genres && f.genres[0]) || "Drama";
      cnt[g] = (cnt[g] || 0) + 1;
      tot++;
    });
    var ks = Object.keys(cnt).sort(function(a, b) { return cnt[b] - cnt[a]; });
    h += '<div class="meter" role="button" tabindex="0" onclick="openTasteMeterModal()" title="Click for full genre circle breakdown">' +
      tube(ks.map(function(g, i) { return '<div class="band" style="--c:' + hue(g) + ';--f:' + (cnt[g] / tot).toFixed(3) + ';--dur:' + (6 + i * 1.2).toFixed(1) + 's"></div>'; }).join("")) +
      '<div class="legend">' + ks.slice(0, 6).map(function(g) {
        var c = "hsl(" + hue(g) + " 85% 58%)";
        var label = g === "Science Fiction" ? "Sci-Fi" : g;
        return '<div><em style="background:' + c + ';color:' + c + '"></em><b class="lg-name" title="' + esc(g) + '">' + esc(label) + '</b><span>' + Math.round(cnt[g] / tot * 100) + '%</span></div>';
      }).join("") + '</div></div>';
  }
  if (el._h !== h) { el._h = h; el.innerHTML = h; }
}

function openTasteMeterModal() {
  var cnt = {}, tot = 0;
  films.forEach(function(f) {
    var gs = (f.genres && f.genres.length) ? f.genres : ["Drama"];
    gs.forEach(function(g) { cnt[g] = (cnt[g] || 0) + 1; tot++; });
  });
  var list = Object.keys(cnt).map(function(g) {
    return { name: g, count: cnt[g], pct: tot ? (cnt[g] / tot * 100) : 0, hue: hue(g) };
  }).sort(function(a, b) { return b.count - a.count; });

  var R = 76, C = 2 * Math.PI * R, offset = 0;
  var segs = list.length ? list.map(function(item) {
    var len = (item.pct / 100) * C;
    var seg = '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="hsl(' + item.hue + ' 88% 58%)" stroke-width="24" stroke-dasharray="' + len.toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '"></circle>';
    offset += len;
    return seg;
  }).join("") : '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="24"></circle>';

  var topName = list[0] ? list[0].name : "Empty";
  var rowsHtml = list.length ? list.map(function(item) {
    var col = 'hsl(' + item.hue + ' 88% 58%)';
    return '<div class="tm-row"><span class="tm-dot" style="background:' + col + ';box-shadow:0 0 8px ' + col + '"></span><strong style="min-width:118px;font-weight:600">' + esc(item.name) + '</strong><div class="tm-bar-bg"><div class="tm-bar-fg" style="width:' + Math.max(3, item.pct).toFixed(1) + '%;background:' + col + '"></div></div><span class="dim" style="font-size:12px;min-width:86px;text-align:right;font-variant-numeric:tabular-nums">' + item.pct.toFixed(1) + '% (' + item.count + ')</span></div>';
  }).join("") : '<p class="dim">No films logged yet. Press Tab or + to log your first film.</p>';

  $("panel").innerHTML =
    '<h2>Full Genre Taste Breakdown</h2>' +
    '<p class="dim" style="margin:-6px 0 12px;font-size:14px">Complete genre distribution across all ' + films.length + (films.length === 1 ? ' logged film' : ' logged films') + '.</p>' +
    '<div class="tm-modal">' +
      '<div class="tm-ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="' + R + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="24"></circle>' + segs + '</svg>' +
      '<div class="tm-ring-center"><strong>' + (list[0] ? Math.round(list[0].pct) + '%' : '0%') + '</strong><span>' + esc(topName) + '</span></div></div>' +
      '<div class="tm-list">' + rowsHtml + '</div>' +
    '</div>' +
    '<div class="acts"><button class="btn" data-act="close">Close</button></div>';
  show(false);
}

function openAvatarModal() {
  $("panel").innerHTML = '<h2>Today's Cinema Mood</h2><p class="dim">Choose the persona shown in your Taste Meter and Cinematic Passport.</p>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px">' +
    MOODS.map(function(m) {
      return '<button class="glass" style="padding:16px;text-align:center;border-color:' + (m.id === avatar.id ? 'hsl(var(--h) 90% 65%)' : 'var(--line)') + '" onclick="pickMood('' + m.id + '')"><div class="face" style="margin:0 auto 10px;width:48px;height:48px">' + m.icon + '</div><b>' + esc(m.name) + '</b></button>';
    }).join("") + '</div><div class="acts"><button class="ghost" data-act="close">Done</button></div>';
  show(false);
}
function pickMood(id) {
  avatar = MOODS.filter(function(m) { return m.id === id; })[0] || MOODS[1];
  saveUserData();
  render(true);
  hide();
}

/* Modal Show / Hide & Delegated Actions */
function show(arcadeMode) {
  ovOn = true;
  inArcade = !!arcadeMode;
  $("panel").classList.toggle("arcade", inArcade);
  $("ov").classList.add("on");
}
function hide() {
  ovOn = false;
  inArcade = false;
  $("ov").classList.remove("on");
}
$("panel").addEventListener("click", function(e) {
  var btn = e.target.closest("[data-act]");
  if (!btn) return;
  var act = btn.getAttribute("data-act");
  if (act === "close") hide();
  else if (act === "log") {
    var tid = Number(btn.getAttribute("data-tid"));
    logFilmById(tid, true);
  } else if (act === "del") {
    var did = Number(btn.getAttribute("data-tid"));
    films = films.filter(function(f) { return f.tid !== did; });
    saveUserData();
    render(true);
    hide();
  }
});

/* Logging & TMDB Detail Hydration */
function logFilmById(tid, closeAfter) {
  if (hasFilm(tid)) { if (closeAfter) hide(); return Promise.resolve(); }
  return api("movie/" + tid, { append_to_response: "credits" }).then(function(d) {
    if (hasFilm(tid)) return;
    var crew = (d.credits && d.credits.crew) || [];
    var cast = (d.credits && d.credits.cast) || [];
    var dirObj = crew.filter(function(c) { return c.job === "Director"; })[0] || {};
    var entry = {
      tid: d.id,
      title: d.title || d.original_title || "Untitled",
      year: (d.release_date || "").slice(0, 4),
      date: today(),
      at: Date.now(),
      poster: d.poster_path || "",
      runtime: d.runtime || 110,
      genres: (d.genres || []).map(function(g) { return g.name; }),
      director: dirObj.name || "",
      dphoto: dirObj.profile_path || "",
      cast: cast.slice(0, 5).map(function(c) { return c.name; }),
      countries: (d.production_countries || []).map(function(c) { return c.name; }),
      collection: d.belongs_to_collection ? { id: d.belongs_to_collection.id, name: d.belongs_to_collection.name } : null
    };
    films.push(entry);
    saveUserData();
    render(true);
    refreshRecs();
    if (closeAfter) hide();
  }).catch(function() {
    if (closeAfter) hide();
  });
}

  var m = {};
  films.forEach(function(f) { if (f.director) m[f.director] = (m[f.director] || 0) + 1; });

/* Constellation Graph Engine & Universe Definitions */
var CURATED_UNIVERSES = [
  { id: "mcu", name: "Marvel Cinematic Universe", kind: "Shared Universe", hue: 355, collectionIds: [86311, 131295, 131292, 131296, 284433, 531241, 422837, 623911, 529892, 617284], desc: "Interconnected superhero saga spanning the Infinity and Multiverse eras." },

  { id: "wizarding", name: "Wizarding World", kind: "Franchise", hue: 42, collectionIds: [1241, 435259], desc: "Hogwarts and the broader magical world across decades." },
  { id: "starwars", name: "Star Wars Galaxy", kind: "Saga", hue: 48, collectionIds: [10], desc: "The Skywalker saga and galactic anthology stories." },
  { id: "monsterverse", name: "MonsterVerse", kind: "Shared Universe", hue: 165, collectionIds: [535313, 374509], desc: "Titans colliding across Skull Island and Hollow Earth." },
  { id: "conjuring", name: "The Conjuring Universe", kind: "Horror Universe", hue: 345, collectionIds: [313086, 402074, 531330], desc: "Paranormal casefiles of Ed and Lorraine Warren." },
  { id: "middleearth", name: "Middle-earth", kind: "Fantasy Saga", hue: 135, collectionIds: [119, 121938], desc: "Tolkien's Third Age quests through the Shire, Rohan, and Mordor." },
  { id: "dune", name: "Dune Saga", kind: "Sci-Fi Saga", hue: 34, collectionIds: [726871], desc: "Spice, prophecy, and imperial politics on Arrakis." }
];

var cuState = {
  zoom: 1,
  panX: 0,
  panY: 0,
  selected: null,
  listMode: false,
  colCache: {},
  backfillMsg: ""
};

function mostCommon(arr) {
  var m = {}, b = "", c = 0;
  arr.forEach(function(x) { m[x] = (m[x] || 0) + 1; if (m[x] > c) { c = m[x]; b = x; } });
  return b;
}

function buildConstellationModel() {
  var nodes = films.map(function(f, idx) {
    var g = (f.genres && f.genres[0]) || "Drama";
    return { id: "f_" + f.tid, film: f, hue: hue(g), idx: idx, x: 0, y: 0, uId: null };
  });

  var univMap = {};
  nodes.forEach(function(n) {
    var col = n.film.collection;
    if (!col || !col.id) return;
    var cur = CURATED_UNIVERSES.filter(function(cu) { return cu.collectionIds.indexOf(col.id) >= 0; })[0];
    var uid = cur ? cur.id : "col_" + col.id;
    if (!univMap[uid]) {
      univMap[uid] = {
        id: uid,
        name: cur ? cur.name : col.name.replace(/\s*Collection$/i, ""),
        kind: cur ? cur.kind : "Film Collection",
        hue: cur ? cur.hue : n.hue,
        desc: cur ? cur.desc : "Connected entries in " + col.name + ".",
        collectionIds: cur ? cur.collectionIds.slice() : [col.id],
        watchedNodes: [],
        x: 0,
        y: 0
      };
    }
    if (univMap[uid].collectionIds.indexOf(col.id) < 0) univMap[uid].collectionIds.push(col.id);
    univMap[uid].watchedNodes.push(n);
    n.uId = uid;
  });

  var universes = Object.keys(univMap).map(function(k) { return univMap[k]; });
  var uCount = universes.length;
  universes.forEach(function(u, i) {
    var ang = (i / Math.max(1, uCount)) * Math.PI * 2 - Math.PI / 2;
    var rad = uCount === 1 ? 0 : 145;
    u.x = Math.cos(ang) * rad;
    u.y = Math.sin(ang) * rad;
    u.watchedNodes.forEach(function(n, j) {
      var a2 = ang + ((j - (u.watchedNodes.length - 1) / 2) * 0.55);
      var r2 = uCount === 1 ? 110 : 74;
      n.x = u.x + Math.cos(a2) * r2;
      n.y = u.y + Math.sin(a2) * r2;
    });
  });

  var orphans = nodes.filter(function(n) { return !n.uId; });
  orphans.forEach(function(n, i) {
    var ang = (i / Math.max(1, orphans.length)) * Math.PI * 2 + 0.35;
    var rad = (uCount ? 255 : 155) + (i % 2) * 34;
    n.x = Math.cos(ang) * rad;
    n.y = Math.sin(ang) * rad;
  });

  var edges = [];
  universes.forEach(function(u) {
    for (var i = 0; i < u.watchedNodes.length; i++) {
      for (var j = i + 1; j < u.watchedNodes.length; j++) {
        edges.push({ a: u.watchedNodes[i], b: u.watchedNodes[j], isUniverse: true, label: u.name });
      }
    }
  });
  for (var i = 0; i < nodes.length; i++) {
    for (var j = i + 1; j < nodes.length; j++) {
      if (nodes[i].uId && nodes[i].uId === nodes[j].uId) continue;
      var shared = [];
      if (nodes[i].film.director && nodes[i].film.director === nodes[j].film.director) {
        shared.push("Director: " + nodes[i].film.director);
      }
      var cA = nodes[i].film.cast || [], cB = nodes[j].film.cast || [];
      cA.forEach(function(actor) { if (cB.indexOf(actor) >= 0) shared.push("Cast: " + actor); });
      if (shared.length) {
        edges.push({ a: nodes[i], b: nodes[j], isUniverse: false, label: shared[0] });
      }
    }
  }

  return { nodes: nodes, universes: universes, edges: edges };
}

function backfillConstellation() {
  var missing = films.filter(function(f) { return f.collection === undefined; });
  if (!missing.length) return;
  cuState.backfillMsg = "Syncing universe metadata for " + missing.length + " films…";
  Promise.all(missing.slice(0, 8).map(function(f) {
    return api("movie/" + f.tid).then(function(d) {
      f.collection = d.belongs_to_collection ? { id: d.belongs_to_collection.id, name: d.belongs_to_collection.name } : null;
    }).catch(function() { f.collection = null; });
  })).then(function() {
    cuState.backfillMsg = "";
    saveUserData();
    if (view === "universes") render(true);
  });
}

function getUniverseScopeCount(u) {
  var total = 0, seen = {}, t = today();
  (u.collectionIds || []).forEach(function(cid) {
    var col = cuState.colCache[cid];
    if (col && Array.isArray(col.parts)) {
      col.parts.forEach(function(p) {
        if (p && p.id && !seen[p.id] && (!p.release_date || p.release_date <= t)) {
          seen[p.id] = 1;
          total++;
        }
      });
    }
  });
  return Math.max(total, u.watchedNodes.length);
}

function prefetchUniverseScopes(universes) {
  var missing = [];
  universes.forEach(function(u) {
    (u.collectionIds || []).forEach(function(cid) {
      if (!cuState.colCache[cid] && missing.indexOf(cid) < 0) missing.push(cid);
    });
  });
  if (!missing.length) return;
  Promise.all(missing.slice(0, 6).map(function(cid) {
    return api("collection/" + cid).then(function(d) { cuState.colCache[cid] = d; }).catch(function() {});
  })).then(function() {
    if (view === "universes" && cuState.listMode) render(true);
  });
}

function inspectorHTML() {
  if (!cuState.selected) return "";
  var s = cuState.selected;
  if (s.type === "universe") {
    return '<div class="cu-insp"><div class="cu-eyebrow">' + esc(s.data.kind) + '</div><h3 style="margin:4px 0 6px">' + esc(s.data.name) + '</h3><p class="dim" style="font-size:12.5px;margin:0 0 12px">' + esc(s.data.desc) + '</p><div style="display:flex;gap:8px"><button class="btn" style="padding:7px 12px;font-size:12px" onclick="openUniverseDashboard('' + esc(s.data.id) + '')">Universe Index</button><button class="ghost" style="padding:7px 10px;font-size:12px" onclick="cuState.selected=null;render(true)">Close</button></div></div>';

var cuHitBoxes = [];
function bindConstellation() {
  var cv = $("cu-canvas");
  if (!cv) return;
  drawConstellation();
  var dragging = false, sx = 0, sy = 0, moved = false;
  cv.onmousedown = function(e) { dragging = true; moved = false; sx = e.clientX; sy = e.clientY; };
  window.onmousemove = function(e) {
    if (!dragging) return;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > 4) moved = true;
    cuState.panX += e.clientX - sx;
    cuState.panY += e.clientY - sy;
    sx = e.clientX;
    sy = e.clientY;
    drawConstellation();
  };
  window.onmouseup = function() { dragging = false; };
  cv.onwheel = function(e) {
    e.preventDefault();
    cuState.zoom = Math.max(0.3, Math.min(4, cuState.zoom * (e.deltaY < 0 ? 1.12 : 0.9)));
    drawConstellation();
  };
  cv.onclick = function(e) {
    if (moved) return;
    var rect = cv.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    for (var i = 0; i < cuHitBoxes.length; i++) {
      var hb = cuHitBoxes[i];
      if (Math.hypot(mx - hb.x, my - hb.y) <= hb.r) {
        cuState.selected = hb;
        render(true);
        return;
      }
    }
  };
}

function drawConstellation() {
  var cv = $("cu-canvas");
  if (!cv) return;
  var rect = cv.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  cv.width = rect.width * dpr;
  cv.height = rect.height * dpr;
  var ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  var w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);

  var model = buildConstellationModel();
  cuHitBoxes = [];
  var cx = w / 2 + cuState.panX, cy = h / 2 + cuState.panY, z = cuState.zoom;

  model.edges.forEach(function(e) {
    var x1 = cx + e.a.x * z, y1 = cy + e.a.y * z;
    var x2 = cx + e.b.x * z, y2 = cy + e.b.y * z;
    ctx.save();
    ctx.strokeStyle = e.isUniverse ? "rgba(225,197,255,0.48)" : "rgba(255,255,255,0.2)";
    ctx.lineWidth = e.isUniverse ? 1.6 : 1.1;
    if (!e.isUniverse) ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  });

  model.universes.forEach(function(u) {
    var ux = cx + u.x * z, uy = cy + u.y * z;
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,0.14)";
    ctx.beginPath(); ctx.arc(ux, uy, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(ux, uy, 7, 0, Math.PI * 2); ctx.fill();
    ctx.font = "700 12px 'Plus Jakarta Sans',sans-serif";
    ctx.fillStyle = "#f5f2fc";
    ctx.textAlign = "center";
    ctx.fillText(u.name, ux, uy - 14);
    ctx.restore();
    cuHitBoxes.push({ type: "universe", data: u, x: ux, y: uy, r: 20 });
  });

  model.nodes.forEach(function(n) {
    var nx = cx + n.x * z, ny = cy + n.y * z;
    ctx.save();
    ctx.fillStyle = "hsla(" + n.hue + ",92%,65%,0.25)";
    ctx.beginPath(); ctx.arc(nx, ny, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "hsl(" + n.hue + ",92%,70%)";
    ctx.beginPath(); ctx.arc(nx, ny, 5, 0, Math.PI * 2); ctx.fill();
    ctx.font = "500 11px 'Plus Jakarta Sans',sans-serif";
    ctx.fillStyle = "rgba(245,242,252,0.86)";
    ctx.textAlign = "center";
    ctx.fillText(n.film.title, nx, ny + 17);
    ctx.restore();
    cuHitBoxes.push({ type: "node", data: n, x: nx, y: ny, r: 14 });
  });
}

function computePassportId(nameStr, count) {
  var hash = 0, s = String(nameStr || "guest");
  for (var i = 0; i < s.length; i++) hash = ((hash << 5) - hash + s.charCodeAt(i)) | 0;
  var code = Math.abs(hash % 9000) + 1000;
  return "FW-" + String(count).padStart(2, "0") + "-" + code;
}

function buildPassportShareURL() {
  var c = analyzeCinemography();
  var payload = {
    u: user || avatar.name,
    a: avatar.name,
    t: films.length,
    g: c.genres.slice(0, 5).map(function(x) { return [x.name, x.count]; }),
    d: c.directors.slice(0, 3).map(function(x) { return x.name; }),
    uv: c.universes.map(function(u) { return u.name; }),
    ids: films.slice(-20).map(function(f) { return f.tid; })
  };
  try {
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    var base = window.location.href.split("?")[0].split("#")[0];
    return base + "?p=" + encodeURIComponent(b64);
  } catch (e) {
    return window.location.href.split("?")[0];
  }
}

function drawMiniConstellationOnCanvas(canvas) {
  if (!canvas) return;
  var model = buildConstellationModel();
  var ctx = canvas.getContext("2d");
  var w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  for (var i = 0; i < 24; i++) {
    ctx.fillStyle = "rgba(255,255,255," + (0.14 + (i % 4) * 0.08) + ")";
    ctx.beginPath();
    ctx.arc((i * 37) % w, (i * 53) % h, (i % 2) + 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  if (!model.nodes.length) {
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("No stars yet", w / 2, h / 2 + 3);
    return;
  }

  var maxR = 40;
  model.nodes.forEach(function(n) { maxR = Math.max(maxR, Math.hypot(n.x, n.y) + 25); });
  model.universes.forEach(function(u) { maxR = Math.max(maxR, Math.hypot(u.x, u.y) + 25); });
  var scale = (Math.min(w, h) * 0.42) / maxR;
  var cx = w / 2, cy = h / 2;

  model.edges.forEach(function(e) {
    ctx.strokeStyle = e.isUniverse ? "rgba(225,197,255,0.65)" : "rgba(255,255,255,0.28)";
    ctx.lineWidth = e.isUniverse ? 1.2 : 0.8;
    ctx.beginPath();
    ctx.moveTo(cx + e.a.x * scale, cy + e.a.y * scale);
    ctx.lineTo(cx + e.b.x * scale, cy + e.b.y * scale);
    ctx.stroke();
  });

  model.universes.forEach(function(u) {
    var ux = cx + u.x * scale, uy = cy + u.y * scale;
    ctx.fillStyle = "#ffd666";
    ctx.beginPath(); ctx.arc(ux, uy, 3.6, 0, Math.PI * 2); ctx.fill();
  });

  model.nodes.forEach(function(n) {
    var nx = cx + n.x * scale, ny = cy + n.y * scale;
    ctx.fillStyle = "hsl(" + n.hue + ",92%,70%)";
    ctx.beginPath(); ctx.arc(nx, ny, 2.5, 0, Math.PI * 2); ctx.fill();
  });
}

function computeFriendOverlap(friend) {
  if (!friend || !films.length) return null;
  var myIds = {}, myGenres = {}, myDirs = {}, myUnivs = {};
  films.forEach(function(f) {
    myIds[f.tid] = f;
    (f.genres || []).forEach(function(g) { myGenres[g] = (myGenres[g] || 0) + 1; });
    if (f.director) myDirs[f.director] = 1;
  });
  var model = buildConstellationModel();
  model.universes.forEach(function(u) { myUnivs[u.name] = 1; });

  var sharedIds = (friend.ids || []).filter(function(id) { return !!myIds[id]; });
  var sharedGenres = (friend.g || []).filter(function(pair) { return !!myGenres[pair[0]]; }).map(function(pair) { return pair[0]; });
  var sharedDirs = (friend.d || []).filter(function(d) { return !!myDirs[d]; });
  var sharedUnivs = (friend.uv || []).filter(function(u) { return !!myUnivs[u]; });

  var gScore = (friend.g && friend.g.length) ? (sharedGenres.length / friend.g.length) * 45 : 15;
  var fScore = (friend.ids && friend.ids.length) ? Math.min(35, (sharedIds.length / Math.min(friend.ids.length, films.length)) * 70) : 0;
  var dScore = sharedDirs.length ? 10 : 0;
  var uScore = sharedUnivs.length ? 10 : 0;
  var totalPct = Math.min(99, Math.max(12, Math.round(gScore + fScore + dScore + uScore)));

  return {
    pct: totalPct,
    sharedFilms: sharedIds.map(function(id) { return myIds[id].title; }),
    sharedGenres: sharedGenres,
    sharedDirs: sharedDirs,
    sharedUnivs: sharedUnivs
  };
}

      '<div class="pp-book">' +
        '<div class="pp-hdr">' +
          '<div style="display:flex;align-items:center;gap:12px">' +
            '<div class="face" style="width:54px;height:54px">' + avatarGraphic() + '</div>' +
            '<div><div class="cu-eyebrow">Passport Holder · ' + esc(passId) + '</div>' +
            '<h3 style="font-size:21px;margin:2px 0">' + esc(holderName) + '</h3>' +
            '<div class="dim" style="font-size:12px">Mood: ' + esc(avatar.name) + ' · ' + films.length + ' films · ' + c.countries.length + ' countries</div></div>' +
          '</div>' +
          '<span class="cu-status">' + model.universes.length + ' Visas</span>' +
        '</div>' +
        '<div class="pp-id-grid">' +
          '<div>' +
            '<div class="cu-eyebrow" style="margin-bottom:4px">Cinematic Taste Profile</div>' +
            '<div class="pp-bio">' + esc(c.portrait) + '</div>' +
            '<div class="cu-eyebrow" style="margin-top:8px">Signature Reel</div>' +
            stripHtml +
          '</div>' +
          '<div class="pp-const-box">' +
            '<canvas id="pp-mini-const" width="145" height="145" aria-label="Personal constellation print"></canvas>' +
            '<div class="pp-const-lbl">Constellation Print</div>' +
          '</div>' +
        '</div>' +
        '<div class="pp-mrz">' + esc(mrzLine1) + '<br>' + esc(mrzLine2) + '</div>' +
      '</div>';
  } else {
    var stampPageIdx = ppState.page - 2;
    var sliceStart = stampPageIdx * 4;
    var pageUniverses = model.universes.slice(sliceStart, sliceStart + 4);
    var rots = [-2.2, 1.8, -1.4, 2.4];

    var stampsHtml = pageUniverses.length
      ? '<div class="pp-stamps">' + pageUniverses.map(function(u, i) {
          var totalScope = getUniverseScopeCount(u);
          var watchedN = u.watchedNodes.length;
          var isDone = watchedN >= totalScope && totalScope > 0;
          var sortedW = u.watchedNodes.slice().sort(function(a, b) { return (a.film.at || 0) - (b.film.at || 0); });
          var entryDate = sortedW[0] && sortedW[0].film.date ? sortedW[0].film.date : today();
          var shapeCls = (u.id === "mcu" || u.id === "dceu" || u.id === "monsterverse") ? " hex" : "";
          return '<div class="pp-stamp' + (isDone ? ' gold' : '') + shapeCls + '" style="--sc:' + u.hue + ';--rot:' + rots[i % 4] + 'deg">' +
            '<div class="pp-stamp-top"><span>' + (isDone ? '★ FULL CLEARANCE' : 'UNIVERSE VISA') + '</span><span>' + watchedN + '/' + totalScope + ' LOGGED</span></div>' +
            '<div class="pp-stamp-name">' + esc(u.name) + '</div>' +
            '<div class="pp-stamp-meta">First Entry: ' + esc(entryDate) + '</div>' +
            '<div class="pp-stamp-meta">Anchor: ' + esc(sortedW[0] ? sortedW[0].film.title : u.name) + '</div>' +
          '</div>';
        }).join("") + '</div>'
      : '<div style="padding:32px 12px;text-align:center"><p class="dim">No universe stamps inked yet. Log films from any cinematic universe or franchise to earn your first visa stamp.</p></div>';

    bodyHtml =
      '<div class="pp-book">' +
        '<div class="pp-hdr">' +
          '<div><div class="cu-eyebrow">Official Entry Visas</div><h3 style="font-size:20px;margin:2px 0">Discovered Universes</h3></div>' +
          '<span class="cu-badge">Stamps Page ' + (stampPageIdx + 1) + '</span>' +
        '</div>' +
        stampsHtml +
        '<p class="dim" style="font-size:11.5px;margin:16px 0 0;text-align:center">Use ← and → arrows to flip through your passport pages.</p>' +
      '</div>';
  }

  $("panel").innerHTML =
    '<div class="pp-shell" id="pp-booklet">' +
      topControls +
      friendHtml +
      '<div class="pp-stage">' +
        '<button type="button" class="pp-arrow" onclick="ppPrevPage()" ' + (ppState.page <= 0 ? 'disabled' : '') + ' aria-label="Previous passport page">←</button>' +
        bodyHtml +
        '<button type="button" class="pp-arrow" onclick="ppNextPage()" ' + (ppState.page >= totalPages ? 'disabled' : '') + ' aria-label="Next passport page">→</button>' +
      '</div>' +
    '</div>';

  if (ppState.page === 1) {
    var mc = $("pp-mini-const");
    if (mc) drawMiniConstellationOnCanvas(mc);
  }
}

(function checkSharedPassportParam() {
  try {
    var params = new URLSearchParams(window.location.search);
    var raw = params.get("p");
    if (!raw) return;
    var parsed = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (parsed && (parsed.u || parsed.a)) {
      ppState.friendData = parsed;
      setTimeout(function() {
        if (!document.body.classList.contains("locked")) {
          openPassportModal(0);
        }
      }, 450);
    }
  } catch (e) {}
})();

/* Live Entertainment & Upcoming Releases Flash Cards (Auto-refreshes every 30 min) */
var newsCache = { items: [], at: 0 };
function fetchLiveEntertainment(force) {
  if (!force && newsCache.items.length && Date.now() - newsCache.at < 1800000) return;
  Promise.all([
    api("movie/upcoming", { region: "IN" }).catch(function() { return { results: [] }; }),
    api("trending/movie/day").catch(function() { return { results: [] }; })
  ]).then(function(res) {
    var up = (res[0].results || []).slice(0, 3).map(function(m) {
      return { id: m.id, title: m.title, poster: m.poster_path, tag: "Upcoming · " + (m.release_date || "TBA"), sub: m.overview || "" };
    });
    var tr = (res[1].results || []).slice(0, 3).map(function(m) {
      return { id: m.id, title: m.title, poster: m.poster_path, tag: "Trending Today", sub: m.overview || "" };
    });
    newsCache = { items: up.concat(tr).slice(0, 4), at: Date.now() };
    if (view === "universes") render(true);
  });
}
setInterval(function() { fetchLiveEntertainment(true); }, 1800000);

function liveEntertainmentHTML() {
  fetchLiveEntertainment(false);
  var h = '<div class="glass news-wrap"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
    '<div><div class="cu-eyebrow">Live Observatory Feed</div><h3 style="margin:3px 0 0">Upcoming Releases & Cinema Pulse</h3></div>' +
    '<button class="ghost" style="padding:6px 12px;font-size:12px" onclick="fetchLiveEntertainment(true)">Refresh Pulse</button></div>';
  if (!newsCache.items.length) {
    h += '<p class="dim" style="font-size:13px;margin:12px 0 0">Syncing live releases…</p>';
  } else {
    h += '<div class="news-grid">' + newsCache.items.map(function(it) {
      return '<button class="news-card" onclick="openMovieDetail(' + it.id + ')">' +
        (it.poster ? '<img loading="lazy" alt="" src="' + img(it.poster, "w185") + '">' : '') +
        '<div><div class="cu-eyebrow" style="font-size:10px">' + esc(it.tag) + '</div><div class="t" style="margin:4px 0">' + esc(it.title) + '</div><div class="dim" style="font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + esc(it.sub) + '</div></div>' +
      '</button>';
    }).join("") + '</div>';
  }
  return h + '</div>';
}

/* Cinemography Analysis & Shareable Card */
function analyzeCinemography() {
  var gMap = {}, dMap = {}, cMap = {};
  films.forEach(function(f) {
    (f.genres || ["Drama"]).forEach(function(g) { gMap[g] = (gMap[g] || 0) + 1; });
    if (f.director) dMap[f.director] = (dMap[f.director] || 0) + 1;
    (f.countries || []).forEach(function(c) { cMap[c] = (cMap[c] || 0) + 1; });
  });
  var genres = Object.keys(gMap).map(function(k) { return { name: k, count: gMap[k] }; }).sort(function(a, b) { return b.count - a.count; });
  var directors = Object.keys(dMap).map(function(k) { return { name: k, count: dMap[k] }; }).sort(function(a, b) { return b.count - a.count; });
  var countries = Object.keys(cMap);
  var model = buildConstellationModel();

  var portrait = !films.length
    ? "Your cinema profile is a blank canvas. Log a few favorite films to reveal your signature genres, recurring auteurs, and universe footprint."
    : "Drawn strongly toward " + (genres[0] ? genres[0].name : "cinema") +
      (genres[1] ? " and " + genres[1].name : "") + ", your log spans " + films.length +
      (films.length === 1 ? " film" : " films") + " across " + Math.max(1, countries.length) +
      (countries.length === 1 ? " country." : " countries.") +
      (directors[0] ? " " + directors[0].name + " stands out as a recurring voice behind the camera." : "") +
      (model.universes.length ? " You have charted " + model.universes.length + (model.universes.length === 1 ? " cinematic universe." : " cinematic universes.") : " You lean toward standalone stories over sprawling franchises.");

  return { genres: genres, directors: directors, countries: countries, universes: model.universes, portrait: portrait };
}

function cinematographyHTML() {
  var c = analyzeCinemography();
  return '<div class="cg-wrap"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><button class="ghost" onclick="goView('universes')">← Back to Universes</button><button class="btn" onclick="openPassportModal(0)">Open Cinematic Passport</button></div>' +
    '<div class="glass cg-sheet">' +
      '<div class="cu-eyebrow">Fourth wall · Cinemography</div>' +
      '<h1 class="pg" style="margin:6px 0">' + esc(user || avatar.name) + '</h1>' +
      '<p class="dim" style="margin:0 0 14px">Mood: ' + esc(avatar.name) + '</p>' +
      '<div class="cg-stats">' +
        '<div class="cg-box"><small class="dim">Films</small><div class="num" style="font-size:28px">' + films.length + '</div></div>' +
        '<div class="cg-box"><small class="dim">Top Genre</small><div class="num" style="font-size:20px;margin-top:6px">' + esc(c.genres[0] ? c.genres[0].name : "—") + '</div></div>' +
        '<div class="cg-box"><small class="dim">Universes</small><div class="num" style="font-size:28px">' + c.universes.length + '</div></div>' +
      '</div>' +
      '<p style="line-height:1.65">' + esc(c.portrait) + '</p>' +
    '</div></div>';
}

/* Keyboard Shortcuts Modal & Global Key Listener */
function openShortcuts() {
  var rows = [
    [["Tab", "/", "K"], "Toggle Quick-Log Arcade (+)"],
    [["W", "A", "S", "D"], "Move selection cursor in Arcade"],
    [["Space"], "Log selected film immediately"],
    [["Shift"], "Inspect selected film dossier"],
    [["R"], "Shuffle new genre batch in Arcade"],
    [["←", "→"], "Flip Passport pages (when open)"],
    [["Esc"], "Close active modal"]
  ];
  $("panel").innerHTML = '<h2>Observatory Controls</h2>' +
    rows.map(function(r) {
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.09)"><div>' + r[0].map(function(k) { return '<span class="kbd">' + k + '</span>'; }).join(" ") + '</div><span class="dim">' + r[1] + '</span></div>';
    }).join("") +
    '<div class="acts"><button class="btn" data-act="close">Got it</button></div>';
  show(false);
}

window.addEventListener("keydown", function(e) {
  if (document.body.classList.contains("locked")) return;
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (e.target && e.target.isContentEditable)) {
    if (e.key === "Escape") { e.target.blur(); hide(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  var k = e.key, kl = k.toLowerCase();

  if (k === "Tab") {
    e.preventDefault();
    if (inArcade) hide();
    else openSearch();
    return;
  }

  if (ovOn && $("pp-booklet")) {
    if (k === "ArrowRight") { e.preventDefault(); ppNextPage(); return; }
    if (k === "ArrowLeft") { e.preventDefault(); ppPrevPage(); return; }
  }

  if (k === "Escape" && ovOn) { e.preventDefault(); hide(); return; }
  if (k === "?" ) { e.preventDefault(); openShortcuts(); return; }

  if (!ovOn && (k === "/" || kl === "k")) {
    e.preventDefault();
    openSearch();
    return;
  }

  if (inArcade) {
    if (k === "/") { e.preventDefault(); if ($("arc-q")) $("arc-q").focus(); return; }
    if (kl === "r") { e.preventDefault(); cycleArcadeGenre(); return; }
    if (k === " " || k === "Enter") { e.preventDefault(); quickLogArcadeSelected(); return; }
    if (k === "Shift") {
      e.preventDefault();
      var item = arcItems[arcSel];
      if (item) openMovieDetail(item.id);
      return;
    }
    var cols = window.innerWidth <= 760 ? 2 : 4;
    if (kl === "d" || k === "ArrowRight") { e.preventDefault(); arcSel = Math.min(arcItems.length - 1, arcSel + 1); paintArcadeGrid(); }
    else if (kl === "a" || k === "ArrowLeft") { e.preventDefault(); arcSel = Math.max(0, arcSel - 1); paintArcadeGrid(); }
    else if (kl === "s" || k === "ArrowDown") { e.preventDefault(); arcSel = Math.min(arcItems.length - 1, arcSel + cols); paintArcadeGrid(); }
    else if (kl === "w" || k === "ArrowUp") { e.preventDefault(); arcSel = Math.max(0, arcSel - cols); paintArcadeGrid(); }
  }
});

/* Navigation & Master Render */
function goView(v) {
  view = v;
  ["home", "log", "universes", "me"].forEach(function(id) {
    var btn = $("n-" + id);
    if (btn) btn.classList.toggle("on", id === v || (v === "cinemography" && id === "universes"));
  });
  render(true);
}

function render(scrollTop) {
  applyAura();
  side();
  var vEl = $("view");
  if (view === "home") vEl.innerHTML = homeHTML();
  else if (view === "log") vEl.innerHTML = logHTML();
  else if (view === "universes") {
    vEl.innerHTML = universesHTML();
    if (!cuState.listMode) bindConstellation();
  }
  else if (view === "cinemography") vEl.innerHTML = cinematographyHTML();
  else if (view === "me") vEl.innerHTML = meHTML();
  if (scrollTop) window.scrollTo({ top: 0, behavior: "smooth" });
}

/* Boot Session */
(function boot() {
  var saved = null;
  try { saved = localStorage.getItem("fw_session"); } catch (e) {}
  if (saved) {
    enterSession(saved, false);
  } else {
    document.body.classList.add("locked");
    side();
  }
})();
</script>
